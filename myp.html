<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VagusBuk A5.2</title>

<style>

:root{
--bg:#071018;
--card:#101b27;
--text:#eef3f7;
--muted:#93a4b5;

--green:#45d163;
--greenBg:#193726;

--yellow:#ffd54d;
--yellowBg:#4d4015;

--red:#ff6464;
--redBg:#492323;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:
radial-gradient(circle at top,#10233a 0%,#071018 45%);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:620px;
margin:auto;
padding:20px 16px 120px;
}

.header{
text-align:center;
margin-top:26px;
margin-bottom:20px;
}

.logo{
font-size:44px;
font-weight:800;
letter-spacing:-2px;
}

.sub{
color:var(--muted);
margin-top:4px;
font-size:17px;
}

.card{
background:rgba(16,27,39,.9);
border:1px solid rgba(255,255,255,.05);
border-radius:24px;
padding:18px;
margin-bottom:16px;
}

.smallTitle{
color:var(--muted);
text-transform:uppercase;
letter-spacing:1px;
font-size:13px;
margin-bottom:10px;
}

.hrvRow{
display:flex;
align-items:end;
justify-content:space-between;
}

.hrvValue{
font-size:56px;
font-weight:800;
line-height:1;
}

.hrvAvg{
text-align:right;
color:var(--muted);
font-size:16px;
}

.hrvText{
margin-top:12px;
font-size:18px;
}

input{
width:100%;
margin-top:14px;
background:#09131d;
border:none;
color:white;
border-radius:18px;
padding:16px;
font-size:28px;
}

.saveBtn{
width:100%;
margin-top:12px;
border:none;
border-radius:18px;
padding:16px;
font-size:18px;
font-weight:700;
background:linear-gradient(135deg,#39b953,#22853a);
color:white;
}

.stateBtn{
width:100%;
border:none;
border-radius:22px;
padding:22px;
margin-top:12px;
text-align:left;
color:white;
}

.green{
background:linear-gradient(135deg,#173824,#225234);
}

.yellow{
background:linear-gradient(135deg,#4b3d12,#635018);
}

.red{
background:linear-gradient(135deg,#462121,#5f2c2c);
}

.stateTop{
display:flex;
align-items:center;
gap:16px;
}

.emoji{
font-size:34px;
}

.stateTitle{
font-size:28px;
font-weight:800;
}

.stateText{
margin-top:4px;
color:rgba(255,255,255,.82);
font-size:16px;
}

.recommendation{
margin-top:14px;
background:#162534;
border-radius:18px;
padding:16px;
display:none;
}

.recTitle{
font-size:14px;
color:var(--muted);
text-transform:uppercase;
letter-spacing:1px;
}

.recMain{
margin-top:8px;
font-size:28px;
font-weight:800;
}

.recText{
margin-top:8px;
color:#d6e0e7;
line-height:1.5;
}

.startBtn{
width:100%;
margin-top:16px;
border:none;
border-radius:18px;
padding:18px;
font-size:20px;
font-weight:700;
background:linear-gradient(135deg,#3ebd59,#25833b);
color:white;
}

.overlay{
position:fixed;
inset:0;
background:#071018;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
z-index:999;
}

.circle{
width:170px;
height:170px;
border-radius:50%;
background:
radial-gradient(circle,#48db67 0%,#1f7c35 70%);
transition:2s ease-in-out;
box-shadow:0 0 60px rgba(72,219,103,.25);
}

.expand{
transform:scale(1.18);
}

.phase{
margin-top:30px;
font-size:38px;
font-weight:800;
}

.timer{
margin-top:10px;
font-size:82px;
font-weight:800;
}

.info{
margin-top:20px;
color:var(--muted);
max-width:500px;
line-height:1.5;
font-size:20px;
}

.stopBtn{
margin-top:40px;
border:none;
border-radius:18px;
background:#243240;
color:white;
padding:18px 30px;
font-size:18px;
}

@media(max-width:600px){

.logo{
font-size:40px;
}

.hrvValue{
font-size:48px;
}

.phase{
font-size:32px;
}

.timer{
font-size:70px;
}
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">VagusBuk</div>
<div class="sub">
Ruhiger. Stabiler. Weniger Überlastung.
</div>
</div>

<!-- HRV -->
<div class="card">

<div class="smallTitle">
HRV morgens
</div>

<div class="hrvRow">

<div class="hrvValue" id="todayHRV">
--
</div>

<div class="hrvAvg" id="avgText">
Noch keine Daten
</div>

</div>

<div class="hrvText" id="hrvMessage">
Direkt nach dem Aufwachen messen.
</div>

<input
type="number"
id="hrvInput"
placeholder="z.B. 41"
>

<button class="saveBtn" id="saveBtn">
Speichern
</button>

</div>

<!-- STATE -->
<div class="card">

<div class="smallTitle">
Wie ist es gerade?
</div>

<button
class="stateBtn green"
onclick="chooseState('good')"
>

<div class="stateTop">

<div class="emoji">🙂</div>

<div>
<div class="stateTitle">
Stabil
</div>

<div class="stateText">
Ich fühle mich ruhig.
</div>
</div>

</div>

</button>

<button
class="stateBtn yellow"
onclick="chooseState('mid')"
>

<div class="stateTop">

<div class="emoji">😕</div>

<div>
<div class="stateTitle">
Kippt leicht
</div>

<div class="stateText">
Erste Überlastung.
</div>
</div>

</div>

</button>

<button
class="stateBtn red"
onclick="chooseState('bad')"
>

<div class="stateTop">

<div class="emoji">😣</div>

<div>
<div class="stateTitle">
Kippt
</div>

<div class="stateText">
Ich bin überreizt.
</div>
</div>

</div>

</button>

<!-- Recommendation -->
<div class="recommendation" id="recommendation">

<div class="recTitle">
Empfohlene Übung
</div>

<div class="recMain" id="recMain">
Beruhigung
</div>

<div class="recText" id="recText">
Ruhig werden.
</div>

<button
class="startBtn"
onclick="startRecommended()"
>
Übung starten
</button>

</div>

</div>

</div>

<!-- SESSION -->
<div class="overlay" id="overlay">

<div class="circle" id="circle"></div>

<div class="phase" id="phase">
Vorbereitung
</div>

<div class="timer" id="timer">
60
</div>

<div class="info" id="info">
Ruhig werden.
</div>

<button
class="stopBtn"
onclick="stopSession()"
>
Abbrechen
</button>

</div>

<script>

// ---------------- RESET OLD FORMAT
try{

const old = JSON.parse(
localStorage.getItem("vb_hrv")
);

if(old && typeof old[0] === "number"){

localStorage.removeItem("vb_hrv");
}

}catch(e){}

// ---------------- STORAGE
let hrvData = JSON.parse(
localStorage.getItem("vb_hrv")
) || [];

let currentMode = null;

// ---------------- AUDIO
let audioReady = false;

function unlockAudio(){

if(audioReady) return;

audioReady = true;

speechSynthesis.speak(
new SpeechSynthesisUtterance(" ")
);
}

function speak(text){

if(!audioReady) return;

speechSynthesis.cancel();

let msg =
new SpeechSynthesisUtterance(text);

msg.lang = "de-DE"
msg.rate = 0.92;

speechSynthesis.speak(msg);
}

// ---------------- HRV
function saveHRV(){

let val = parseInt(
document.getElementById("hrvInput").value
);

if(!val) return;

hrvData.push({
value:val,
time:Date.now()
});

hrvData = hrvData.slice(-14);

localStorage.setItem(
"vb_hrv",
JSON.stringify(hrvData)
);

updateHRV();
}

function updateHRV(){

if(hrvData.length === 0){

document.getElementById("todayHRV")
.innerText = "--"

return;
}

let today =
hrvData[hrvData.length-1].value;

let avg = Math.round(
hrvData.reduce((a,b)=>a+b.value,0)
/ hrvData.length
);

document.getElementById("todayHRV")
.innerText = today;

document.getElementById("avgText")
.innerText =
"Ø " + avg;

let msg =
document.getElementById("hrvMessage");

if(today > avg){

msg.innerText =
"Heute eher belastbar."

} else if(today < avg){

msg.innerText =
"Heute vorsichtig bleiben."

} else {

msg.innerText =
"Heute normales Niveau."
}
}

// ---------------- RECOMMEND
function chooseState(state){

unlockAudio();

const box =
document.getElementById(
"recommendation"
);

box.style.display = "block"

if(state === "good"){

currentMode = "training"

document.getElementById("recMain")
.innerText =
"5 Min HRV Training"

document.getElementById("recText")
.innerText =
"Langsames Atmen und Summen stärken die vagale Regulation."

}

if(state === "mid"){

currentMode = "micro"

document.getElementById("recMain")
.innerText =
"Kurze Stabilisierung"

document.getElementById("recText")
.innerText =
"Schultern lösen und langsamer ausatmen."

}

if(state === "bad"){

currentMode = "emergency"

document.getElementById("recMain")
.innerText =
"Akut beruhigen"

document.getElementById("recText")
.innerText =
"Klopfen + langsames Ausatmen helfen bei Überreizung."
}
}

// ---------------- SESSION
let interval = null;

function openOverlay(){

document.getElementById("overlay")
.style.display = "flex"
}

function closeOverlay(){

document.getElementById("overlay")
.style.display = "none"
}

function setPhase(t){
document.getElementById("phase")
.innerText=t;
}

function setTimer(t){
document.getElementById("timer")
.innerText=t;
}

function setInfo(t){
document.getElementById("info")
.innerText=t;
}

function pulseIn(){

document.getElementById("circle")
.classList.add("expand");
}

function pulseOut(){

document.getElementById("circle")
.classList.remove("expand");
}

function stopSession(){

clearInterval(interval);

speechSynthesis.cancel();

closeOverlay();
}

// ---------------- START
function startRecommended(){

if(currentMode === "training"){
startHRV();
}

if(currentMode === "micro"){
startMicro();
}

if(currentMode === "emergency"){
startEmergency();
}
}

// ---------------- MICRO
function startMicro(){

openOverlay();

let t = 30;

setPhase("Schultern lösen");

setInfo(
"Lass deine Schultern langsam sinken."
);

speak(
"Schultern lösen."
);

interval = setInterval(()=>{

t--;

setTimer(t);

if(t <= 0){

finishSession(
"Etwas ruhiger."
);
}

},1000);
}

// ---------------- EMERGENCY
function startEmergency(){

openOverlay();

let t = 25;

setPhase("Brustbein klopfen");

setInfo(
"Sanftes Klopfen hilft dem Nervensystem Sicherheit zu spüren."
);

speak(
"Klopfe jetzt sanft auf dein Brustbein."
);

interval = setInterval(()=>{

t--;

setTimer(t);

if(t <= 0){

clearInterval(interval);

startBreathingRecovery();
}

},1000);
}

// ---------------- BREATH
function startBreathingRecovery(){

let t = 45;
let cycle = 0;

setInfo(
"Längeres Ausatmen beruhigt."
);

interval = setInterval(()=>{

t--;
cycle++;

setTimer(t);

if(cycle % 10 < 4){

setPhase("Einatmen");
pulseIn();

} else {

setPhase("Ausatmen");
pulseOut();
}

if(cycle % 10 === 1){

speak("Ein");
}

if(cycle % 10 === 5){

speak("Aus");
}

if(t <= 0){

finishSession(
"Beruhigt."
);
}

},1000);
}

// ---------------- HRV
function startHRV(){

openOverlay();

let t = 300;
let cycle = 0;

setInfo(
"Langsame Atmung stärkt vagale Regulation."
);

speak(
"Wir starten ruhig."
);

interval = setInterval(()=>{

t--;
cycle++;

setTimer(formatTime(t));

if(t > 100){

if(cycle % 12 < 5){

setPhase("Einatmen");
pulseIn();

} else {

setPhase("Lang ausatmen");
pulseOut();
}

} else {

setPhase(
"Summen beim Ausatmen"
);

pulseOut();

if(cycle % 6 === 0){

speak("Voooo");
}
}

if(t <= 0){

finishSession(
"Training abgeschlossen."
);
}

},1000);
}

// ---------------- FINISH
function finishSession(text){

clearInterval(interval);

setPhase("Fertig");

setInfo(text);

speak("Fertig.");

setTimeout(()=>{

closeOverlay();

},2200);
}

// ---------------- HELPER
function formatTime(sec){

let m = Math.floor(sec/60);
let s = sec%60;

return `${m}:${s.toString().padStart(2,"0")}`;
}

// ---------------- INIT
document.getElementById("saveBtn")
.onclick = saveHRV;

updateHRV();

</script>

</body>
</html>
