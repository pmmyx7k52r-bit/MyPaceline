<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk</title>

<style>
body {
margin:0;
font-family:-apple-system,sans-serif;
background:#0b0f14;
color:#e8eef2;
text-align:center;
}
.container { padding:20px; }

button {
width:90%;
max-width:420px;
margin:6px;
padding:16px;
font-size:16px;
border-radius:12px;
border:none;
color:white;
}

.red { background:#4a2b2b; }
.green { background:#2b4a3a; }
.yellow { background:#5a4a2b; }
.gray { background:#444; }

.timer { font-size:42px; margin-top:10px; }
.phase { font-size:20px; margin-top:6px; }

.box {
background:#15202b;
margin-top:10px;
border-radius:10px;
padding:12px;
}
.hidden { display:none; }
</style>
</head>

<body>

<h2>VagusBuk</h2>

<div class="container">

<!-- STEP 1 -->
<div id="checkBox" class="box">
<b>Wie ist es gerade?</b><br>
<button id="btnGood" class="green">🟢 stabil</button>
<button id="btnMid" class="yellow">🟡 kippt leicht</button>
<button id="btnBad" class="red">🔴 kippt</button>
</div>

<!-- STEP 2 -->
<div id="contextBox" class="box hidden">
<b>Was war gerade?</b><br>
<button data-context="talk">💬 Gespräch</button>
<button data-context="screen">📱 Bildschirm</button>
<button data-context="thinking">🧠 Denken</button>
<button data-context="tired">😴 müde</button>
<button data-context="unknown">❓ egal</button>
</div>

<!-- STEP 3 -->
<div id="actionBox" class="box hidden">
<b>Übung</b><br>
<button id="btnEmergency" class="red">Akut (Klopfen)</button>
<button id="btnHRV" class="green">5 Minuten ruhig</button>
<button id="btnStop" class="gray">Abbrechen</button>
<button id="btnReset" class="gray">Zurück</button>
</div>

<div id="timer" class="timer"></div>
<div id="phase" class="phase"></div>
<div id="info"></div>

</div>

<script>

// ---------- STATE
let interval = null;
let currentState = null;
let crashLog = JSON.parse(localStorage.getItem("vb_crashlog")) || [];
let audioReady = false;

// ---------- UI
const checkBox = document.getElementById("checkBox");
const contextBox = document.getElementById("contextBox");
const actionBox = document.getElementById("actionBox");

function show(el){ el.classList.remove("hidden"); }
function hide(el){ el.classList.add("hidden"); }

function setPhase(t){ document.getElementById("phase").innerText = t; }
function setTimer(t){ document.getElementById("timer").innerText = t; }
function showInfo(t){ document.getElementById("info").innerHTML = t; }

// ---------- AUDIO (iOS fix)
function unlockAudio(){
if(audioReady) return;
audioReady = true;
let msg = new SpeechSynthesisUtterance(" ");
speechSynthesis.speak(msg);
}

function speak(text){
if(!audioReady) return;
speechSynthesis.cancel();
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "de-DE"
msg.rate = 0.9;
speechSynthesis.speak(msg);
}

// ---------- RESET (ZENTRAL!)
function resetApp(){

clearInterval(interval);
speechSynthesis.cancel();

show(checkBox);
hide(contextBox);
hide(actionBox);

setPhase("");
setTimer("");
showInfo("Bereit.");
}

// ---------- STOP
function stopAll(){

clearInterval(interval);
speechSynthesis.cancel();

setPhase("Abgebrochen");
setTimer("");
showInfo("Abgebrochen – wird zurückgesetzt.");

setTimeout(resetApp, 2000);
}

// ---------- STEP 1
function handleState(state){

unlockAudio();

currentState = state;

if(state === "good"){
showInfo("Stabil – nichts tun.");
speak("Alles gut.");
return;
}

hide(checkBox);
show(contextBox);

showInfo("Was war der Auslöser?");
}

// ---------- STEP 2
function chooseContext(context){

hide(contextBox);
show(actionBox);

crashLog.push({
type: currentState,
context,
hour: new Date().getHours(),
time: Date.now()
});

crashLog = crashLog.slice(-100);
localStorage.setItem("vb_crashlog", JSON.stringify(crashLog));

if(currentState === "mid"){
showInfo("Leicht → kurzer Reset");
startMicro();
}

if(currentState === "bad"){
showInfo("Stark → sofort runterfahren");
startEmergency();
}
}

// ---------- MICRO
function startMicro(){

clearInterval(interval);

let t = 20;
setPhase("Schultern lösen");
speak("Schultern hoch und loslassen.");

interval = setInterval(()=>{
t--;
setTimer(t);

if(t <= 0){
clearInterval(interval);
setPhase("Fertig");
speak("Fertig.");
setTimeout(resetApp, 2000);
}
},1000);
}

// ---------- AKUT
function startEmergency(){

clearInterval(interval);

let t = 20;
setPhase("Brust klopfen");
speak("Klopfe sanft.");

interval = setInterval(()=>{
t--;
setTimer(t);

if(t <= 0){
clearInterval(interval);
startBreath();
}
},1000);
}

// ---------- BREATH
function startBreath(){

let t = 40;
let pt = 0;

interval = setInterval(()=>{
t--; pt++;
setTimer(t);

if(pt % 10 < 4){
setPhase("Einatmen");
} else {
setPhase("Ausatmen");
}

if(pt % 10 === 0) speak("Ein");
if(pt % 10 === 4) speak("Aus");

if(t <= 0){
clearInterval(interval);
setPhase("Fertig");
speak("Fertig.");
setTimeout(resetApp, 2000);
}

},1000);
}

// ---------- HRV + SUMMEN
function startHRV(){

clearInterval(interval);

let t = 300;
let pt = 0;

speak("Langsam starten.");

interval = setInterval(()=>{

t--;
pt++;

setTimer(t);

if(t > 120){
setPhase("Summen beim Ausatmen");
if(pt % 6 === 0) speak("Voooo");
} else {
if(pt % 12 < 5){
setPhase("Ein");
} else {
setPhase("Aus");
}
}

if(t <= 0){
clearInterval(interval);
setPhase("Fertig");
speak("Fertig.");
setTimeout(resetApp, 2000);
}

},1000);
}

// ---------- EVENTS
document.getElementById("btnGood").addEventListener("click",()=>handleState("good"));
document.getElementById("btnMid").addEventListener("click",()=>handleState("mid"));
document.getElementById("btnBad").addEventListener("click",()=>handleState("bad"));

document.querySelectorAll("[data-context]").forEach(btn=>{
btn.addEventListener("click", ()=>chooseContext(btn.dataset.context));
});

document.getElementById("btnEmergency").addEventListener("click", startEmergency);
document.getElementById("btnHRV").addEventListener("click", startHRV);
document.getElementById("btnStop").addEventListener("click", stopAll);
document.getElementById("btnReset").addEventListener("click", resetApp);

// ---------- INIT
resetApp();

</script>

</body>
</html>
