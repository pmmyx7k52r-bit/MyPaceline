<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk 1.1</title>

<style>
body {
margin: 0;
font-family: -apple-system, sans-serif;
background: #0b0f14;
color: #e8eef2;
text-align: center;
}

h1 { margin-top: 20px; }

.container { padding: 20px; }

button {
width: 90%;
max-width: 400px;
margin: 10px;
padding: 18px;
font-size: 18px;
border-radius: 12px;
border: none;
background: #1c2733;
color: white;
}

.state-green { background: #1f3d2b; }
.state-yellow { background: #4a3f1d; }
.state-red { background: #4a1d1d; }
.state-black { background: #111; }

.hidden { display: none; }

.timer { font-size: 48px; margin: 20px; }

.log {
text-align: left;
max-width: 400px;
margin: auto;
font-size: 14px;
}
</style>
</head>

<body>

<h1>VagusBuk 1.1</h1>

<div class="container" id="home">
<h3>Zustand wählen</h3>

<button onclick="quickStart()">Letzte gute Übung</button>

<button class="state-green" onclick="startSession('stable')">Stabil</button>
<button class="state-yellow" onclick="startSession('tense')">Angespannt</button>
<button class="state-red" onclick="startSession('overstimulated')">Überreizt</button>
<button class="state-black" onclick="startSession('crash')">Crash</button>

<button onclick="showLog()">Verlauf</button>
</div>

<div class="container hidden" id="session">
<h3 id="exerciseTitle"></h3>
<p id="instruction"></p>
<div class="timer" id="timer"></div>
<button onclick="finishSession()">Fertig</button>
</div>

<div class="container hidden" id="feedback">
<h3>Wie war es?</h3>
<button onclick="saveFeedback('better')">Besser</button>
<button onclick="saveFeedback('same')">Gleich</button>
<button onclick="saveFeedback('worse')">Schlechter</button>
</div>

<div class="container hidden" id="logView">
<h3>Verlauf</h3>
<div id="patterns"></div>
<div class="log" id="log"></div>
<button onclick="goHome()">Zurück</button>
</div>

<script>
let currentState = ""
let currentExercise = ""
let duration = 60;
let interval;

const exercises = {
stable: [
{name:"Resonanzatmung", text:"5 ein / 5 aus"},
{name:"Summen", text:"ruhig summen beim Ausatmen"}
],
tense: [
{name:"4-6 Atmung", text:"4 ein / 6 aus"},
{name:"Nacken lösen", text:"langsame Kopfbewegungen"}
],
overstimulated: [
{name:"Augen zu + Atmung", text:"nur ausatmen, nichts denken"},
{name:"Dunkel + Ruhe", text:"Reize reduzieren"}
],
crash: [
{name:"Minimalmodus", text:"Augen zu, liegen bleiben"},
{name:"Still liegen", text:"keine Bewegung"}
]
};

function startSession(state) {
currentState = state;

let ex = selectBestExercise(state);

currentExercise = ex.name;

duration = getDuration(state);

document.getElementById("home").classList.add("hidden");
document.getElementById("session").classList.remove("hidden");

document.getElementById("exerciseTitle").innerText = ex.name;
document.getElementById("instruction").innerText = ex.text;

startTimer();
}

function selectBestExercise(state) {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let stateLogs = log.filter(e => e.state === state && e.result === "better");

if (stateLogs.length === 0) {
return exercises[state][0];
}

let lastGood = stateLogs[stateLogs.length - 1].exercise;
return exercises[state].find(e => e.name === lastGood) || exercises[state][0];
}

function getDuration(state) {
if (state === "crash") return 90;
if (state === "overstimulated") return 60;
if (state === "tense") return 90;
return 120;
}

function startTimer() {
let time = duration;
document.getElementById("timer").innerText = time;

interval = setInterval(() => {
time--;
document.getElementById("timer").innerText = time;
if (time <= 0) clearInterval(interval);
}, 1000);
}

function finishSession() {
clearInterval(interval);
document.getElementById("session").classList.add("hidden");
document.getElementById("feedback").classList.remove("hidden");
}

function saveFeedback(result) {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];

log.push({
date: new Date().toLocaleString(),
state: currentState,
exercise: currentExercise,
result: result
});

localStorage.setItem("vagusLog", JSON.stringify(log));
goHome();
}

function quickStart() {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let last = log.reverse().find(e => e.result === "better");

if (!last) return;

currentState = last.state;
currentExercise = last.exercise;
duration = getDuration(last.state);

document.getElementById("home").classList.add("hidden");
document.getElementById("session").classList.remove("hidden");

document.getElementById("exerciseTitle").innerText = last.exercise;
document.getElementById("instruction").innerText = "Wiederholen"

startTimer();
}

function showLog() {
document.getElementById("home").classList.add("hidden");
document.getElementById("logView").classList.remove("hidden");

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let container = document.getElementById("log");
let patterns = document.getElementById("patterns");

container.innerHTML = ""
patterns.innerHTML = ""

if (log.length >= 5) {
let bad = log.filter(e => e.result === "worse").length;
if (bad > log.length / 2) {
patterns.innerHTML = "<p>⚠️ Viele Verschlechterungen → Belastung zu hoch</p>"
}
}

log.slice().reverse().forEach(e => {
container.innerHTML += `
<p>
${e.date}<br>
${e.state} – ${e.exercise} → ${e.result}
</p><hr>`;
});
}

function goHome() {
document.getElementById("feedback").classList.add("hidden");
document.getElementById("logView").classList.add("hidden");
document.getElementById("session").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}
</script>

</body>
</html>
