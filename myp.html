<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk</title>

<style>
body {margin:0;font-family:-apple-system;background:#0b0f14;color:#e8eef2;text-align:center;}
.container{padding:20px;}
button{width:90%;max-width:420px;margin:6px;padding:16px;font-size:16px;border-radius:12px;border:none;color:white;}
.red{background:#4a2b2b;} .green{background:#2b4a3a;} .yellow{background:#5a4a2b;} .gray{background:#444;}
.timer{font-size:42px;margin-top:10px;} .phase{font-size:20px;margin-top:6px;}

.accordion{background:#15202b;margin-top:10px;border-radius:10px;overflow:hidden;}
.accordion-header{padding:14px;background:#1f2a36;cursor:pointer;}
.accordion-content{display:none;padding:12px;}
.accordion.open .accordion-content{display:block;}
</style>
</head>

<body>

<h2>VagusBuk</h2>

<div class="container">

<!-- CHECK -->
<div class="accordion open" id="acc_check">
<div class="accordion-header" onclick="toggleAccordion('acc_check')">🧠 Wie ist es gerade?</div>
<div class="accordion-content">
<button class="green" onclick="checkState('good')">🟢 stabil</button>
<button class="yellow" onclick="checkState('mid')">🟡 kippt leicht</button>
<button class="red" onclick="checkState('bad')">🔴 kippt</button>
</div>
</div>

<!-- CONTEXT -->
<div class="accordion" id="acc_context">
<div class="accordion-header">Kontext</div>
<div class="accordion-content" id="contextBox">
<button onclick="selectContext('talk')">💬 Gespräch</button>
<button onclick="selectContext('screen')">📱 Bildschirm</button>
<button onclick="selectContext('thinking')">🧠 Denken</button>
<button onclick="selectContext('tired')">😴 müde</button>
<button onclick="selectContext('unknown')">❓ egal</button>
</div>
</div>

<!-- ACTION -->
<div class="accordion" id="acc_actions">
<div class="accordion-header" onclick="toggleAccordion('acc_actions')">Übungen</div>
<div class="accordion-content">
<button class="red" onclick="startEmergency()">Akut</button>
<button class="green" onclick="startHRV()">5 Min ruhig</button>
<button class="gray" onclick="stopAll()">Abbrechen</button>
</div>
</div>

<div id="timer" class="timer"></div>
<div id="phase" class="phase"></div>
<div id="info"></div>

</div>

<script>

let interval=null;
let crashLog=JSON.parse(localStorage.getItem("vb_crashlog"))||[];
let lastHintTime=0;

let pendingState=null;

// -------- UI
function setPhase(t){document.getElementById("phase").innerText=t;}
function setTimer(t){document.getElementById("timer").innerText=t;}
function showInfo(t){document.getElementById("info").innerHTML=t;}

function toggleAccordion(id){
let el=document.getElementById(id);
el.classList.toggle("open");
}

// -------- VOICE
function speak(t){
speechSynthesis.cancel();
let m=new SpeechSynthesisUtterance(t);
m.lang="de-DE" m.rate=0.9;
speechSynthesis.speak(m);
}

// -------- STOP
function stopAll(){
clearInterval(interval);
speechSynthesis.cancel();
setPhase("Abgebrochen"); setTimer("");
showInfo("Abgebrochen – ok.");
}

// -------- CHECK
function checkState(s){

if(s==="good"){showInfo("Stabil.");return;}

pendingState=s;
document.getElementById("acc_context").classList.add("open");
}

// -------- SAVE
function selectContext(c){

document.getElementById("acc_context").classList.remove("open");

let h=new Date().getHours();

crashLog.push({type:pendingState,hour:h,context:c,time:Date.now()});
crashLog=crashLog.slice(-100);
localStorage.setItem("vb_crashlog",JSON.stringify(crashLog));

if(pendingState==="mid") startMicro();
if(pendingState==="bad") startEmergency();
}

// -------- MICRO
function startMicro(){
clearInterval(interval);
let t=20;
setPhase("Schultern lösen");
interval=setInterval(()=>{
t--; setTimer(t);
if(t<=0){clearInterval(interval); setPhase("Fertig");}
},1000);
}

// -------- AKUT
function startEmergency(){
clearInterval(interval);
let t=20;
setPhase("Klopfen Brust");
interval=setInterval(()=>{
t--; setTimer(t);
if(t<=0){clearInterval(interval); startBreath();}
},1000);
}

// -------- BREATH
function startBreath(){
let t=40,pt=0;
interval=setInterval(()=>{
t--; pt++; setTimer(t);
if(pt%10<4){setPhase("Ein");}else{setPhase("Aus");}
if(t<=0){clearInterval(interval); setPhase("Fertig");}
},1000);
}

// -------- HRV
function startHRV(){
clearInterval(interval);
let t=300,pt=0;
interval=setInterval(()=>{
t--; pt++; setTimer(t);
if(pt%12<5){setPhase("Ein");}else{setPhase("Aus");}
if(t<=0){clearInterval(interval); setPhase("Fertig");}
},1000);
}

// -------- PATTERN
function analyze(){

let hMap={},cMap={};

crashLog.forEach(e=>{
hMap[e.hour]=(hMap[e.hour]||0)+1;
cMap[e.context]=(cMap[e.context]||0)+1;
});

let h=null,hc=0,c=null,cc=0;

for(let k in hMap){if(hMap[k]>hc){hc=hMap[k];h=k;}}
for(let k in cMap){if(cMap[k]>cc){cc=cMap[k];c=k;}}

return{h,hc,c,cc};
}

// -------- AUTO ACTION (A4.2)
function autoIntervene(){

let now=Date.now();
if(now-lastHintTime<3600000) return;

let p=analyze();
let hour=new Date().getHours();

if(p.h && p.hc>=3 && Math.abs(hour-p.h)<=1){

lastHintTime=now;

document.getElementById("acc_actions").classList.add("open");

showInfo("Jetzt typischer Zeitpunkt → kurzer Reset");

speak("Jetzt kurz runterfahren.");

startMicro();
return;
}

if(p.c && p.cc>=3){

lastHintTime=now;

document.getElementById("acc_actions").classList.add("open");

if(p.c==="screen"){
showInfo("Nach Bildschirm → Summen");
speak("Summen hilft jetzt.");
startHRV();
}

if(p.c==="talk"){
showInfo("Nach Gespräch → Klopfen");
speak("Klopfen hilft jetzt.");
startEmergency();
}

if(p.c==="thinking"){
showInfo("Bei Denken → kurzer Reset");
startMicro();
}

if(p.c==="tired"){
showInfo("Müdigkeit → ruhig atmen");
startHRV();
}
}
}

// alle 30 min prüfen
setInterval(autoIntervene,1800000);

</script>

</body>
</html>
