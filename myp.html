<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk A1</title>

<style>
body {
margin:0;
font-family:-apple-system,sans-serif;
background:#0b0f14;
color:#e8eef2;
text-align:center;
}

.container { padding:30px; }

button {
width:90%;
max-width:420px;
padding:22px;
font-size:20px;
border-radius:16px;
border:none;
background:#2b4a3a;
color:white;
}

.timer {
font-size:50px;
margin-top:30px;
}

.phase {
font-size:22px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>VagusBuk</h1>

<div class="container">

<button onclick="start()">
Es kippt gerade
</button>

<div id="timer" class="timer"></div>
<div id="phase" class="phase"></div>

</div>

<script>

let t = 0;
let interval = null;

// ----------------------------
// VOICE
// ----------------------------
function speak(text) {
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "de-DE"
msg.rate = 0.9;
speechSynthesis.speak(msg);
}

// ----------------------------
// START
// ----------------------------
function start() {

clearInterval(interval);

t = 20;

document.getElementById("phase").innerText =
"Schultern hochziehen"

speak("Zieh die Schultern hoch.");

interval = setInterval(() => {

t--;
document.getElementById("timer").innerText = t;

if (t === 15) {
document.getElementById("phase").innerText = "Halten"
speak("Halten.");
}

if (t === 10) {
document.getElementById("phase").innerText = "Loslassen"
speak("Loslassen.");
}

if (t === 0) {
clearInterval(interval);
startBreath();
}

}, 1000);
}

// ----------------------------
// BREATH
// ----------------------------
function startBreath() {

let timeLeft = 40;
let cycle = 0;

speak("Vier ein. Sechs aus.");

interval = setInterval(() => {

timeLeft--;
cycle++;

document.getElementById("timer").innerText = timeLeft;

if (cycle % 10 < 4) {
document.getElementById("phase").innerText = "Einatmen"
} else {
document.getElementById("phase").innerText = "Ausatmen"
}

if (timeLeft <= 0) {
finish();
}

}, 1000);
}

// ----------------------------
// FINISH
// ----------------------------
function finish() {

clearInterval(interval);

document.getElementById("phase").innerText =
"Hand auf Brust – kurz spüren"

speak("Lege eine Hand auf deine Brust.");

let t2 = 10;

interval = setInterval(() => {

t2--;
document.getElementById("timer").innerText = t2;

if (t2 <= 0) {
clearInterval(interval);
document.getElementById("phase").innerText = "Fertig"
speak("Fertig.");
}

}, 1000);
}

</script>

</body>
</html>
