<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VagusBuk 8.0</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#07121d;
color:#fff;
padding:16px;
}
.app{
max-width:540px;
margin:0 auto;
padding-bottom:120px;
}
.card{
background:#0d1b29;
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:16px;
margin-bottom:14px;
}
.logo{
font-size:42px;
font-weight:900;
letter-spacing:-2px;
}
.subtitle{
color:#9fb3c8;
margin-top:8px;
margin-bottom:18px;
}
.heroTitle{
font-size:30px;
font-weight:900;
margin-bottom:12px;
}
.heroText{
font-size:17px;
line-height:1.5;
color:#d8e3ee;
}
.kpiGrid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
}
.kpi{
background:rgba(255,255,255,.04);
border-radius:18px;
padding:12px;
}
.kpiLabel{
font-size:11px;
color:#8ea2b6;
margin-bottom:8px;
}
.kpiValue{
font-size:30px;
font-weight:900;
}
.kpiHint{
margin-top:6px;
font-size:12px;
color:#b2c2d1;
}
.inputWrap{
display:flex;
gap:10px;
}
input{
flex:1;
height:56px;
border:none;
border-radius:18px;
background:#10263b;
padding:0 16px;
color:white;
font-size:22px;
font-weight:800;
}
button{
border:none;
cursor:pointer;
color:white;
font-weight:800;
}
.saveBtn{
height:56px;
padding:0 18px;
border-radius:18px;
background:linear-gradient(135deg,#46dd75,#268646);
}
.statusGrid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-top:12px;
}
.statusBtn{
height:44px;
border-radius:14px;
background:#17314b;
}
.statusBtn.active{
outline:2px solid #70d1ff;
}
.chart{
height:140px;
display:flex;
align-items:flex-end;
gap:8px;
}
.barWrap{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
}
.bar{
width:100%;
background:linear-gradient(180deg,#8ef3a4,#2c9448);
border-radius:10px 10px 4px 4px;
}
.barLabel{
font-size:10px;
margin-top:6px;
color:#8ea2b6;
}
.barValue{
font-size:10px;
margin-bottom:6px;
}
.bottomBar{
position:fixed;
left:0;
right:0;
bottom:0;
padding:12px;
background:rgba(3,10,18,.95);
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
}
.actionBtn{
height:58px;
border-radius:18px;
}
.trainBtn{background:linear-gradient(135deg,#42dc70,#258946)}
.recoveryBtn{background:linear-gradient(135deg,#5d8ff0,#355cb1)}
.sosBtn{background:linear-gradient(135deg,#d96060,#7c2222)}

.overlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(1,7,14,.96);
z-index:999;
padding:24px;
}
.overlay.active{
display:flex;
}
.modeTitle{
font-size:34px;
font-weight:900;
}
.modePhase{
font-size:28px;
margin-top:12px;
}
.modeHint{
margin-top:10px;
color:#dbe6f1;
text-align:center;
line-height:1.5;
max-width:320px;
}
.ball{
width:110px;
height:110px;
border-radius:50%;
background:radial-gradient(circle at 35% 35%,#d8fcff,#4abaff);
margin-top:30px;
transition:transform 4s ease;
box-shadow:0 0 50px rgba(75,189,255,.4);
}
.timer{
font-size:56px;
font-weight:900;
margin-top:24px;
}
.closeBtn{
margin-top:24px;
padding:16px 24px;
border-radius:16px;
background:#1c334a;
}
@media(max-width:560px){
.kpiGrid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="app">

<div class="logo">VagusBuk</div>
<div class="subtitle">HRV- & Nervensystem-Regulation</div>

<div class="card">
<div class="heroTitle" id="heroTitle">Noch keine Daten</div>
<div class="heroText" id="heroText">
Bitte zuerst einen HRV-Wert eintragen.
</div>
</div>

<div class="card">
<div class="kpiGrid">

<div class="kpi">
<div class="kpiLabel">HRV Jetzt</div>
<div class="kpiValue" id="hrvValue">--</div>
<div class="kpiHint" id="trendText">Analyse läuft</div>
</div>

<div class="kpi">
<div class="kpiLabel">Ø 7 Tage</div>
<div class="kpiValue" id="avgValue">--</div>
<div class="kpiHint">Persönlicher Schnitt</div>
</div>

<div class="kpi">
<div class="kpiLabel">Zustand</div>
<div class="kpiValue" id="stateEmoji">🧠</div>
<div class="kpiHint" id="stateText">Keine Daten</div>
</div>

</div>
</div>

<div class="card">

<div class="inputWrap">

<input
id="hrvInput"
type="number"
placeholder="HRV">

<button
class="saveBtn"
onclick="App.saveHRV()">
Speichern
</button>

</div>

<div class="statusGrid">

<button class="statusBtn active" data-status="morning">🌅 Morgen</button>
<button class="statusBtn" data-status="recovery">🌙 Recovery</button>
<button class="statusBtn" data-status="stress">⚡ Stress</button>
<button class="statusBtn" data-status="crash">⚠ Crash</button>
<button class="statusBtn" data-status="fog">🌫 Nebel</button>
<button class="statusBtn" data-status="better">🙂 besser</button>

</div>

</div>

<div class="card">

<div style="font-size:12px;color:#8ea2b6;margin-bottom:12px;">
EMPFEHLUNG HEUTE
</div>

<div
id="todayText"
style="font-size:18px;line-height:1.5;">
Noch keine Einschätzung möglich.
</div>

</div>

<div class="card">

<div style="font-size:12px;color:#8ea2b6;margin-bottom:12px;">
HRV VERLAUF
</div>

<div class="chart" id="chart"></div>

</div>

</div>

<div class="bottomBar">

<button
class="actionBtn trainBtn"
onclick="Pacer.start('training')">
🫁 Training
</button>

<button
class="actionBtn recoveryBtn"
onclick="Pacer.start('recovery')">
🌙 Recovery
</button>

<button
class="actionBtn sosBtn"
onclick="Pacer.start('sos')">
⚠ SOS
</button>

</div>

<div class="overlay" id="overlay">

<div class="modeTitle" id="modeTitle">
Training
</div>

<div class="modePhase" id="modePhase">
Einatmen
</div>

<div class="modeHint" id="modeHint">
Langsam durch die Nase atmen
</div>

<div class="ball" id="ball"></div>

<div class="timer" id="timer">
0:00
</div>

<button
class="closeBtn"
onclick="Pacer.stop()">
Beenden
</button>

</div>

<script>

const Storage = {

key:"vagusbuk8",

load(){

try{

return JSON.parse(
localStorage.getItem(this.key)
) || [];

}catch(e){

return [];

}

},

save(data){

localStorage.setItem(
this.key,
JSON.stringify(data)
);

}

};

const App = {

data:Storage.load(),
selectedStatus:"morning",

saveHRV(){

const input =
document.getElementById("hrvInput");

const value =
parseInt(input.value);

if(isNaN(value) || value <= 0){
return;
}

this.data.push({
value:value,
status:this.selectedStatus,
date:Date.now()
});

if(this.data.length > 100){
this.data = this.data.slice(-100);
}

Storage.save(this.data);

input.value = "";

this.render();

},

average(){

const last =
this.data.slice(-7);

if(!last.length) return null;

return Math.round(
last.reduce((a,b)=>a+b.value,0)
/
last.length
);

},

render(){

const latest =
this.data.length
? this.data[this.data.length-1].value
: null;

const avg =
this.average();

document.getElementById("hrvValue").innerText =
latest ?? "--";

document.getElementById("avgValue").innerText =
avg ?? "--";

if(latest === null){
return;
}

const low =
avg
? latest < avg * .9
: latest < 35;

const mid =
avg
? latest >= avg * .9 &&
latest < avg * 1.05
: latest < 45;

if(low){

document.getElementById("heroTitle").innerText =
"⚠ Nervensystem belastet";

document.getElementById("heroText").innerText =
"Heute Reize reduzieren und Recovery nutzen.";

document.getElementById("trendText").innerText =
"deutlich reduziert";

document.getElementById("stateEmoji").innerText =
"⚠";

document.getElementById("stateText").innerText =
"Belastet";

document.getElementById("todayText").innerText =
"SOS oder Recovery sinnvoll.";

}else if(mid){

document.getElementById("heroTitle").innerText =
"⚠ Mittlere Belastbarkeit";

document.getElementById("heroText").innerText =
"Heute besser ruhig bleiben.";

document.getElementById("trendText").innerText =
"leicht reduziert";

document.getElementById("stateEmoji").innerText =
"🌙";

document.getElementById("stateText").innerText =
"Vorsichtig";

document.getElementById("todayText").innerText =
"Recovery sinnvoll.";

}else{

document.getElementById("heroTitle").innerText =
"✓ Gute vagale Stabilität";

document.getElementById("heroText").innerText =
"Training heute wahrscheinlich sinnvoll.";

document.getElementById("trendText").innerText =
"stabil";

document.getElementById("stateEmoji").innerText =
"✓";

document.getElementById("stateText").innerText =
"Stabil";

document.getElementById("todayText").innerText =
"Training sinnvoll.";

}

this.renderChart();

},

renderChart(){

const chart =
document.getElementById("chart");

chart.innerHTML = "";

const weekdays =
["So","Mo","Di","Mi","Do","Fr","Sa"];

this.data.slice(-7).forEach(item=>{

const wrap =
document.createElement("div");

wrap.className =
"barWrap";

const value =
document.createElement("div");

value.className =
"barValue";

value.innerText =
item.value;

const bar =
document.createElement("div");

bar.className =
"bar";

bar.style.height =
Math.max(
20,
item.value * 1.5
) + "px";

const label =
document.createElement("div");

label.className =
"barLabel";

label.innerText =
weekdays[
new Date(item.date).getDay()
];

wrap.appendChild(value);
wrap.appendChild(bar);
wrap.appendChild(label);

chart.appendChild(wrap);

});

}

};

document
.querySelectorAll(".statusBtn")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document
.querySelectorAll(".statusBtn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

App.selectedStatus =
btn.dataset.status;

});

});

const Pacer = {

running:false,
phaseTimeout:null,
timerInterval:null,

config:{

training:{
title:"🫁 Training",
duration:300,
phases:[
{
name:"Einatmen",
hint:"Langsam einatmen",
duration:4,
scale:1.5
},
{
name:"Halten",
hint:"Kurz halten",
duration:2,
scale:1.5
},
{
name:"Ausatmen",
hint:"Langsam summend ausatmen",
duration:6,
scale:.7
}
]
},

recovery:{
title:"🌙 Recovery",
duration:240,
phases:[
{
name:"Einatmen",
hint:"Sanft Luft holen",
duration:4,
scale:1.25
},
{
name:"Ausatmen",
hint:"Langsam entspannen",
duration:7,
scale:.65
}
]
},

sos:{
title:"⚠ SOS",
duration:180,
phases:[
{
name:"Einatmen",
hint:"Nur leicht einatmen",
duration:3,
scale:1.1
},
{
name:"Ausatmen",
hint:"Sehr langsam ausatmen",
duration:8,
scale:.55
}
]
}

},

start(type){

this.stop();

const cfg =
this.config[type];

this.running = true;

document
.getElementById("overlay")
.classList.add("active");

document
.getElementById("modeTitle")
.innerText =
cfg.title;

const ball =
document.getElementById("ball");

const phaseText =
document.getElementById("modePhase");

const hintText =
document.getElementById("modeHint");

let remaining =
cfg.duration;

this.updateTimer(remaining);

let phaseIndex = 0;

const runPhase = ()=>{

if(!this.running) return;

const phase =
cfg.phases[phaseIndex];

phaseText.innerText =
phase.name;

hintText.innerText =
phase.hint;

ball.style.transform =
`scale(${phase.scale})`;

phaseIndex =
(phaseIndex + 1)
% cfg.phases.length;

this.phaseTimeout =
setTimeout(
runPhase,
phase.duration * 1000
);

};

runPhase();

this.timerInterval =
setInterval(()=>{

remaining--;

this.updateTimer(remaining);

if(remaining <= 0){
this.stop();
}

},1000);

},

stop(){

this.running = false;

clearTimeout(this.phaseTimeout);
clearInterval(this.timerInterval);

document
.getElementById("overlay")
.classList.remove("active");

},

updateTimer(sec){

const min =
Math.floor(sec/60);

const s =
sec % 60;

document
.getElementById("timer")
.innerText =
`${min}:${String(s).padStart(2,"0")}`;

}

};

App.render();

</script>

</body>
</html>
