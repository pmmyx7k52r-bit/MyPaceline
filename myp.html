<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk CORE 2.2</title>

<style>
body {
margin: 0;
font-family: -apple-system, sans-serif;
background: #0b0f14;
color: #e8eef2;
text-align: center;
}

.container { padding: 20px; }

button {
width: 90%;
max-width: 420px;
margin: 10px;
padding: 18px;
font-size: 18px;
border-radius: 12px;
border: none;
color: white;
}

.ventral { background:#1f3d2b; }
.sympathikus { background:#4a3f1d; }
.dorsal { background:#1a1a1a; }

.hidden { display:none; }

.big { font-size: 28px; margin: 15px 0; }
.sub { opacity: 0.7; font-size: 14px; }
.timer { font-size: 42px; margin: 20px; }
</style>
</head>

<body>

<h1>VagusBuk CORE 2.2</h1>

<div class="container" id="home">

<div class="big">Zustand wählen</div>

<button class="ventral" onclick="start('ventral')">Stabil</button>
<button class="sympathikus" onclick="start('sympathikus')">Angespannt</button>
<button class="dorsal" onclick="start('dorsal')">Erschöpft</button>

<hr>

<button onclick="showLog()">Verlauf</button>

<p id="suggestion" class="sub"></p>

</div>

<div class="container hidden" id="session">

<div id="modeTitle" class="big"></div>
<div id="instruction" class="sub"></div>

<div class="timer" id="timer">60</div>

<button onclick="stop()">Stop</button>

</div>

<div class="container hidden" id="feedback">

<div class="big">Hilft es?</div>

<button onclick="save('better')">Besser</button>
<button onclick="save('same')">Gleich</button>
<button onclick="save('worse')">Schlechter</button>

</div>

<div class="container hidden" id="logView">
<div id="log"></div>
<button onclick="home()">Zurück</button>
</div>

<script>

let currentState = ""
let interval = null;

// ----------------------------
// AUDIO
// ----------------------------
let audioCtx = null;

function beep(freq, duration) {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();

osc.frequency.value = freq;
gain.gain.value = 0.06;

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
setTimeout(() => osc.stop(), duration);
}

// ----------------------------
// ADAPTIVER RHYTHMUS
// ----------------------------
function getBreathingPattern(state, lastResult) {

let inhale = 4;
let exhale = 6;

// Basis je Zustand
if (state === "ventral") {
inhale = 5; exhale = 5;
}

if (state === "sympathikus") {
inhale = 4; exhale = 6;
}

if (state === "dorsal") {
inhale = 3; exhale = 5;
}

// Anpassung durch Feedback
if (lastResult === "better") {
inhale += 0.5;
exhale += 0.5;
}

if (lastResult === "worse") {
inhale -= 0.5;
exhale -= 0.5;
}

inhale = Math.max(2, inhale);
exhale = Math.max(3, exhale);

return {inhale, exhale};
}

// ----------------------------
// START
// ----------------------------
function start(state) {

currentState = state;

document.getElementById("home").classList.add("hidden");
document.getElementById("session").classList.remove("hidden");

applyMode(state);
startBreathing(state);
runTimer();
}

// ----------------------------
// MODE
// ----------------------------
function applyMode(state) {

let title = ""
let instruction = ""

if (state === "ventral") {
title = "Stabilisierung"
instruction = "ruhig bleiben, nichts erzwingen"

} else if (state === "sympathikus") {
title = "Runterregulation"
instruction = "Ausatmung verlängern"

} else {
title = "Minimalmodus"
instruction = "nur Sicherheit, kein Training"
}

document.getElementById("modeTitle").innerText = title;
document.getElementById("instruction").innerText = instruction;
}

// ----------------------------
// BREATHING
// ----------------------------
function startBreathing(state) {

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let last = log.slice(-1)[0];
let lastResult = last ? last.result : "same"

let pattern = getBreathingPattern(state, lastResult);

document.getElementById("instruction").innerText =
`Ein ${pattern.inhale}s – Aus ${pattern.exhale}s`;

let phase = "in"

interval = setInterval(() => {

if (phase === "in") {
document.getElementById("modeTitle").innerText = "Einatmen"
beep(300, 120);
phase = "out"

} else {
document.getElementById("modeTitle").innerText = "Ausatmen"
beep(180, 200);
phase = "in"
}

}, (pattern.inhale + pattern.exhale) * 1000);
}

// ----------------------------
// TIMER
// ----------------------------
function runTimer() {
let t = 60;
document.getElementById("timer").innerText = t;

let timer = setInterval(() => {
t--;
document.getElementById("timer").innerText = t;

if (t <= 0) {
clearInterval(timer);
stop();
}
}, 1000);
}

// ----------------------------
// STOP (sauber)
// ----------------------------
function stop() {
clearInterval(interval);
interval = null;

if (audioCtx) {
audioCtx.close();
audioCtx = null;
}

document.getElementById("session").classList.add("hidden");
document.getElementById("feedback").classList.remove("hidden");
}

// ----------------------------
// SAVE
// ----------------------------
function save(result) {

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];

log.push({
date: new Date().toLocaleString(),
state: currentState,
result: result
});

localStorage.setItem("vagusLog", JSON.stringify(log));

home();
}

// ----------------------------
// LOG
// ----------------------------
function showLog() {

document.getElementById("home").classList.add("hidden");
document.getElementById("logView").classList.remove("hidden");

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let el = document.getElementById("log");

el.innerHTML = ""

log.slice().reverse().forEach(e => {
el.innerHTML += `<p>${e.date}<br>${e.state} → ${e.result}</p><hr>`;
});
}

// ----------------------------
// HOME
// ----------------------------
function home() {
document.getElementById("feedback").classList.add("hidden");
document.getElementById("logView").classList.add("hidden");
document.getElementById("session").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

</script>

</body>
</html>
