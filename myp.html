<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace 2.4.1</title>

<meta http-equiv="Cache-Control" content="no-store">

<style>
body {
font-family: -apple-system, sans-serif;
background:#f2f2f7;
padding:20px;
text-align:center;
}

.card {
background:white;
border-radius:12px;
padding:16px;
margin-bottom:15px;
}

button {
width:100%;
padding:14px;
margin-top:8px;
font-size:15px;
border:none;
border-radius:10px;
color:white;
}

.focus { background:#34c759; }
.light { background:#5ac8fa; }
.bodywork { background:#ff9500; }
.toomuch { background:#ff3b30; }
.pause { background:#007aff; }
.undo { background:#ccc; color:#333; }

#status {
font-size:32px;
font-weight:bold;
}

.ok { color:#2ecc71; }
.mid { color:#f39c12; }
.bad {
color:#e74c3c;
animation: blink 1s infinite;
}

@keyframes blink {
0% {opacity:1;}
50% {opacity:0.4;}
100% {opacity:1;}
}

#timer {
font-size:28px;
margin-top:10px;
}

#warningBox {
font-weight:bold;
min-height:22px;
}

input {
width:60px;
font-size:16px;
text-align:center;
}
</style>
</head>

<body>

<h1>Pace 2.4.1</h1>

<div id="start" class="card">
<p>Wie hast du geschlafen?</p>
<button onclick="startDay(100)">Gut</button>
<button onclick="startDay(80)">Geht so</button>
<button onclick="startDay(60)">Schlecht</button>
</div>

<div id="app" style="display:none;">

<div class="card">
Fokus-Limit:
<input type="number" id="focusLimitInput" value="3" min="1" max="15"> Minuten
</div>

<div class="card">
<div id="status">Alles ok</div>
<div id="energy">Energie: 100%</div>
<div id="timer" style="display:none;">00:00</div>
<div id="warningBox"></div>
</div>

<div class="card">
<button class="pause" onclick="doPause()">Pause</button>
</div>

<div class="card">
<button class="focus" onclick="toggleFocus()">Kopf an (Lesen, Handy, Einkaufen)</button>
<button class="light" onclick="add(2,'Locker bewegt')">Locker bewegen</button>
<button class="bodywork" onclick="add(6,'Körper anstrengend')">Körper anstrengend</button>
<button class="toomuch" onclick="add(20,'Zu viel')">Das war zu viel</button>
</div>

<div class="card">
<h3>Heute</h3>
<div id="log"></div>
</div>

<button class="undo" onclick="undo()">Rückgängig</button>

</div>

<script>

var energy = 100;
var log = [];

var slowLimit, pauseLimit, stopLimit;
var pauseHintShown = false;

var timer = null;
var focusStart = null;

function now(){
let d = new Date();
return d.getHours()+":"+("0"+d.getMinutes()).slice(-2);
}

function startDay(val){

energy = val;
log = [];
pauseHintShown = false;

if(val === 60){
slowLimit = 75;
pauseLimit = 60;
stopLimit = 35;
} else if(val === 80){
slowLimit = 70;
pauseLimit = 55;
stopLimit = 30;
} else {
slowLimit = 65;
pauseLimit = 50;
stopLimit = 25;
}

document.getElementById("start").style.display = "none"
document.getElementById("app").style.display = "block"

update();
}

function add(val, text){
energy -= val;
if(energy < 0) energy = 0;

log.unshift({time: now(), text: text, value: val});
render();
update();
}

function doPause(){

// ALLES resetten
document.getElementById("warningBox").innerText = ""
pauseHintShown = false;

log.unshift({time: now(), text: "Pause", value:0});
render();
}

function toggleFocus(){

let warning = document.getElementById("warningBox");

if(timer){
clearInterval(timer);
timer = null;

let min = (Date.now() - focusStart)/60000;

document.getElementById("timer").style.display = "none"
warning.innerText = ""

let cost = 2;
if(min > 3) cost = 5;
if(min > 6) cost = 10;
if(min > 10) cost = 12;
if(min > 15) cost = 15;

add(cost, "Kopf an "+Math.round(min)+" Min");

} else {

focusStart = Date.now();
document.getElementById("timer").style.display = "block"

timer = setInterval(function(){

let sec = (Date.now() - focusStart)/1000;
let m = Math.floor(sec/60);
let s = Math.floor(sec%60);

document.getElementById("timer").innerText =
("0"+m).slice(-2)+":"+("0"+s).slice(-2);

let limit = parseFloat(document.getElementById("focusLimitInput").value);
let warn = limit * 0.85;

let currentMin = sec / 60;

if(currentMin >= warn && currentMin < limit){
warning.innerText = "⚠ gleich drüber!"
}
else if(currentMin >= limit){
warning.innerText = "⚠ Grenze erreicht!"
}
else{
warning.innerText = ""
}

},1000);
}
}

function undo(){
if(log.length === 0) return;

let last = log.shift();
energy += last.value;
if(energy > 100) energy = 100;

render();
update();
}

function update(){

let status = document.getElementById("status");
let warning = document.getElementById("warningBox");

document.getElementById("energy").innerText = "Energie: "+energy+"%"

if(energy >= slowLimit){
status.innerText = "Alles ok"
status.className = "ok"
}
else if(energy >= stopLimit){
status.innerText = "Langsam machen"
status.className = "mid"
}
else{
status.innerText = "Stopp"
status.className = "bad"
}

// KORREKTE Pause-Logik
if(energy <= pauseLimit){
if(!pauseHintShown){
warning.innerText = "⚠ Pause sinnvoll"
pauseHintShown = true;
}
} else {
warning.innerText = ""
pauseHintShown = false;
}
}

function render(){
let out = ""
for(let e of log){
out += e.time+" – "+e.text+"<br>"
}
document.getElementById("log").innerHTML = out;
}

</script>

</body>
</html>
