<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>VagusBuk 6.2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
overflow-x:hidden;
background:#02101f;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
color:white;
}

body{
background:
radial-gradient(
circle at top,
#0b3157 0%,
#031120 45%,
#020b14 100%
);
}

.app{
width:100%;
max-width:560px;
margin:0 auto;
padding:28px 18px 120px;
}

.hero{

margin-top:10px;
margin-bottom:24px;
}

.logoWave{

text-align:center;

font-size:40px;

opacity:.45;

margin-bottom:8px;
}

.logo{

font-size:64px;

font-weight:900;

letter-spacing:-3px;

line-height:.9;
}

.subtitle{

margin-top:12px;

font-size:22px;

line-height:1.4;

color:#aab8ca;
}

.card{

width:100%;

background:
linear-gradient(
180deg,
rgba(8,22,38,.92),
rgba(4,14,26,.95)
);

border:
1px solid rgba(255,255,255,.06);

border-radius:32px;

padding:22px;

margin-bottom:20px;

overflow:hidden;

box-shadow:
0 10px 40px rgba(0,0,0,.28);
}

.sectionTitle{

font-size:15px;

letter-spacing:2px;

text-transform:uppercase;

color:#91a4b7;

margin-bottom:18px;
}

/* =========================================================
STATUS
========================================================= */

.todayBox{

width:100%;
}

.todayBadge{

display:inline-flex;

align-items:center;

justify-content:center;

min-height:34px;

padding:0 14px;

border-radius:999px;

font-size:13px;

font-weight:700;

margin-bottom:18px;

background:
rgba(255,255,255,.08);

color:white;
}

.todayState{

font-size:46px;

font-weight:900;

line-height:1;

letter-spacing:-2px;
}

.todayText{

margin-top:16px;

font-size:22px;

line-height:1.4;

color:#dce6f0;
}

.todayPlan{

margin-top:24px;

padding:18px;

border-radius:22px;

background:
rgba(255,255,255,.04);
}

.planTitle{

font-size:13px;

letter-spacing:1px;

text-transform:uppercase;

color:#9eb2c5;

margin-bottom:12px;
}

.planList{

line-height:1.7;

font-size:17px;

color:#eef4fa;
}

.todayAvoid{

margin-top:18px;

padding:18px;

border-radius:22px;

background:
rgba(180,60,60,.08);

border:
1px solid rgba(255,120,120,.12);
}

.avoidTitle{

font-size:13px;

letter-spacing:1px;

text-transform:uppercase;

color:#ffb9b9;

margin-bottom:12px;
}

.avoidList{

line-height:1.7;

font-size:17px;

color:#ffdede;
}

/* =========================================================
TRAINING
========================================================= */

.todayTraining{

margin-top:20px;

padding:20px;

border-radius:24px;

background:
linear-gradient(
135deg,
rgba(41,107,173,.18),
rgba(29,66,108,.12)
);

border:
1px solid rgba(90,145,220,.14);
}

.trainingLabel{

font-size:13px;

text-transform:uppercase;

letter-spacing:1px;

color:#9cb0c3;
}

.trainingDuration{

margin-top:8px;

font-size:30px;

font-weight:900;
}

.todayActionBtn{

margin-top:18px;

width:100%;

height:60px;

border:none;

border-radius:20px;

font-size:20px;

font-weight:800;

color:white;

background:
linear-gradient(
135deg,
#38cf67,
#22873f
);
}

/* =========================================================
HRV
========================================================= */

.hrvTop{

display:flex;

align-items:flex-start;

justify-content:space-between;

gap:16px;

flex-wrap:wrap;
}

.hrvBig{

font-size:84px;

font-weight:900;

line-height:.9;
}

.hrvAverage{

text-align:right;

color:#9cb0c3;
}

.hrvAverage span{

display:block;

font-size:42px;

color:white;

font-weight:900;

margin-top:6px;
}

.hrvInfo{

margin-top:14px;

font-size:24px;

line-height:1.4;
}

.inputRow{

margin-top:24px;

display:flex;

gap:12px;
}

.hrvInput{

flex:1;

height:62px;

border-radius:20px;

border:
2px solid rgba(48,108,176,.7);

background:
rgba(3,18,32,.95);

color:white;

font-size:34px;

padding:0 20px;

outline:none;
}

.saveBtn{

border:none;

padding:0 26px;

border-radius:20px;

font-size:20px;

font-weight:800;

color:white;

background:
linear-gradient(
135deg,
#38cf67,
#22873f
);
}

/* =========================================================
CHART
========================================================= */

.chart{

margin-top:26px;

display:flex;

align-items:flex-end;

gap:10px;

height:180px;
}

.barWrap{

flex:1;

display:flex;

flex-direction:column;

align-items:center;

justify-content:flex-end;

height:100%;
}

.barValue{

font-size:14px;

margin-bottom:8px;

color:#dce5ef;
}

.bar{

width:100%;

border-radius:18px 18px 8px 8px;

background:
linear-gradient(
180deg,
#4fe073,
#238d43
);
}

.barDay{

margin-top:8px;

font-size:12px;

color:#7d90a4;
}

/* =========================================================
TRAINING OVERLAY
========================================================= */

.trainingOverlay{

position:fixed;

inset:0;

z-index:999;

background:
radial-gradient(
circle at center,
#0c3154,
#020a14
);

display:none;

flex-direction:column;

align-items:center;

justify-content:center;

padding:24px;
}

.trainingTitle{

font-size:34px;

font-weight:900;

margin-bottom:18px;
}

.breathText{

font-size:26px;

margin-bottom:34px;

color:#dbe7f2;
}

.breathBall{

width:90px;

height:90px;

border-radius:50%;

background:
radial-gradient(
circle at 30% 30%,
#84f9ff,
#2fa0ff
);

box-shadow:
0 0 60px rgba(86,196,255,.6);

transition:
transform 4s linear;
}

.trainingTimer{

margin-top:42px;

font-size:52px;

font-weight:900;
}

.trainingBack{

position:absolute;

top:54px;

left:22px;

border:none;

background:
rgba(255,255,255,.08);

color:white;

height:48px;

padding:0 20px;

border-radius:16px;

font-size:16px;

font-weight:700;
}

@media(max-width:560px){

.logo{
font-size:56px;
}

.subtitle{
font-size:18px;
}

.todayState{
font-size:36px;
}

.todayText{
font-size:20px;
}

.hrvBig{
font-size:72px;
}

.inputRow{
flex-direction:column;
}

.saveBtn{
width:100%;
height:60px;
}
}

</style>
</head>

<body>

<div class="app">

<!-- =========================================================
HEADER
========================================================= -->

<div class="hero">

<div class="logoWave">
〰〰
</div>

<div class="logo">
VagusBuk
</div>

<div class="subtitle">
Adaptive HRV- & Nervensystem-Regulation
</div>

</div>

<!-- =========================================================
HRV
========================================================= -->

<div class="card">

<div class="sectionTitle">
HRV heute
</div>

<div class="hrvTop">

<div>

<div
class="hrvBig"
id="hrvBig"
>
--
</div>

<div
class="hrvInfo"
id="hrvInfo"
>
Noch keine Daten.
</div>

</div>

<div class="hrvAverage">
Ø 7 Tage
<span id="avgValue">
--
</span>
</div>

</div>

<div class="inputRow">

<input
type="number"
inputmode="numeric"
placeholder="z.B. 41"
id="hrvInput"
class="hrvInput"
/>

<button
class="saveBtn"
onclick="saveHRV()"
>
Speichern
</button>

</div>

<div
class="chart"
id="chart"
></div>

</div>

<!-- =========================================================
HEUTE
========================================================= -->

<div class="card">

<div class="sectionTitle">
Heute
</div>

<div class="todayBox">

<div
class="todayBadge"
id="todayBadge"
>
Analyse
</div>

<div
class="todayState"
id="todayState"
>
Noch keine Daten
</div>

<div
class="todayText"
id="todayText"
>
Trage morgens deine HRV ein.
</div>

<div class="todayPlan">

<div class="planTitle">
Heute sinnvoll
</div>

<div
class="planList"
id="planList"
>
–
</div>

</div>

<div class="todayAvoid">

<div class="avoidTitle">
Heute vermeiden
</div>

<div
class="avoidList"
id="avoidList"
>
–
</div>

</div>

<div class="todayTraining">

<div class="trainingLabel">
Empfohlenes Training
</div>

<div
class="trainingDuration"
id="trainingDuration"
>
–
</div>

<button
class="todayActionBtn"
id="todayActionBtn"
onclick="startRecommendedTraining()"
>
Starten
</button>

</div>

</div>

</div>

</div>

<!-- =========================================================
TRAINING OVERLAY
========================================================= -->

<div
class="trainingOverlay"
id="trainingOverlay"
>

<button
class="trainingBack"
onclick="stopTraining()"
>
Zurück
</button>

<div class="trainingTitle">
Vagus-Training
</div>

<div
class="breathText"
id="breathText"
>
Einatmen
</div>

<div
class="breathBall"
id="breathBall"
></div>

<div
class="trainingTimer"
id="trainingTimer"
>
0:00
</div>

</div>

<script>

let hrvData =
JSON.parse(
localStorage.getItem("vagusbuk_hrv")
) || [];

let recommendedTraining = 180;

let trainingInterval;
let breathingInterval;

/* =========================================================
SAVE HRV
========================================================= */

function saveHRV(){

const input =
document.getElementById(
"hrvInput"
);

const value =
parseInt(input.value);

if(
isNaN(value)
||
value <= 0
){
return;
}

hrvData.push({
value:value,
date:Date.now()
});

if(hrvData.length > 7){
hrvData.shift();
}

localStorage.setItem(
"vagusbuk_hrv",
JSON.stringify(hrvData)
);

input.value = ""

renderAll();
}

/* =========================================================
RENDER
========================================================= */

function renderAll(){

updateHRV();

updateToday();

renderChart();
}

/* =========================================================
HRV
========================================================= */

function updateHRV(){

const big =
document.getElementById(
"hrvBig"
);

const info =
document.getElementById(
"hrvInfo"
);

const avg =
document.getElementById(
"avgValue"
);

if(hrvData.length === 0){

big.innerText = "--"

info.innerText =
"Noch keine Daten."

avg.innerText = "--"

return;
}

const latest =
hrvData[
hrvData.length - 1
].value;

big.innerText =
latest;

const average =
Math.round(
hrvData.reduce(
(a,b)=>a+b.value,
0
) / hrvData.length
);

avg.innerText =
average;

if(latest < 25){

info.innerText =
"Heute vorsichtiger bleiben."

}else if(latest < 40){

info.innerText =
"Sanfter Aufbau sinnvoll."

}else{

info.innerText =
"Gute vagale Stabilität."
}
}

/* =========================================================
TODAY
========================================================= */

function updateToday(){

const latest =
hrvData.length
?
hrvData[
hrvData.length - 1
].value
:
null;

const badge =
document.getElementById(
"todayBadge"
);

const state =
document.getElementById(
"todayState"
);

const text =
document.getElementById(
"todayText"
);

const plan =
document.getElementById(
"planList"
);

const avoid =
document.getElementById(
"avoidList"
);

const duration =
document.getElementById(
"trainingDuration"
);

const button =
document.getElementById(
"todayActionBtn"
);

if(latest === null){

badge.innerText =
"Keine Daten"

state.innerText =
"Noch keine Daten"

text.innerText =
"Bitte morgens HRV eintragen."

plan.innerHTML =
"• Basisdaten sammeln"

avoid.innerHTML =
"• keine Einschätzung möglich"

duration.innerText =
"2 Minuten ruhige Atmung"

recommendedTraining = 120;

return;
}

if(latest < 25){

badge.innerText =
"Empfindlich"

badge.style.background =
"rgba(180,60,60,.24)"

state.innerText =
"⚠ Nervensystem überlastet"

text.innerText =
"Heute Stabilisierung statt Aufbau."

plan.innerHTML = `
• langsame Atmung<br>
• Reize reduzieren<br>
• Summen möglich<br>
• Brustbein-Klopfen
`;

avoid.innerHTML = `
• intensive Belastung<br>
• lange Sessions<br>
• emotionale Überreizung
`;

duration.innerText =
"1–2 Minuten Regulation"

button.innerText =
"Beruhigung starten"

recommendedTraining = 90;

return;
}

if(latest < 40){

badge.innerText =
"Vorsichtig"

badge.style.background =
"rgba(173,129,27,.24)"

state.innerText =
"⚠ mittlere Belastbarkeit"

text.innerText =
"Sanfter Aufbau sinnvoll."

plan.innerHTML = `
• ruhige Atmung<br>
• langsamer Rhythmus<br>
• kurze Regulation<br>
• optional Summen
`;

avoid.innerHTML = `
• Überforderung<br>
• schnelle Atemmuster<br>
• zu lange Sessions
`;

duration.innerText =
"3 Minuten vagales Training"

button.innerText =
"Sanft starten"

recommendedTraining = 180;

return;
}

badge.innerText =
"Stabil"

badge.style.background =
"rgba(47,157,81,.24)"

state.innerText =
"✓ gute vagale Stabilität"

text.innerText =
"Heute eignet sich Aufbau-Training."

plan.innerHTML = `
• längere Regulation<br>
• vagale Aktivierung<br>
• langsame tiefe Atmung<br>
• Summen möglich
`;

avoid.innerHTML = `
• hektische Überlastung<br>
• zu spätes Training
`;

duration.innerText =
"5 Minuten Aufbau-Training"

button.innerText =
"Training starten"

recommendedTraining = 300;
}

/* =========================================================
CHART
========================================================= */

function renderChart(){

const chart =
document.getElementById(
"chart"
);

chart.innerHTML = ""

hrvData.forEach((item,index)=>{

const wrap =
document.createElement("div");

wrap.className =
"barWrap"

const value =
document.createElement("div");

value.className =
"barValue"

value.innerText =
item.value;

const bar =
document.createElement("div");

bar.className =
"bar"

bar.style.height =
Math.max(
28,
item.value * 2
) + "px"

const day =
document.createElement("div");

day.className =
"barDay"

day.innerText =
index + 1;

wrap.appendChild(value);

wrap.appendChild(bar);

wrap.appendChild(day);

chart.appendChild(wrap);
});
}

/* =========================================================
TRAINING
========================================================= */

function startRecommendedTraining(){

startTraining(
recommendedTraining
);
}

function startTraining(seconds){

const overlay =
document.getElementById(
"trainingOverlay"
);

overlay.style.display =
"flex"

let remaining =
seconds;

updateTimer(remaining);

const ball =
document.getElementById(
"breathBall"
);

const text =
document.getElementById(
"breathText"
);

let inhale = true;

function breathe(){

if(inhale){

text.innerText =
"Einatmen"

ball.style.transform =
"scale(1.8)"

}else{

text.innerText =
"Ausatmen"

ball.style.transform =
"scale(.7)"
}

inhale = !inhale;
}

breathe();

breathingInterval =
setInterval(
breathe,
4000
);

trainingInterval =
setInterval(()=>{

remaining--;

updateTimer(remaining);

if(remaining <= 0){

stopTraining();

}

},1000);
}

function updateTimer(sec){

const min =
Math.floor(sec / 60);

const s =
sec % 60;

document.getElementById(
"trainingTimer"
).innerText =
`${min}:${String(s).padStart(2,"0")}`;
}

function stopTraining(){

clearInterval(
trainingInterval
);

clearInterval(
breathingInterval
);

document.getElementById(
"trainingOverlay"
).style.display =
"none"
}

/* =========================================================
INIT
========================================================= */

renderAll();

</script>

</body>
</html>
