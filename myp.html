<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk A5.0</title>

<style>
body {
margin:0;
font-family:-apple-system,sans-serif;
background:#0b0f14;
color:#e8eef2;
text-align:center;
}
.container { padding:20px; }

button {
width:90%;
max-width:420px;
margin:6px;
padding:16px;
font-size:16px;
border-radius:12px;
border:none;
color:white;
}

.red { background:#4a2b2b; }
.green { background:#2b4a3a; }
.yellow { background:#5a4a2b; }
.gray { background:#444; }

.box {
background:#15202b;
margin-top:10px;
border-radius:10px;
padding:12px;
}

.hidden { display:none; }

.timer { font-size:42px; }
.phase { font-size:20px; }
.info { font-size:14px; opacity:0.8; }
</style>
</head>

<body>

<h2>VagusBuk</h2>

<div class="container">

<!-- HRV -->
<div class="box">
<b>HRV morgens</b><br>
<input id="hrvInput" type="number" placeholder="z.B. 25">
<button id="saveHRV">Speichern</button>
<div id="hrvInfo" class="info"></div>
</div>

<!-- STATE -->
<div id="checkBox" class="box">
<b>Wie ist es gerade?</b><br>
<button id="btnGood" class="green">🟢 stabil</button>
<button id="btnMid" class="yellow">🟡 kippt leicht</button>
<button id="btnBad" class="red">🔴 kippt</button>
</div>

<!-- CONTEXT -->
<div id="contextBox" class="box hidden">
<b>Was war gerade?</b><br>
<button data-context="talk">💬 Gespräch</button>
<button data-context="screen">📱 Bildschirm</button>
<button data-context="thinking">🧠 Denken</button>
<button data-context="tired">😴 müde</button>
<button data-context="unknown">❓ egal</button>
</div>

<!-- ACTION -->
<div id="actionBox" class="box hidden">
<b>Übungen</b><br>
<button id="btnEmergency" class="red">Akut</button>
<button id="btnHRV" class="green">5 Min Training</button>
<button id="btnStop" class="gray">Abbrechen</button>
<button id="btnReset" class="gray">Zurück</button>
</div>

<div id="timer" class="timer"></div>
<div id="phase" class="phase"></div>
<div id="info" class="info"></div>

</div>

<script>

// ---------- STATE
let interval=null;
let currentState=null;
let audioReady=false;

let hrvData = JSON.parse(localStorage.getItem("vb_hrv")) || [];

// ---------- UI
function show(id){document.getElementById(id).classList.remove("hidden");}
function hide(id){document.getElementById(id).classList.add("hidden");}
function setPhase(t){document.getElementById("phase").innerText=t;}
function setTimer(t){document.getElementById("timer").innerText=t;}
function showInfo(t){document.getElementById("info").innerText=t;}

// ---------- AUDIO
function unlockAudio(){
if(audioReady)return;
audioReady=true;
speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
}
function speak(t){
if(!audioReady)return;
speechSynthesis.cancel();
let m=new SpeechSynthesisUtterance(t);
m.lang="de-DE"
speechSynthesis.speak(m);
}

// ---------- HRV LOGIK
function saveHRV(){
let val=parseInt(document.getElementById("hrvInput").value);
if(!val)return;

hrvData.push(val);
hrvData=hrvData.slice(-14);
localStorage.setItem("vb_hrv",JSON.stringify(hrvData));

updateHRVInfo();
}

function getAvg(){
if(hrvData.length===0)return null;
return Math.round(hrvData.reduce((a,b)=>a+b,0)/hrvData.length);
}

function updateHRVInfo(){

let avg=getAvg();
if(!avg){
document.getElementById("hrvInfo").innerText="Noch keine Daten."
return;
}

let today=hrvData[hrvData.length-1];

let msg="Ø: "+avg+" | Heute: "+today+" → "

if(today < avg){
msg+="ruhig bleiben"
} else if(today > avg){
msg+="Training sinnvoll"
} else{
msg+="normal"
}

document.getElementById("hrvInfo").innerText=msg;
}

// ---------- RESET
function resetApp(){
clearInterval(interval);
speechSynthesis.cancel();

show("checkBox");
hide("contextBox");
hide("actionBox");

setPhase("");
setTimer("");
showInfo("Bereit.");
}

// ---------- STATE
function handleState(s){
unlockAudio();
currentState=s;

if(s==="good"){
show("actionBox");
showInfo("Stabil → Training möglich");
return;
}

hide("checkBox");
show("contextBox");
}

// ---------- CONTEXT
function chooseContext(){
hide("contextBox");
show("actionBox");

if(currentState==="mid") startMicro();
if(currentState==="bad") startEmergency();
}

// ---------- MICRO
function startMicro(){
clearInterval(interval);
let t=20;
setPhase("Schultern lösen");

interval=setInterval(()=>{
t--; setTimer(t);
if(t<=0) finish("ruhiger");
},1000);
}

// ---------- EMERGENCY
function startEmergency(){
clearInterval(interval);
let t=20;
setPhase("Klopfen");

interval=setInterval(()=>{
t--; setTimer(t);
if(t<=0) startBreath();
},1000);
}

// ---------- BREATH
function startBreath(){
let t=40,pt=0;

interval=setInterval(()=>{
t--;pt++; setTimer(t);

if(pt%10<4){setPhase("Ein");}
else{setPhase("Aus");}

if(t<=0) finish("beruhigt");

},1000);
}

// ---------- HRV TRAINING
function startHRV(){
clearInterval(interval);
let t=300,pt=0;

interval=setInterval(()=>{
t--;pt++; setTimer(t);

if(pt%12<5){setPhase("Ein");}
else{setPhase("Lang Aus");}

if(t<=0) finish("trainiert");

},1000);
}

// ---------- FINISH
function finish(txt){
clearInterval(interval);
setPhase("Fertig");
showInfo(txt);
speak("Fertig");

setTimeout(resetApp,2000);
}

// ---------- EVENTS
document.getElementById("saveHRV").onclick=saveHRV;
document.getElementById("btnGood").onclick=()=>handleState("good");
document.getElementById("btnMid").onclick=()=>handleState("mid");
document.getElementById("btnBad").onclick=()=>handleState("bad");

document.querySelectorAll("[data-context]").forEach(b=>{
b.onclick=chooseContext;
});

document.getElementById("btnEmergency").onclick=startEmergency;
document.getElementById("btnHRV").onclick=startHRV;
document.getElementById("btnStop").onclick=resetApp;
document.getElementById("btnReset").onclick=resetApp;

// INIT
updateHRVInfo();
resetApp();

</script>

</body>
</html>
