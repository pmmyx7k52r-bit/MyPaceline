<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk 3.5</title>

<style>
body {
margin:0;
font-family:-apple-system,sans-serif;
background:#0b0f14;
color:#e8eef2;
text-align:center;
}

.container { padding:20px; }

button {
width:90%;
max-width:420px;
margin:10px;
padding:16px;
font-size:16px;
border-radius:12px;
border:none;
color:white;
}

.primary { background:#2b4a3a; }
.secondary { background:#2d3b4a; }

.feedback button {
width:30%;
margin:5px;
}

.card {
background:#15202b;
padding:16px;
margin-top:16px;
border-radius:12px;
text-align:left;
}

.timer {
font-size:40px;
margin-top:15px;
}

.phase {
font-size:20px;
margin-top:10px;
}

.hidden { display:none; }
</style>
</head>

<body>

<h1>VagusBuk 3.5</h1>

<div class="container">

<button class="primary" onclick="startSession('breath')">
Recovery (60s)
</button>

<button class="secondary" onclick="quickRelief('quick')">
Soforthilfe (15s)
</button>

<div id="timer" class="timer hidden">60</div>
<div id="phase" class="phase hidden"></div>

<div id="feedback" class="card hidden feedback">
Wie hat es gewirkt?<br><br>
<button onclick="saveFeedback(1)">👍</button>
<button onclick="saveFeedback(0)">➖</button>
<button onclick="saveFeedback(-1)">👎</button>
</div>

<div id="insight" class="card hidden"></div>

</div>

<script>

let currentMode = null;

// gespeicherte Daten
let stats = JSON.parse(localStorage.getItem("vb_stats")) || {
breath: { good: 0, bad: 0 },
quick: { good: 0, bad: 0 }
};

// ----------------------------
// SESSION
// ----------------------------
let timer = null;
let timeLeft = 0;

function startSession(mode) {

clearAll();

currentMode = mode;
timeLeft = 60;

showUI();

speak("Vier ein. Sechs aus.");

timer = setInterval(() => {

timeLeft--;
document.getElementById("timer").innerText = timeLeft;

let cycle = timeLeft % 10;

if (cycle < 4) {
document.getElementById("phase").innerText = "Einatmen"
} else {
document.getElementById("phase").innerText = "Ausatmen"
}

if (timeLeft <= 0) finish();

}, 1000);
}

// ----------------------------
// QUICK
// ----------------------------
function quickRelief(mode) {

clearAll();

currentMode = mode;
timeLeft = 15;

showUI();

speak("Schultern hochziehen und loslassen.");

timer = setInterval(() => {

timeLeft--;
document.getElementById("timer").innerText = timeLeft;

document.getElementById("phase").innerText = "Spannung lösen"

if (timeLeft <= 0) finish();

}, 1000);
}

// ----------------------------
// FINISH
// ----------------------------
function finish() {

clearAll();

document.getElementById("phase").innerText = "Fertig"

speak("Fertig.");

document.getElementById("feedback").classList.remove("hidden");
}

// ----------------------------
// FEEDBACK
// ----------------------------
function saveFeedback(val) {

if (val === 1) stats[currentMode].good++;
if (val === -1) stats[currentMode].bad++;

localStorage.setItem("vb_stats", JSON.stringify(stats));

showInsight();
}

// ----------------------------
// INSIGHT
// ----------------------------
function showInsight() {

let box = document.getElementById("insight");
box.classList.remove("hidden");

let breathScore = stats.breath.good - stats.breath.bad;
let quickScore = stats.quick.good - stats.quick.bad;

let text = "Was hilft dir aktuell:<br><br>"

if (breathScore > quickScore) {
text += "→ Atemübungen wirken besser"
} else if (quickScore > breathScore) {
text += "→ Soforthilfe wirkt besser"
} else {
text += "→ beide ähnlich wirksam"
}

box.innerHTML = text;
}

// ----------------------------
// HELPERS
// ----------------------------
function speak(text) {
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "de-DE"
speechSynthesis.speak(msg);
}

function showUI() {
document.getElementById("timer").classList.remove("hidden");
document.getElementById("phase").classList.remove("hidden");
document.getElementById("feedback").classList.add("hidden");
}

function clearAll() {
clearInterval(timer);
}

</script>

</body>
</html>
