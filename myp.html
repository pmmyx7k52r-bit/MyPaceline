<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VagusBuk A5.3</title>
<style>
:root{
--bg:#071018;
--card:#101b27;
--text:#eef3f7;
--muted:#95a7ba;
--green:#38c85b;
--yellow:#e4bc44;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background: radial-gradient(circle at top,#11243a 0%,#071018 45%);
color:var(--text);
display: flex; justify-content: center;
}

.container{ width: 100%; max-width: 480px; padding: 20px 16px; }

.logo { font-size: 42px; font-weight: 800; text-align: center; margin-bottom: 4px; }
.sub { color: var(--muted); text-align: center; margin-bottom: 30px; font-size: 16px; }

.card {
background: rgba(16, 27, 39, 0.6);
border: 1px solid rgba(255,255,255,0.05);
border-radius: 24px;
padding: 20px;
margin-bottom: 20px;
}

.sectionHeader { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.sectionTitle { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.hrvGrid { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; }
.hrvCol { flex: 1; }
.divider { width: 1px; background: rgba(255,255,255,0.1); margin: 0 20px; }

.label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.valueLarge { font-size: 56px; font-weight: 700; line-height: 1; }
.status { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 8px; }

.inputSection { margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
.inputRow { display: flex; gap: 10px; align-items: center; }

input {
flex: 1;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 14px;
padding: 16px;
color: white;
font-size: 20px;
outline: none;
}

.saveBtn {
flex: 1;
background: linear-gradient(to bottom, #4CAF50, #2E7D32);
border: none;
border-radius: 14px;
padding: 16px;
color: white;
font-size: 18px;
font-weight: 600;
display: flex; align-items: center; justify-content: center; gap: 8px;
box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.stateBtn {
width: 100%;
background: #1c6a37;
border-radius: 20px;
padding: 20px;
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 12px;
}
.stateBtn.yellow { background: #6c571a; }
.stateInfo { display: flex; align-items: center; gap: 15px; }
.emoji { font-size: 30px; }
.stTitle { font-size: 22px; font-weight: 700; }
.stSub { font-size: 14px; opacity: 0.8; }

</style>
</head>
<body>

<div class="container">
<div class="logo">VagusBuk</div>
<div class="sub">Ruhigeres Nervensystem.</div>

<div class="card">
<div class="sectionHeader">
<span style="color:var(--green)">📈</span>
<div class="sectionTitle">HRV MORGENS</div>
</div>

<div class="hrvGrid">
<div class="hrvCol">
<div class="label">Dein HRV heute</div>
<div class="valueLarge" id="todayHRV">--</div>
<div class="status" id="hrvStatus">
<span style="color:var(--green)">✓</span>
<span id="hrvText">Normales Niveau.</span>
</div>
</div>
<div class="divider"></div>
<div class="hrvCol">
<div class="label">Ø 7-Tage Durchschnitt</div>
<div style="font-size: 32px; font-weight: 600;">Ø <span id="avgHRV">--</span></div>
<div style="font-size: 12px; color: var(--muted); margin-top: 10px;">Im normalen Bereich.</div>
</div>
</div>

<div class="inputSection">
<div class="label" style="margin-bottom: 10px;">Neuen Wert eingeben</div>
<div class="inputRow">
<input type="number" id="hrvInput" placeholder="z.B. 41">
<button class="saveBtn" onclick="saveHRV()">
<span>💾</span> Speichern
</button>
</div>
</div>
</div>

<div class="sectionTitle" style="margin: 25px 0 15px 5px;">Wie ist es gerade?</div>
<div class="stateBtn" onclick="alert('Training startet...')">
<div class="stateInfo">
<div class="emoji">🙂</div>
<div>
<div class="stTitle">Stabil</div>
<div class="stSub">Ich fühle mich ruhig.</div>
</div>
</div>
<div style="opacity: 0.5;">❯</div>
</div>

<div class="stateBtn yellow" onclick="alert('Stabilisierung startet...')">
<div class="stateInfo">
<div class="emoji">😕</div>
<div>
<div class="stTitle">Kippt leicht</div>
<div class="stSub">Erste Überlastung.</div>
</div>
</div>
<div style="opacity: 0.5;">❯</div>
</div>
</div>

<script>
let hrvData = JSON.parse(localStorage.getItem("vb_hrv")) || [];

function saveHRV() {
let val = parseInt(document.getElementById("hrvInput").value);
if(!val) return;
let todayStr = new Date().toLocaleDateString();
let existingIndex = hrvData.findIndex(d => new Date(d.time).toLocaleDateString() === todayStr);

if (existingIndex !== -1) {
hrvData[existingIndex].value = val;
} else {
hrvData.push({ value: val, time: Date.now() });
}

hrvData = hrvData.slice(-14);
localStorage.setItem("vb_hrv", JSON.stringify(hrvData));
document.getElementById("hrvInput").value = ""
updateHRV();
}

function updateHRV() {
if(hrvData.length === 0) return;
let today = hrvData[hrvData.length-1].value;
let avg = Math.round(hrvData.reduce((a,b)=>a+b.value,0) / hrvData.length);
document.getElementById("todayHRV").innerText = today;
document.getElementById("avgHRV").innerText = avg;
}

updateHRV();
</script>
</body>
</html>
