<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk 1.6</title>

<style>
body {
margin: 0;
font-family: -apple-system, sans-serif;
background: #0b0f14;
color: #e8eef2;
text-align: center;
}
.container { padding: 20px; }

button {
width: 90%; max-width: 400px;
margin: 8px; padding: 18px;
font-size: 18px;
border-radius: 12px;
border: none;
color: white;
}

.stable { background:#1f3d2b; }
.tense { background:#4a3f1d; }
.over { background:#4a1d1d; }
.crash { background:#111; }

.hidden { display:none; }
.timer { font-size:48px; margin:20px; }

.warning { color:#ff6b6b; }
.good { color:#6bff95; }
.info { opacity:0.8; }

select {
width: 90%;
max-width: 400px;
padding: 12px;
margin: 8px;
border-radius: 8px;
}
</style>
</head>

<body>

<h1>VagusBuk 1.6</h1>

<div class="container" id="home">

<h2>Zustand</h2>

<button class="stable" onclick="startSession('stable')">Stabil</button>
<button class="tense" onclick="startSession('tense')">Angespannt</button>
<button class="over" onclick="startSession('overstimulated')">Überreizt</button>
<button class="crash" onclick="startSession('crash')">Crash</button>

<p id="dayState"></p>
<p id="forecast" class="warning"></p>

<hr>

<h3>HRV (optional)</h3>
<select id="hrv">
<option value="unknown">Keine Angabe</option>
<option value="good">Gut</option>
<option value="normal">Normal</option>
<option value="low">Niedrig</option>
</select>

<hr>

<h3>Auslöser</h3>
<select id="triggerMain">
<option value="none">Kein klarer Auslöser</option>
<option value="screen_long">Langer Bildschirm</option>
<option value="screen_intense">Intensiver Bildschirm</option>
<option value="social">Sozial</option>
<option value="emotion_negative">Emotion</option>
<option value="cognitive">Denken</option>
<option value="noise">Lärm</option>
</select>

<select id="triggerIntensity">
<option value="low">leicht</option>
<option value="medium">mittel</option>
<option value="high">stark</option>
</select>

<h3>Kopfdruck</h3>
<select id="symptomHead">
<option value="none">Nein</option>
<option value="mild">Leicht</option>
<option value="strong">Stark</option>
</select>

<hr>

<button onclick="quickStart()">Sicher starten</button>
<button onclick="showLog()">Verlauf</button>

</div>

<div class="container hidden" id="session">
<h3 id="exerciseTitle"></h3>
<div id="breath"></div>
<div class="timer" id="timer"></div>

<button onclick="panic()">Zu viel</button>
<button onclick="finishSession()">Fertig</button>
</div>

<div class="container hidden" id="feedback">
<h3>Wie war es?</h3>
<button onclick="saveFeedback('better')">Besser</button>
<button onclick="saveFeedback('same')">Gleich</button>
<button onclick="saveFeedback('worse')">Schlechter</button>
</div>

<div class="container hidden" id="logView">
<div id="log"></div>
<button onclick="goHome()">Zurück</button>
</div>

<script>
let currentState = ""
let currentExercise = ""
let duration = 60;
let interval;
let breathInterval;

const exercises = {
stable: ["Resonanzatmung","Summen"],
tense: ["4-6 Atmung","Nacken lösen"],
overstimulated: ["Augen zu + Atmung","Dunkel + Ruhe"],
crash: ["Minimalmodus"]
};

// --- TAGESFORM ---
function evaluateDay() {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let hrv = document.getElementById("hrv").value;

let last = log.slice(-5);
let worse = last.filter(e => e.result === "worse").length;

let score = 0;

score -= worse;

if (hrv === "low") score -= 2;
if (hrv === "good") score += 1;

let state = "stabil"

if (score <= -3) state = "instabil"
else if (score <= -1) state = "fragil"

document.getElementById("dayState").innerText = "Tagesform: " + state;

if (state === "instabil") {
document.getElementById("forecast").innerText =
"⚠️ Heute Belastung vermeiden"
} else if (state === "fragil") {
document.getElementById("forecast").innerText =
"⚠️ Vorsichtig bleiben"
} else {
document.getElementById("forecast").innerText =
"✔ stabiler Tag"
}

return state;
}

// --- START ---
function startSession(state) {
let day = evaluateDay();

if (day === "instabil") state = "crash"

currentState = state;
currentExercise = selectExercise(state);
duration = getDuration(state);

document.getElementById("home").classList.add("hidden");
document.getElementById("session").classList.remove("hidden");

document.getElementById("exerciseTitle").innerText = currentExercise;

startBreathing(state);
startTimer();
}

// --- AUSWAHL ---
function selectExercise(state) {
return exercises[state][0];
}

// --- BREATH ---
function startBreathing(state) {
let el = document.getElementById("breath");

if (state === "crash") {
el.innerText = "Still liegen."
return;
}

let inhale = 4, exhale = 6;

if (state === "overstimulated") { inhale = 3; exhale = 6; }
if (state === "stable") { inhale = 5; exhale = 5; }

let phase = "in"

breathInterval = setInterval(() => {
el.innerText = (phase === "in") ? "Ein" : "Aus"
phase = (phase === "in") ? "out" : "in"
}, inhale * 1000);
}

// --- TIMER ---
function startTimer() {
let time = duration;
document.getElementById("timer").innerText = time;

interval = setInterval(() => {
time--;
document.getElementById("timer").innerText = time;

if (time <= 0) {
clearInterval(interval);
endSession();
}
}, 1000);
}

function endSession() {
clearInterval(interval);
clearInterval(breathInterval);

setTimeout(() => {
document.getElementById("session").classList.add("hidden");
document.getElementById("feedback").classList.remove("hidden");
}, 500);
}

// --- PANIC ---
function panic() {
clearInterval(interval);
clearInterval(breathInterval);
document.getElementById("breath").innerText = "Stop."
}

// --- SAVE ---
function saveFeedback(result) {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];

log.push({
date: new Date().toLocaleString(),
state: currentState,
exercise: currentExercise,
result: result,
trigger: document.getElementById("triggerMain").value,
intensity: document.getElementById("triggerIntensity").value,
head: document.getElementById("symptomHead").value,
hrv: document.getElementById("hrv").value
});

localStorage.setItem("vagusLog", JSON.stringify(log));

goHome();
}

// --- UI ---
function quickStart() {
startSession("overstimulated");
}

function showLog() {
document.getElementById("home").classList.add("hidden");
document.getElementById("logView").classList.remove("hidden");

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let container = document.getElementById("log");

container.innerHTML = ""

log.slice().reverse().forEach(e => {
container.innerHTML += `
<p>
${e.date}<br>
${e.state} → ${e.result}<br>
HRV: ${e.hrv} | Kopf: ${e.head}
</p><hr>`;
});
}

function goHome() {
document.getElementById("feedback").classList.add("hidden");
document.getElementById("logView").classList.add("hidden");
document.getElementById("session").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

evaluateDay();
}

// INIT
evaluateDay();
</script>

</body>
</html>
