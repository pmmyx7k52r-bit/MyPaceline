<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VagusBuk A5.5</title>

<style>

:root{
--bg:#071018;
--card:#101b27;
--text:#eef3f7;
--muted:#8ea0b1;

--green1:#2fb356;
--green2:#1f7f3c;

--yellow1:#8b6a16;
--yellow2:#6d5310;

--red1:#9f4141;
--red2:#733131;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;

width:100%;
max-width:100%;

overflow-x:hidden;

background:var(--bg);

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

color:var(--text);
}

body{
position:relative;

background:
radial-gradient(
circle at top,
#10263d 0%,
#071018 45%
);
}

.container{

width:100%;
max-width:620px;

margin:0 auto;

padding:
max(24px, env(safe-area-inset-top))
16px
max(120px, env(safe-area-inset-bottom));

overflow-x:hidden;
}

/* HEADER */

.header{
text-align:center;
margin-top:36px;
margin-bottom:26px;
}

.wave{
color:#617387;
font-size:34px;
}

.logo{

margin-top:6px;

font-size:clamp(42px,12vw,64px);

font-weight:800;

letter-spacing:-3px;

line-height:1;
}

.sub{

margin-top:12px;

color:var(--muted);

font-size:clamp(16px,4vw,22px);

line-height:1.4;
}

/* CARDS */

.card{

width:100%;

background:
rgba(12,22,34,.92);

border:
1px solid rgba(255,255,255,.05);

border-radius:28px;

padding:20px;

margin-bottom:18px;

overflow:hidden;
}

/* HRV */

.hrvTop{

display:flex;

justify-content:space-between;

gap:18px;

flex-wrap:wrap;
}

.hrvMain{
flex:1 1 220px;
}

.hrvSide{
flex:0 1 120px;
text-align:right;
}

.label{

color:var(--muted);

text-transform:uppercase;

letter-spacing:1px;

font-size:13px;
}

.hrvValue{

margin-top:6px;

font-size:clamp(52px,16vw,74px);

font-weight:800;

line-height:1;
}

.avgValue{

margin-top:6px;

font-size:clamp(22px,7vw,32px);

font-weight:700;
}

.hrvText{

margin-top:10px;

line-height:1.4;

font-size:18px;

color:#dfe7ee;
}

.trend{

margin-top:10px;

font-size:16px;

color:#d7e0e8;
}

/* INPUT */

.editWrap{

display:none;

gap:10px;

margin-top:18px;

flex-wrap:wrap;
}

.editWrap.open{
display:flex;
}

.hrvInput{

flex:1;

min-width:0;

height:58px;

border:none;

border-radius:18px;

background:#091521;

color:white;

padding:0 18px;

font-size:26px;

outline:none;

border:
1px solid rgba(80,150,220,.22);
}

.btn{

border:none;

border-radius:18px;

color:white;

cursor:pointer;

font-weight:700;
}

.primaryBtn{

background:
linear-gradient(
135deg,
var(--green1),
var(--green2)
);

height:58px;

padding:0 24px;

font-size:18px;
}

.secondaryBtn{

margin-top:16px;

background:#1b2b3d;

padding:14px 18px;

font-size:16px;
}

/* STATES */

.sectionTitle{

color:var(--muted);

text-transform:uppercase;

letter-spacing:1px;

font-size:13px;

margin-bottom:14px;
}

.state{

width:100%;

border:none;

border-radius:26px;

padding:20px;

margin-bottom:14px;

color:white;

text-align:left;

overflow:hidden;
}

.green{
background:
linear-gradient(
135deg,
#236c39,
#1d4d2b
);
}

.yellow{
background:
linear-gradient(
135deg,
#715613,
#5a4410
);
}

.red{
background:
linear-gradient(
135deg,
#743434,
#572828
);
}

.stateRow{

display:flex;

justify-content:space-between;

align-items:center;

gap:14px;
}

.stateLeft{

display:flex;

align-items:center;

gap:16px;

min-width:0;
}

.emoji{
font-size:34px;
}

.stateTitle{

font-size:clamp(24px,7vw,36px);

font-weight:800;

line-height:1.1;
}

.stateDesc{

margin-top:5px;

font-size:18px;

color:rgba(255,255,255,.82);

line-height:1.35;
}

.arrow{

font-size:28px;

opacity:.55;
}

/* PANEL */

.panel{

display:none;

margin-top:12px;

background:#0d1823;

border-radius:24px;

padding:22px;
}

.panel.open{
display:block;
}

.panelTitle{

font-size:clamp(28px,8vw,40px);

font-weight:800;
}

.panelText{

margin-top:14px;

line-height:1.6;

font-size:18px;

color:#d9e2ea;
}

.list{

margin-top:18px;
}

.list div{

margin-bottom:10px;

line-height:1.5;

color:#eef3f7;
}

.warning{

margin-top:18px;

background:#281818;

border:
1px solid rgba(255,90,90,.14);

border-radius:18px;

padding:16px;

color:#ffd2d2;

line-height:1.5;
}

.startBtn{

width:100%;

margin-top:22px;

padding:18px;

font-size:20px;

background:
linear-gradient(
135deg,
var(--green1),
var(--green2)
);
}

.closeBtn{

width:100%;

margin-top:12px;

padding:16px;

font-size:17px;

background:#1b2b3d;
}

/* OVERLAY */

.overlay{

position:fixed;

inset:0;

background:#071018;

display:none;

flex-direction:column;

justify-content:center;
align-items:center;

text-align:center;

padding:
max(30px, env(safe-area-inset-top))
22px
max(40px, env(safe-area-inset-bottom));

z-index:999;
}

.circle{

width:min(180px,52vw);
height:min(180px,52vw);

border-radius:50%;

background:
radial-gradient(
circle,
#47d86a 0%,
#216f35 72%
);

box-shadow:
0 0 80px rgba(71,216,106,.22);

transition:2s ease-in-out;
}

.expand{
transform:scale(1.18);
}

.phase{

margin-top:30px;

font-size:clamp(30px,8vw,42px);

font-weight:800;
}

.timer{

margin-top:10px;

font-size:clamp(64px,18vw,96px);

font-weight:800;

line-height:1;
}

.info{

margin-top:22px;

max-width:520px;

color:var(--muted);

line-height:1.6;

font-size:clamp(18px,5vw,24px);
}

.stopBtn{

margin-top:34px;

background:#213140;

padding:16px 26px;

font-size:17px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="wave">
〰〰
</div>

<div class="logo">
VagusBuk
</div>

<div class="sub">
HRV-Training & Nervensystem-Regulation
</div>

</div>

<!-- HRV -->

<div class="card">

<div class="hrvTop">

<div class="hrvMain">

<div class="label">
HRV heute
</div>

<div
class="hrvValue"
id="todayHRV"
>
--
</div>

<div
class="hrvText"
id="hrvText"
>
Direkt morgens messen.
</div>

</div>

<div class="hrvSide">

<div class="label">
Ø 7 Tage
</div>

<div
class="avgValue"
id="avgHRV"
>
--
</div>

<div
class="trend"
id="trend"
>
Noch kein Trend
</div>

</div>

</div>

<button
class="btn secondaryBtn"
onclick="toggleEdit()"
>
HRV eintragen
</button>

<div
class="editWrap"
id="editWrap"
>

<input
type="number"
class="hrvInput"
id="hrvInput"
placeholder="z.B. 41"
>

<button
class="btn primaryBtn"
onclick="saveHRV()"
>
Speichern
</button>

</div>

</div>

<!-- STATES -->

<div class="card">

<div class="sectionTitle">
Wie ist es gerade?
</div>

<button
class="state green"
onclick="openPanel('green')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
🙂
</div>

<div>

<div class="stateTitle">
Stabil
</div>

<div class="stateDesc">
Ruhig und belastbar.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="state yellow"
onclick="openPanel('yellow')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
😕
</div>

<div>

<div class="stateTitle">
Kippt leicht
</div>

<div class="stateDesc">
Erste Überlastung.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="state red"
onclick="openPanel('red')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
😣
</div>

<div>

<div class="stateTitle">
Kippt
</div>

<div class="stateDesc">
Überreizt oder erschöpft.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<!-- PANEL -->

<div
class="panel"
id="panel"
>

<div
class="panelTitle"
id="panelTitle"
>
</div>

<div
class="panelText"
id="panelText"
>
</div>

<div
class="list"
id="panelList"
>
</div>

<div
class="warning"
id="warning"
style="display:none"
>
</div>

<button
class="btn startBtn"
id="startBtn"
>
Training starten
</button>

<button
class="btn closeBtn"
onclick="closePanel()"
>
Zurück
</button>

</div>

</div>

</div>

<!-- OVERLAY -->

<div
class="overlay"
id="overlay"
>

<div
class="circle"
id="circle"
></div>

<div
class="phase"
id="phase"
>
Vorbereitung
</div>

<div
class="timer"
id="timer"
>
60
</div>

<div
class="info"
id="info"
>
Ruhig werden.
</div>

<button
class="btn stopBtn"
onclick="stopTraining()"
>
Abbrechen
</button>

</div>

<script>

let hrvData =
JSON.parse(
localStorage.getItem("vb_hrv")
) || [];

let interval = null;

/* HRV */

function toggleEdit(){

document
.getElementById("editWrap")
.classList.toggle("open");
}

function saveHRV(){

let val =
parseInt(
document.getElementById("hrvInput").value
);

if(!val) return;

hrvData.push({
value:val,
time:Date.now()
});

hrvData = hrvData.slice(-30);

localStorage.setItem(
"vb_hrv",
JSON.stringify(hrvData)
);

updateHRV();

document.getElementById(
"hrvInput"
).value = ""

toggleEdit();
}

function updateHRV(){

if(hrvData.length === 0) return;

let today =
hrvData[hrvData.length - 1].value;

let recent =
hrvData.slice(-7);

let avg =
Math.round(

recent.reduce(
(a,b)=>a+b.value,
0
) / recent.length

);

document.getElementById(
"todayHRV"
).innerText = today;

document.getElementById(
"avgHRV"
).innerText = avg;

let text =
document.getElementById(
"hrvText"
);

if(today >= 45){

text.innerText =
"Nervensystem heute eher stabil."

}else if(today >= 30){

text.innerText =
"Heute moderate Belastbarkeit."

}else{

text.innerText =
"Heute vorsichtiger bleiben."
}

let trend =
document.getElementById("trend");

if(hrvData.length >= 4){

let last =
hrvData[hrvData.length-1].value;

let old =
hrvData[hrvData.length-4].value;

if(last > old){

trend.innerText =
"↗ HRV steigt"

}else if(last < old){

trend.innerText =
"↘ HRV sinkt"

}else{

trend.innerText =
"→ stabil"
}
}
}

/* PANEL */

function openPanel(type){

let panel =
document.getElementById("panel");

panel.classList.add("open");

let title =
document.getElementById("panelTitle");

let text =
document.getElementById("panelText");

let list =
document.getElementById("panelList");

let warning =
document.getElementById("warning");

let startBtn =
document.getElementById("startBtn");

warning.style.display = "none"

let hrv =
hrvData.length
? hrvData[hrvData.length-1].value
: 40;

if(type === "green"){

title.innerText =
"HRV Aufbau"

text.innerText =
"Ruhige Atmung und verlängertes Ausatmen fördern vagale Aktivität."

list.innerHTML = `
<div>• 4 Sekunden einatmen</div>
<div>• 6 Sekunden ausatmen</div>
<div>• später Summen</div>
<div>• Dauer: 3–5 Minuten</div>
`;

if(hrv < 30){

warning.style.display = "block"

warning.innerText =
"HRV heute niedrig. Ruhig und ohne Leistungsdruck trainieren."
}

startBtn.onclick =
()=>startTraining("green");
}

if(type === "yellow"){

title.innerText =
"Frühe Stabilisierung"

text.innerText =
"Überlastung früh beruhigen bevor das Nervensystem stärker kippt."

list.innerHTML = `
<div>• langsames Ausatmen</div>
<div>• Schultern lockern</div>
<div>• ruhiger Blick</div>
<div>• Dauer: 60 Sekunden</div>
`;

startBtn.onclick =
()=>startTraining("yellow");
}

if(type === "red"){

title.innerText =
"Akute Beruhigung"

text.innerText =
"Körperreize helfen oft besser als intensive Atemübungen."

list.innerHTML = `
<div>• Brustbein klopfen</div>
<div>• langsam ausatmen</div>
<div>• Summen</div>
<div>• Dauer: 45 Sekunden</div>
`;

startBtn.onclick =
()=>startTraining("red");
}
}

function closePanel(){

document
.getElementById("panel")
.classList.remove("open");
}

/* TRAINING */

function startTraining(type){

document
.getElementById("overlay")
.style.display = "flex"

if(type === "green"){
startGreen();
}

if(type === "yellow"){
startYellow();
}

if(type === "red"){
startRed();
}
}

function stopTraining(){

clearInterval(interval);

document
.getElementById("overlay")
.style.display = "none"

speechSynthesis.cancel();
}

/* GREEN */

function startGreen(){

let t = 300;
let cycle = 0;

let hrv =
hrvData.length
? hrvData[hrvData.length-1].value
: 40;

if(hrv < 30){
t = 180;
}

interval = setInterval(()=>{

t--;
cycle++;

updateTimer(t);

if(cycle % 10 < 4){

setPhase("Einatmen");

expand(true);

speak("Ein");

}else{

setPhase("Ausatmen");

expand(false);

speak("Aus");
}

if(t < 120){

setInfo(
"Summen beim Ausatmen."
);

if(cycle % 10 === 4){

speak("Voooo");
}
}

if(t <= 0){

finishTraining(
"Training abgeschlossen."
);
}

},1000);
}

/* YELLOW */

function startYellow(){

let t = 60;
let cycle = 0;

setInfo(
"Langsam ruhiger werden."
);

interval = setInterval(()=>{

t--;
cycle++;

updateTimer(t);

if(cycle % 10 < 4){

setPhase("Einatmen");
expand(true);

}else{

setPhase("Lang ausatmen");
expand(false);
}

if(t <= 0){

finishTraining(
"Etwas stabiler."
);
}

},1000);
}

/* RED */

function startRed(){

let t = 45;

setPhase(
"Brustbein klopfen"
);

setInfo(
"Nur sanft und ruhig."
);

interval = setInterval(()=>{

t--;

updateTimer(t);

if(t === 25){

setPhase(
"Lang ausatmen"
);
}

if(t === 10){

setPhase(
"Summen"
);
}

if(t <= 0){

finishTraining(
"Überreizung reduziert."
);
}

},1000);
}

/* HELPERS */

function setPhase(t){

document
.getElementById("phase")
.innerText = t;
}

function setInfo(t){

document
.getElementById("info")
.innerText = t;
}

function updateTimer(sec){

let m =
Math.floor(sec / 60);

let s =
sec % 60;

document
.getElementById("timer")
.innerText =
`${m}:${s
.toString()
.padStart(2,"0")}`;
}

function expand(state){

let c =
document.getElementById("circle");

if(state){

c.classList.add("expand");

}else{

c.classList.remove("expand");
}
}

function finishTraining(text){

clearInterval(interval);

setPhase("Fertig");

setInfo(text);

setTimeout(()=>{

document
.getElementById("overlay")
.style.display = "none"

},2000);
}

function speak(text){

speechSynthesis.cancel();

let msg =
new SpeechSynthesisUtterance(text);

msg.lang = "de-DE"
msg.rate = .92;

speechSynthesis.speak(msg);
}

/* INIT */

updateHRV();

</script>

</body>
</html>
