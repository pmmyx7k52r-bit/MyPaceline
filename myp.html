<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk 3.3</title>

<style>
body {
margin:0;
font-family:-apple-system,sans-serif;
background:#0b0f14;
color:#e8eef2;
text-align:center;
}

.container { padding:20px; }

button {
width:90%;
max-width:420px;
margin:10px;
padding:16px;
font-size:16px;
border-radius:12px;
border:none;
color:white;
}

.primary { background:#2b4a3a; }
.secondary { background:#2d3b4a; }

.card {
background:#15202b;
padding:16px;
margin-top:16px;
border-radius:12px;
text-align:left;
}

.small { font-size:13px; opacity:0.7; }

.hidden { display:none; }

.badge {
font-size:12px;
opacity:0.6;
margin-bottom:8px;
}
</style>
</head>

<body>

<h1>VagusBuk 3.3</h1>

<div class="container">

<div class="card">
<strong>Soft Adaptive System</strong><br>
<div class="small">keine automatische Steuerung – nur Vorschläge</div>
</div>

<button class="primary" onclick="runSession()">
Recovery starten
</button>

<div id="suggestion" class="card hidden"></div>

<div id="status" class="card hidden"></div>

</div>

<script>

let interruptions = 0;
let lastShortSession = false;

function speak(text) {
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "de-DE"
msg.rate = 0.9;
speechSynthesis.speak(msg);
}

// ----------------------------
// BASIS SESSION
// ----------------------------
function runSession() {

document.getElementById("status").classList.remove("hidden");
document.getElementById("status").innerText = "Session läuft (60s)"

speak("Beginne. Folge deinem Atem.");

setTimeout(() => {
endSession(true);
}, 60000);
}

// ----------------------------
// SESSION ENDE
// ----------------------------
function endSession(completed) {

document.getElementById("status").innerText =
completed ? "Abgeschlossen" : "Früh beendet"

if (!completed) {
interruptions++;
lastShortSession = true;
} else {
// leichte Erholung im System
interruptions = Math.max(0, interruptions - 1);
lastShortSession = false;
}

evaluateState();
}

// ----------------------------
// SOFT ANALYSIS
// ----------------------------
function evaluateState() {

let level = "stable"
let text = ""

// nur Tendenzen, keine harte Klassifikation
if (interruptions >= 3) {
level = "low_capacity"
}

if (lastShortSession) {
level = "reduced_capacity"
}

// Vorschläge statt Zwang
if (level === "stable") {

text = `
✔ stabiler Verlauf<br>
→ normale 60s Session empfohlen
`;

} else if (level === "reduced_capacity") {

text = `
⚠ reduzierte Kapazität erkannt<br><br>
Vorschlag:<br>
- kürzere 30–40s Session<br>
- mehr Pausen zwischen Übungen
`;

} else {

text = `
⚠ hohe Belastungstendenz<br><br>
Vorschlag:<br>
- nur Körperkontakt (Hand auf Brust)<br>
- keine strukturierte Atmung erzwingen<br>
`;
}

showSuggestion(text);
}

// ----------------------------
// UI
// ----------------------------
function showSuggestion(text) {

let box = document.getElementById("suggestion");
box.classList.remove("hidden");
box.innerHTML = text;
}

</script>

</body>
</html>
