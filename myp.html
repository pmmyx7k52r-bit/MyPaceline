<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VagusBuk 6.1.2.1</title>

<style>

:root{
--bg:#071018;
--card:#101b27;
--card2:#132235;

--text:#eef3f7;
--muted:#8fa1b2;

--green:#2f9d51;
--yellow:#8c6915;
--red:#8a3f3f;

--border:rgba(255,255,255,.06);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;

width:100%;
overflow-x:hidden;

background:var(--bg);

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

color:var(--text);
}

body{
background:
radial-gradient(
circle at top,
#0e2942 0%,
#071018 42%
);
}

.container{

width:100%;
max-width:640px;

margin:auto;

padding:
max(18px, env(safe-area-inset-top))
14px
max(120px, env(safe-area-inset-bottom));
}

/* HEADER */

.header{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:12px;

margin-top:10px;

margin-bottom:18px;
}

.logo{

font-size:clamp(34px,10vw,52px);

font-weight:800;

letter-spacing:-2px;

line-height:1;
}

.sub{

margin-top:5px;

color:var(--muted);

font-size:14px;

line-height:1.45;
}

.hrvBox{

min-width:110px;

background:
rgba(12,22,34,.92);

border:
1px solid var(--border);

border-radius:20px;

padding:12px 14px;

text-align:right;
}

.hrvLabel{

color:var(--muted);

font-size:11px;

text-transform:uppercase;

letter-spacing:1px;
}

.hrvValue{

margin-top:4px;

font-size:42px;

font-weight:800;

line-height:1;
}

.hrvTrend{

margin-top:6px;

font-size:13px;

color:#dce5ee;
}

/* CARD */

.card{

background:
rgba(12,22,34,.92);

border:
1px solid var(--border);

border-radius:24px;

padding:18px;

margin-bottom:16px;
}

.sectionTitle{

color:var(--muted);

font-size:12px;

text-transform:uppercase;

letter-spacing:1px;

margin-bottom:14px;
}

/* TODAY */

.todayBox{

border-radius:20px;

padding:18px;

background:
linear-gradient(
135deg,
#1b3146,
#132131
);
}

.todayState{

font-size:28px;

font-weight:800;

line-height:1.2;
}

.todayText{

margin-top:10px;

line-height:1.55;

color:#dce5ee;

font-size:17px;
}

/* INPUT */

.entryRow{

display:flex;

gap:10px;

flex-wrap:wrap;
}

.hrvInput{

flex:1;

min-width:0;

height:56px;

border:none;

border-radius:16px;

background:#081521;

color:white;

padding:0 16px;

font-size:24px;

outline:none;

appearance:none;
-webkit-appearance:none;
}

.hrvInput::placeholder{
color:#718396;
}

.saveBtn{

height:56px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#35c65f,
#22863e
);

color:white;

padding:0 18px;

font-size:16px;

font-weight:700;
}

/* GRAPH */

.graph{

display:flex;

align-items:flex-end;

gap:8px;

height:120px;

margin-top:14px;
}

.bar{

flex:1;

min-height:12px;

border-radius:12px 12px 6px 6px;

background:
linear-gradient(
180deg,
#4ad96f,
#236f36
);

position:relative;
}

.barValue{

position:absolute;

top:-24px;

width:100%;

text-align:center;

font-size:12px;

color:#dce5ee;
}

/* STATUS */

.statusList{
display:flex;
flex-direction:column;
gap:10px;
}

.statusBtn{

width:100%;

border:none;

border-radius:20px;

padding:16px;

color:white;

text-align:left;
}

.green{
background:
linear-gradient(
135deg,
#246c39,
#1c4d2a
);
}

.yellow{
background:
linear-gradient(
135deg,
#7c5d13,
#5e470f
);
}

.red{
background:
linear-gradient(
135deg,
#803939,
#5d2929
);
}

.statusTop{

display:flex;

justify-content:space-between;

align-items:center;
}

.statusLeft{

display:flex;

align-items:center;

gap:14px;
}

.emoji{
font-size:28px;
}

.statusTitle{

font-size:clamp(22px,7vw,30px);

font-weight:800;
}

.statusDesc{

margin-top:4px;

font-size:16px;

color:rgba(255,255,255,.84);
}

.arrow{
font-size:24px;
opacity:.55;
}

/* PANEL */

.panel{

display:none;

margin-top:12px;

background:#0d1824;

border-radius:20px;

padding:18px;
}

.panel.open{
display:block;
}

.panelTitle{

font-size:30px;

font-weight:800;
}

.panelText{

margin-top:10px;

line-height:1.55;

color:#dce4ec;

font-size:17px;
}

.trainingList{

margin-top:18px;
}

.trainingList div{

margin-bottom:10px;

line-height:1.5;
}

.warning{

margin-top:16px;

background:#2a1919;

border-radius:16px;

padding:14px;

color:#ffd6d6;

line-height:1.5;

display:none;
}

.panelBtns{

display:flex;

gap:10px;

margin-top:20px;
}

.startBtn,
.backBtn{

flex:1;

height:56px;

border:none;

border-radius:16px;

color:white;

font-size:17px;

font-weight:700;
}

.startBtn{

background:
linear-gradient(
135deg,
#35c65f,
#22863e
);
}

.backBtn{
background:#1c2c3f;
}

/* TRAINING */

.overlay{

position:fixed;

inset:0;

background:#071018;

display:none;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:
max(24px, env(safe-area-inset-top))
20px
max(36px, env(safe-area-inset-bottom));

z-index:999;
}

.circle{

width:60px;
height:60px;

border-radius:50%;

background:
radial-gradient(
circle,
#57e07b 0%,
#236f36 75%
);

transition:
width 4s linear,
height 4s linear;

box-shadow:
0 0 80px rgba(71,216,106,.25);
}

.phase{

margin-top:28px;

font-size:clamp(28px,8vw,40px);

font-weight:800;
}

.timer{

margin-top:10px;

font-size:clamp(64px,18vw,92px);

font-weight:800;

line-height:1;
}

.info{

margin-top:18px;

color:var(--muted);

font-size:18px;

line-height:1.6;

max-width:480px;
}

.stopBtn{

margin-top:30px;

width:100%;

max-width:280px;

height:56px;

border:none;

border-radius:16px;

background:#1c2c3f;

color:white;

font-size:17px;

font-weight:700;
}

/* FEEDBACK */

.feedback{

display:none;

position:fixed;

inset:0;

background:#071018;

z-index:1000;

justify-content:center;

align-items:center;

padding:24px;
}

.feedbackCard{

width:100%;

max-width:420px;

background:#101b27;

border-radius:26px;

padding:24px;

border:
1px solid var(--border);

text-align:center;
}

.feedbackTitle{

font-size:30px;

font-weight:800;
}

.feedbackBtns{

display:flex;

flex-direction:column;

gap:12px;

margin-top:24px;
}

.feedbackBtn{

border:none;

border-radius:18px;

padding:18px;

color:white;

font-size:18px;

font-weight:700;
}

.good{
background:#236f36;
}

.same{
background:#7c5d13;
}

.bad{
background:#803939;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div>

<div class="logo">
VagusBuk
</div>

<div class="sub">
Adaptives HRV- & Nervensystem-Training
</div>

</div>

<div class="hrvBox">

<div class="hrvLabel">
HRV
</div>

<div
class="hrvValue"
id="todayHRV"
>
--
</div>

<div
class="hrvTrend"
id="trend"
>
kein Trend
</div>

</div>

</div>

<!-- TODAY -->

<div class="card">

<div class="sectionTitle">
Heute
</div>

<div class="todayBox">

<div
class="todayState"
id="todayState"
>
Noch keine Daten
</div>

<div
class="todayText"
id="todayText"
>
Trage morgens deine HRV ein.
</div>

</div>

</div>

<!-- INPUT -->

<div class="card">

<div class="sectionTitle">
HRV morgens eintragen
</div>

<div class="entryRow">

<input
class="hrvInput"
id="hrvInput"
inputmode="numeric"
pattern="[0-9]*"
autocomplete="off"
placeholder="z.B. 41"
/>

<button
class="saveBtn"
onclick="saveHRV()"
>
Speichern
</button>

</div>

</div>

<!-- GRAPH -->

<div class="card">

<div class="sectionTitle">
HRV Verlauf (7 Tage)
</div>

<div
class="graph"
id="graph"
></div>

</div>

<!-- STATUS -->

<div class="card">

<div class="sectionTitle">
Wie ist es gerade?
</div>

<div class="statusList">

<button
class="statusBtn green"
onclick="openPanel('green')"
>

<div class="statusTop">

<div class="statusLeft">

<div class="emoji">
🙂
</div>

<div>

<div class="statusTitle">
Stabil
</div>

<div class="statusDesc">
Aufbau & Training
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="statusBtn yellow"
onclick="openPanel('yellow')"
>

<div class="statusTop">

<div class="statusLeft">

<div class="emoji">
😕
</div>

<div>

<div class="statusTitle">
Kippt leicht
</div>

<div class="statusDesc">
Früh stabilisieren
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="statusBtn red"
onclick="openPanel('red')"
>

<div class="statusTop">

<div class="statusLeft">

<div class="emoji">
😣
</div>

<div>

<div class="statusTitle">
Kippt
</div>

<div class="statusDesc">
Akut beruhigen
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

</div>

<div
class="panel"
id="panel"
>

<div
class="panelTitle"
id="panelTitle"
></div>

<div
class="panelText"
id="panelText"
></div>

<div
class="trainingList"
id="trainingList"
></div>

<div
class="warning"
id="warning"
></div>

<div class="panelBtns">

<button
class="startBtn"
id="startBtn"
>
Training starten
</button>

<button
class="backBtn"
onclick="closePanel()"
>
Zurück
</button>

</div>

</div>

</div>

</div>

<!-- TRAINING -->

<div
class="overlay"
id="overlay"
>

<div
class="circle"
id="circle"
></div>

<div
class="phase"
id="phase"
>
Vorbereitung
</div>

<div
class="timer"
id="timer"
>
0:00
</div>

<div
class="info"
id="info"
>
Folge nur der Bewegung.
</div>

<button
class="stopBtn"
onclick="stopTraining()"
>
Abbrechen
</button>

</div>

<!-- FEEDBACK -->

<div
class="feedback"
id="feedback"
>

<div class="feedbackCard">

<div class="feedbackTitle">
Wie fühlst du dich jetzt?
</div>

<div class="feedbackBtns">

<button
class="feedbackBtn good"
onclick="closeFeedback()"
>
🙂 stabiler
</button>

<button
class="feedbackBtn same"
onclick="closeFeedback()"
>
😐 gleich
</button>

<button
class="feedbackBtn bad"
onclick="closeFeedback()"
>
😣 schlechter
</button>

</div>

</div>

</div>

<script>

let hrvData = [];
let interval = null;

/* STORAGE */

function loadStorage(){

try{

const raw =
localStorage.getItem("vb_hrv");

if(!raw){

hrvData = [];
return;
}

const parsed =
JSON.parse(raw);

if(Array.isArray(parsed)){

hrvData = parsed;

}else{

hrvData = [];
}

}catch(e){

console.log(
"Storage beschädigt"
);

hrvData = [];
}
}

function saveStorage(){

try{

localStorage.setItem(
"vb_hrv",
JSON.stringify(hrvData)
);

}catch(e){

console.log(
"Storage Fehler"
);
}
}

/* SAVE HRV */

function saveHRV(){

const input =
document.getElementById(
"hrvInput"
);

const value =
parseInt(
input.value.trim()
);

if(isNaN(value)){

input.focus();
return;
}

if(value < 1 || value > 250){

alert(
"Bitte gültigen HRV-Wert eingeben."
);

return;
}

hrvData.push({

value:value,
time:Date.now()

});

hrvData =
hrvData.slice(-30);

saveStorage();

updateUI();

input.value = ""

const btn =
document.querySelector(
".saveBtn"
);

btn.innerText =
"Gespeichert"

setTimeout(()=>{

btn.innerText =
"Speichern"

},1000);
}

/* UI */

function updateUI(){

updateHRVBox();
updateToday();
updateGraph();
}

/* HRV */

function updateHRVBox(){

if(hrvData.length === 0){

document.getElementById(
"todayHRV"
).innerText = "--"

document.getElementById(
"trend"
).innerText =
"kein Trend"

return;
}

const latest =
hrvData[
hrvData.length - 1
].value;

document.getElementById(
"todayHRV"
).innerText = latest;

if(hrvData.length < 4){

document.getElementById(
"trend"
).innerText =
"sammelt Daten"

return;
}

const old =
hrvData[
hrvData.length - 4
].value;

let trend = "→ stabil"

if(latest > old){

trend = "↗ steigt"
}

if(latest < old){

trend = "↘ sinkt"
}

document.getElementById(
"trend"
).innerText = trend;
}

/* TODAY */

function updateToday(){

const state =
document.getElementById(
"todayState"
);

const text =
document.getElementById(
"todayText"
);

if(hrvData.length === 0){

state.innerText =
"Noch keine Daten"

text.innerText =
"Trage morgens deine HRV ein."

return;
}

const latest =
hrvData[
hrvData.length - 1
].value;

if(latest < 25){

state.innerText =
"⚠ empfindliches Nervensystem"

text.innerText =
"Heute eher kurze Regulation."

}else if(latest < 40){

state.innerText =
"⚠ mittlere Belastbarkeit"

text.innerText =
"Sanfter Aufbau sinnvoll."

}else{

state.innerText =
"✓ gute vagale Stabilität"

text.innerText =
"Heute eignet sich längeres Training."
}
}

/* GRAPH */

function updateGraph(){

const graph =
document.getElementById(
"graph"
);

graph.innerHTML = ""

const recent =
hrvData.slice(-7);

recent.forEach(item=>{

const bar =
document.createElement("div");

bar.className =
"bar"

const height =
Math.max(
12,
item.value * 2
);

bar.style.height =
`${height}px`;

const label =
document.createElement("div");

label.className =
"barValue"

label.innerText =
item.value;

bar.appendChild(label);

graph.appendChild(bar);
});
}

/* PANEL */

function openPanel(type){

const panel =
document.getElementById(
"panel"
);

panel.classList.add(
"open"
);

const title =
document.getElementById(
"panelTitle"
);

const text =
document.getElementById(
"panelText"
);

const list =
document.getElementById(
"trainingList"
);

const warning =
document.getElementById(
"warning"
);

const startBtn =
document.getElementById(
"startBtn"
);

warning.style.display =
"none"

let hrv = 30;

if(hrvData.length){

hrv =
hrvData[
hrvData.length - 1
].value;
}

let duration = 180;

if(hrv < 25){

duration = 90;

}else if(hrv > 45){

duration = 300;
}

if(type === "green"){

title.innerText =
"HRV-Aufbau"

text.innerText =
`Empfohlene Dauer: ${duration / 60} Minuten`;

list.innerHTML = `
<div>• langsame Atmung</div>
<div>• Ball folgt dem Atem</div>
<div>• längere Ausatmung</div>
<div>• optional Summen</div>
`;

if(hrv < 25){

warning.style.display =
"block"

warning.innerText =
"Heute vorsichtig trainieren."
}

startBtn.onclick =
()=>startTraining(duration);
}

if(type === "yellow"){

title.innerText =
"Frühe Stabilisierung"

text.innerText =
"Überlastung früh beruhigen."

list.innerHTML = `
<div>• langsamer Rhythmus</div>
<div>• Fokus auf Bewegung</div>
<div>• keine Anstrengung</div>
`;

startBtn.onclick =
()=>startTraining(60);
}

if(type === "red"){

title.innerText =
"Akute Beruhigung"

text.innerText =
"Körper zuerst beruhigen."

list.innerHTML = `
<div>• Brustbein klopfen</div>
<div>• langsam ausatmen</div>
<div>• später Summen</div>
`;

startBtn.onclick =
()=>startTraining(45);
}
}

function closePanel(){

document
.getElementById("panel")
.classList.remove("open");
}

/* TRAINING */

function startTraining(seconds){

document
.getElementById("overlay")
.style.display = "flex"

let remaining =
seconds;

let cycle = 0;

updateTimer(remaining);

clearInterval(interval);

interval =
setInterval(()=>{

remaining--;
cycle++;

updateTimer(remaining);

if(cycle % 10 < 4){

setPhase(
"Einatmen"
);

expand(true);

}else{

setPhase(
"Ausatmen"
);

expand(false);
}

if(remaining < 60){

setInfo(
"Optional beim Ausatmen summen."
);
}

if(remaining <= 0){

finishTraining();
}

},1000);
}

function stopTraining(){

clearInterval(interval);

document
.getElementById("overlay")
.style.display = "none"
}

function finishTraining(){

clearInterval(interval);

setPhase("Fertig");

setInfo(
"Kurz nachspüren."
);

setTimeout(()=>{

document
.getElementById("overlay")
.style.display = "none"

document
.getElementById("feedback")
.style.display = "flex"

},1800);
}

/* FEEDBACK */

function closeFeedback(){

document
.getElementById("feedback")
.style.display = "none"
}

/* HELPERS */

function updateTimer(sec){

const m =
Math.floor(sec / 60);

const s =
sec % 60;

document
.getElementById("timer")
.innerText =
`${m}:${String(s).padStart(2,"0")}`;
}

function setPhase(text){

document
.getElementById("phase")
.innerText = text;
}

function setInfo(text){

document
.getElementById("info")
.innerText = text;
}

function expand(state){

const circle =
document.getElementById(
"circle"
);

if(state){

circle.style.width =
"220px"

circle.style.height =
"220px"

}else{

circle.style.width =
"60px"

circle.style.height =
"60px"
}
}

/* INIT */

loadStorage();
updateUI();

</script>

</body>
</html>
