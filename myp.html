<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VagusBuk A5.5</title>

<style>

:root{
--bg:#071018;
--card:#101b27;
--text:#eef3f7;
--muted:#90a2b4;

--green:#39c85d;
--yellow:#ddb347;
--red:#da6666;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;

background:
radial-gradient(circle at top,#11243a 0%,#071018 45%);

color:var(--text);
}

.container{
max-width:620px;
margin:auto;
padding:22px 18px 120px;
}

/* HEADER */

.header{
text-align:center;
margin-top:34px;
margin-bottom:24px;
}

.wave{
font-size:34px;
color:#607286;
}

.logo{
margin-top:6px;
font-size:54px;
font-weight:800;
letter-spacing:-3px;
}

.sub{
margin-top:10px;
color:var(--muted);
font-size:18px;
}

/* HRV */

.hrvCard{
background:rgba(12,22,34,.92);

border:1px solid rgba(255,255,255,.05);

border-radius:28px;

padding:20px;

margin-bottom:18px;
}

.hrvTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.hrvMain{
display:flex;
flex-direction:column;
}

.hrvLabel{
color:var(--muted);

text-transform:uppercase;

letter-spacing:1px;

font-size:13px;
}

.hrvValue{
margin-top:4px;

font-size:56px;
font-weight:800;

letter-spacing:-2px;
}

.hrvStatus{
margin-top:8px;

font-size:17px;

color:#dbe5ec;
}

.hrvSide{
text-align:right;
}

.avgLabel{
color:var(--muted);

font-size:12px;

text-transform:uppercase;

letter-spacing:1px;
}

.avgValue{
margin-top:5px;

font-size:24px;
font-weight:700;
}

.trend{
margin-top:10px;

font-size:15px;

color:#d6e0e8;
}

.hrvEdit{
display:none;

gap:10px;

margin-top:18px;
}

.hrvEdit.open{
display:flex;
}

.hrvInput{
flex:1;

height:56px;

border:none;

border-radius:18px;

background:#09131d;

color:white;

font-size:24px;

padding:0 18px;

outline:none;

border:1px solid rgba(90,150,230,.25);
}

.saveBtn{
border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#3dc85d,
#24843b
);

color:white;

font-size:16px;
font-weight:700;

padding:0 22px;
}

.smallBtn{
margin-top:16px;

border:none;

background:#1b2a3a;

color:white;

border-radius:16px;

padding:12px 18px;

font-size:15px;
}

/* MAIN */

.mainCard{
background:rgba(12,22,34,.92);

border:1px solid rgba(255,255,255,.05);

border-radius:28px;

padding:18px;
}

.sectionLabel{
color:var(--muted);

text-transform:uppercase;

letter-spacing:1px;

font-size:13px;

margin-bottom:14px;
}

/* STATES */

.state{
width:100%;

border:none;

border-radius:24px;

text-align:left;

padding:22px;

margin-bottom:14px;

color:white;
}

.green{
background:
linear-gradient(
135deg,
#1d6a38,
#234d31
);
}

.yellow{
background:
linear-gradient(
135deg,
#6a5719,
#554415
);
}

.red{
background:
linear-gradient(
135deg,
#6a2d2d,
#512626
);
}

.stateRow{
display:flex;
justify-content:space-between;
align-items:center;
}

.stateLeft{
display:flex;
align-items:center;
gap:16px;
}

.emoji{
font-size:34px;
}

.stateTitle{
font-size:28px;
font-weight:800;
}

.stateDesc{
margin-top:4px;

font-size:16px;

color:rgba(255,255,255,.82);
}

.arrow{
font-size:30px;
opacity:.5;
}

/* PANEL */

.trainingPanel{
display:none;

margin-top:6px;

background:#0d1722;

border-radius:24px;

padding:22px;
}

.trainingPanel.open{
display:block;
}

.trainingTitle{
font-size:30px;
font-weight:800;
}

.trainingText{
margin-top:12px;

color:#d7e1e8;

line-height:1.55;

font-size:17px;
}

.trainingList{
margin-top:16px;
}

.trainingList div{
margin-bottom:10px;
}

.warning{
margin-top:18px;

background:#261717;

border:1px solid rgba(255,100,100,.15);

border-radius:18px;

padding:16px;

color:#ffd4d4;

line-height:1.45;

font-size:15px;
}

.startBtn{
width:100%;

margin-top:22px;

border:none;

border-radius:20px;

padding:18px;

background:
linear-gradient(
135deg,
#3dc85d,
#24843b
);

color:white;

font-size:20px;
font-weight:700;
}

.backBtn{
width:100%;

margin-top:12px;

border:none;

border-radius:18px;

padding:16px;

background:#1b2a3a;

color:white;

font-size:16px;
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;

background:#071018;

display:none;

flex-direction:column;

justify-content:center;
align-items:center;

text-align:center;

padding:30px;

z-index:999;
}

.circle{
width:180px;
height:180px;

border-radius:50%;

background:
radial-gradient(
circle,
#45d766 0%,
#216f35 70%
);

box-shadow:
0 0 70px rgba(69,215,102,.22);

transition:2s ease-in-out;
}

.expand{
transform:scale(1.18);
}

.phase{
margin-top:30px;

font-size:38px;
font-weight:800;
}

.timer{
margin-top:10px;

font-size:78px;
font-weight:800;
}

.info{
margin-top:20px;

color:var(--muted);

max-width:520px;

line-height:1.5;

font-size:20px;
}

.stopBtn{
margin-top:34px;

border:none;

border-radius:18px;

background:#223140;

color:white;

padding:16px 28px;

font-size:17px;
}

@media(max-width:700px){

.logo{
font-size:46px;
}

.stateTitle{
font-size:24px;
}

.trainingTitle{
font-size:26px;
}

.phase{
font-size:32px;
}

.timer{
font-size:66px;
}
}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div class="wave">
〰〰
</div>

<div class="logo">
VagusBuk
</div>

<div class="sub">
HRV-Training & Nervensystem-Regulation
</div>

</div>

<!-- HRV -->

<div class="hrvCard">

<div class="hrvTop">

<div class="hrvMain">

<div class="hrvLabel">
HRV heute
</div>

<div
class="hrvValue"
id="todayHRV"
>
--
</div>

<div
class="hrvStatus"
id="hrvStatus"
>
Direkt morgens messen.
</div>

</div>

<div class="hrvSide">

<div class="avgLabel">
Ø 7 Tage
</div>

<div
class="avgValue"
id="avgHRV"
>
--
</div>

<div
class="trend"
id="trendText"
>
Noch kein Trend
</div>

</div>

</div>

<button
class="smallBtn"
onclick="toggleHRVEdit()"
>
HRV eintragen
</button>

<div
class="hrvEdit"
id="hrvEdit"
>

<input
type="number"
class="hrvInput"
id="hrvInput"
placeholder="z.B. 41"
>

<button
class="saveBtn"
onclick="saveHRV()"
>
Speichern
</button>

</div>

</div>

<!-- MAIN -->

<div class="mainCard">

<div class="sectionLabel">
Wie ist es gerade?
</div>

<button
class="state green"
onclick="openTraining('green')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
🙂
</div>

<div>

<div class="stateTitle">
Stabil
</div>

<div class="stateDesc">
Ruhig und belastbar.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="state yellow"
onclick="openTraining('yellow')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
😕
</div>

<div>

<div class="stateTitle">
Kippt leicht
</div>

<div class="stateDesc">
Erste Überlastung.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="state red"
onclick="openTraining('red')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
😣
</div>

<div>

<div class="stateTitle">
Kippt
</div>

<div class="stateDesc">
Überreizt oder erschöpft.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<!-- PANEL -->

<div
class="trainingPanel"
id="trainingPanel"
>

<div
class="trainingTitle"
id="trainingTitle"
>
Training
</div>

<div
class="trainingText"
id="trainingText"
>
</div>

<div
class="trainingList"
id="trainingList"
>
</div>

<div
class="warning"
id="warningBox"
style="display:none"
>
</div>

<button
class="startBtn"
id="startBtn"
>
Training starten
</button>

<button
class="backBtn"
onclick="closeTraining()"
>
Schließen
</button>

</div>

</div>

</div>

<!-- OVERLAY -->

<div
class="overlay"
id="overlay"
>

<div
class="circle"
id="circle"
></div>

<div
class="phase"
id="phase"
>
Vorbereitung
</div>

<div
class="timer"
id="timer"
>
60
</div>

<div
class="info"
id="info"
>
Ruhig werden.
</div>

<button
class="stopBtn"
onclick="stopTraining()"
>
Abbrechen
</button>

</div>

<script>

/* STORAGE */

let hrvData =
JSON.parse(
localStorage.getItem("vb_hrv")
) || [];

/* AUDIO */

let audioReady = false;

function unlockAudio(){

if(audioReady) return;

audioReady = true;

speechSynthesis.speak(
new SpeechSynthesisUtterance(" ")
);
}

function speak(text){

if(!audioReady) return;

speechSynthesis.cancel();

let msg =
new SpeechSynthesisUtterance(text);

msg.lang = "de-DE"
msg.rate = .92;

speechSynthesis.speak(msg);
}

/* HRV */

function toggleHRVEdit(){

document
.getElementById("hrvEdit")
.classList.toggle("open");
}

function saveHRV(){

let val =
parseInt(
document.getElementById("hrvInput").value
);

if(!val) return;

hrvData.push({
value:val,
time:Date.now()
});

hrvData = hrvData.slice(-30);

localStorage.setItem(
"vb_hrv",
JSON.stringify(hrvData)
);

updateHRV();

document.getElementById(
"hrvInput"
).value = ""

toggleHRVEdit();
}

function updateHRV(){

if(hrvData.length === 0) return;

let today =
hrvData[hrvData.length - 1].value;

let recent =
hrvData.slice(-7);

let avg =
Math.round(

recent.reduce(
(a,b)=>a+b.value,
0
) / recent.length

);

document.getElementById(
"todayHRV"
).innerText = today;

document.getElementById(
"avgHRV"
).innerText = avg;

let status =
document.getElementById(
"hrvStatus"
);

if(today >= 45){

status.innerText =
"Nervensystem heute eher stabil."

}else if(today >= 30){

status.innerText =
"Heute moderate Belastbarkeit."

}else{

status.innerText =
"Heute vorsichtiger bleiben."
}

/* TREND */

let trend =
document.getElementById(
"trendText"
);

if(hrvData.length >= 4){

let last =
hrvData[hrvData.length-1].value;

let older =
hrvData[hrvData.length-4].value;

if(last > older){

trend.innerText =
"↗ HRV steigt"

}else if(last < older){

trend.innerText =
"↘ HRV sinkt"

}else{

trend.innerText =
"→ stabil"
}
}
}

/* PANEL */

function openTraining(type){

unlockAudio();

let panel =
document.getElementById(
"trainingPanel"
);

panel.classList.add("open");

let title =
document.getElementById(
"trainingTitle"
);

let text =
document.getElementById(
"trainingText"
);

let list =
document.getElementById(
"trainingList"
);

let btn =
document.getElementById(
"startBtn"
);

let warn =
document.getElementById(
"warningBox"
);

warn.style.display = "none"

let today =
hrvData.length
? hrvData[hrvData.length-1].value
: null;

/* GREEN */

if(type === "green"){

title.innerText =
"HRV Aufbau"

text.innerText =
"Längeres Ausatmen und ruhiges Summen trainieren vagale Regulation."

list.innerHTML = `
<div>• 4 Sek. einatmen</div>
<div>• 6 Sek. ausatmen</div>
<div>• später Summen</div>
<div>• Dauer: 5 Minuten</div>
`;

if(today && today < 30){

warn.style.display = "block"

warn.innerText =
"HRV aktuell niedrig. Heute ruhig und ohne Leistungsdruck trainieren."
}

btn.onclick =
()=>startTraining("green");
}

/* YELLOW */

if(type === "yellow"){

title.innerText =
"Stabilisierung"

text.innerText =
"Nervensystem früh beruhigen bevor Stress stärker wird."

list.innerHTML = `
<div>• langsames Ausatmen</div>
<div>• Schultern sinken lassen</div>
<div>• ruhiger Blick</div>
<div>• Dauer: 1 Minute</div>
`;

btn.onclick =
()=>startTraining("yellow");
}

/* RED */

if(type === "red"){

title.innerText =
"Akute Beruhigung"

text.innerText =
"Körperreize helfen oft besser als intensive Atemübungen."

list.innerHTML = `
<div>• Brustbein klopfen</div>
<div>• langsames Ausatmen</div>
<div>• Summen</div>
<div>• Dauer: 45 Sekunden</div>
`;

btn.onclick =
()=>startTraining("red");
}
}

function closeTraining(){

document
.getElementById("trainingPanel")
.classList.remove("open");
}

/* OVERLAY */

let interval = null;

function startTraining(type){

openOverlay();

if(type === "green"){
startGreen();
}

if(type === "yellow"){
startYellow();
}

if(type === "red"){
startRed();
}
}

function openOverlay(){

document
.getElementById("overlay")
.style.display = "flex"
}

function closeOverlay(){

document
.getElementById("overlay")
.style.display = "none"
}

function setPhase(t){

document
.getElementById("phase")
.innerText = t;
}

function setInfo(t){

document
.getElementById("info")
.innerText = t;
}

function setTimer(t){

document
.getElementById("timer")
.innerText = t;
}

function pulseIn(){

document
.getElementById("circle")
.classList.add("expand");
}

function pulseOut(){

document
.getElementById("circle")
.classList.remove("expand");
}

function stopTraining(){

clearInterval(interval);

speechSynthesis.cancel();

closeOverlay();
}

/* GREEN */

function startGreen(){

let today =
hrvData.length
? hrvData[hrvData.length-1].value
: 40;

let duration =
today < 30 ? 180 : 300;

let cycle = 0;
let t = duration;

setInfo(
"Ruhige Atmung trainiert den Vagus langfristig."
);

speak(
"Wir beginnen ruhig."
);

interval = setInterval(()=>{

t--;
cycle++;

setTimer(
formatTime(t)
);

if(cycle % 10 < 4){

setPhase("Einatmen");

pulseIn();

if(cycle % 10 === 1){

speak("Ein");
}

}else{

setPhase("Ausatmen");

pulseOut();

if(cycle % 10 === 4){

speak("Aus");
}
}

if(t < duration / 2){

setPhase(
"Summen beim Ausatmen"
);

if(cycle % 10 === 4){

speak("Voooo");
}
}

if(t <= 0){

finishTraining(
"Training abgeschlossen."
);
}

},1000);
}

/* YELLOW */

function startYellow(){

let t = 60;
let cycle = 0;

setInfo(
"Früh beruhigen bevor Überlastung stärker wird."
);

speak(
"Schultern locker lassen."
);

interval = setInterval(()=>{

t--;
cycle++;

setTimer(t);

if(cycle % 10 < 4){

setPhase("Einatmen");

pulseIn();

}else{

setPhase("Lang ausatmen");

pulseOut();
}

if(t <= 0){

finishTraining(
"Etwas ruhiger."
);
}

},1000);
}

/* RED */

function startRed(){

let t = 45;

setInfo(
"Körperreize helfen oft schneller als starke Atemübungen."
);

setPhase(
"Brustbein klopfen"
);

speak(
"Klopfe jetzt sanft auf dein Brustbein."
);

interval = setInterval(()=>{

t--;

setTimer(t);

if(t === 25){

setPhase(
"Lang ausatmen"
);

speak(
"Langsam ausatmen."
);
}

if(t === 12){

setPhase(
"Summen"
);

speak("Voooo");
}

if(t <= 0){

finishTraining(
"Akute Überlastung reduziert."
);
}

},1000);
}

/* FINISH */

function finishTraining(text){

clearInterval(interval);

setPhase("Fertig");

setInfo(text);

speak("Fertig.");

setTimeout(()=>{

closeOverlay();

},2200);
}

/* HELPER */

function formatTime(sec){

let m =
Math.floor(sec / 60);

let s =
sec % 60;

return `${m}:${s
.toString()
.padStart(2,"0")}`;
}

/* INIT */

updateHRV();

</script>

</body>
</html>
