<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>VagusBuk 7.5.2.2</title>

<style>

/* =========================================================
BASIS
========================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
overflow-x:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#020912;
color:white;
}

body{
background:
radial-gradient(circle at top, rgba(60,120,200,.25), transparent 35%),
linear-gradient(180deg,#06111c,#020912);
min-height:100vh;
}

.app{
max-width:520px;
margin:0 auto;
padding:18px 14px 120px;
}

/* =========================================================
HEADER
========================================================= */

.logo{
font-size:40px;
font-weight:900;
letter-spacing:-2px;
}

.subtitle{
color:#8aa0b5;
margin-top:6px;
}

/* =========================================================
CARDS
========================================================= */

.card{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
border-radius:22px;
padding:16px;
margin-top:12px;
backdrop-filter:blur(16px);
}

/* =========================================================
HERO
========================================================= */

.heroTitle{
font-size:30px;
font-weight:900;
margin-top:10px;
}

.heroText{
color:#cfe0f0;
margin-top:8px;
}

.heroBadge{
display:inline-block;
padding:6px 12px;
border-radius:999px;
font-size:12px;
background:rgba(255,255,255,.08);
margin-bottom:8px;
}

/* =========================================================
KPI
========================================================= */

.kpiGrid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
}

.kpi{
background:rgba(255,255,255,.03);
padding:12px;
border-radius:16px;
text-align:center;
}

.kpiValue{
font-size:28px;
font-weight:900;
}

.kpiLabel{
font-size:10px;
color:#9ab0c5;
margin-top:4px;
}

/* =========================================================
INPUT
========================================================= */

.inputRow{
display:flex;
gap:10px;
}

input{
flex:1;
height:52px;
border-radius:14px;
border:none;
padding:0 12px;
font-size:20px;
font-weight:800;
background:#0b1a28;
color:white;
}

button{
border:none;
border-radius:14px;
padding:0 16px;
font-weight:800;
cursor:pointer;
}

.saveBtn{
background:#3bd16f;
color:black;
}

/* =========================================================
CHART
========================================================= */

.chart{
display:flex;
gap:8px;
align-items:flex-end;
height:120px;
}

.bar{
flex:1;
background:linear-gradient(180deg,#6ef08f,#2c8c4a);
border-radius:10px 10px 4px 4px;
}

/* =========================================================
BOTTOM
========================================================= */

.bottomBar{
position:fixed;
bottom:0;
left:0;
right:0;
padding:10px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(20px);
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
}

.bottomBar button{
height:54px;
font-weight:900;
border-radius:14px;
}

.train{background:#34d46c;}
.rec{background:#4a7bdc;}
.sos{background:#d44a4a;}

/* =========================================================
MODES
========================================================= */

.mode{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:#050b12;
}

.mode.active{display:flex;}

.ball{
width:90px;
height:90px;
border-radius:50%;
background:radial-gradient(circle,#bff,#39f);
transition:transform .3s ease;
margin:20px 0;
}

.timer{
font-size:40px;
font-weight:900;
}

</style>
</head>

<body>

<div class="app">

<div class="logo">VagusBuk</div>
<div class="subtitle">HRV & Regulation</div>

<div class="card">

<div class="heroBadge" id="badge">Status</div>

<div class="heroTitle" id="title">Noch keine Daten</div>
<div class="heroText" id="text">HRV eintragen</div>

</div>

<div class="card">

<div class="kpiGrid">
<div class="kpi">
<div class="kpiValue" id="hrv">--</div>
<div class="kpiLabel">Heute</div>
</div>

<div class="kpi">
<div class="kpiValue" id="avg">--</div>
<div class="kpiLabel">Ø 7 Tage</div>
</div>

<div class="kpi">
<div class="kpiValue" id="state">🧠</div>
<div class="kpiLabel">Zustand</div>
</div>
</div>

</div>

<div class="card">

<div class="inputRow">
<input id="input" type="number" placeholder="HRV">
<button class="saveBtn" onclick="save()">Save</button>
</div>

</div>

<div class="card">
<div class="chart" id="chart"></div>
</div>

</div>

<!-- MODES -->

<div class="mode" id="training">
<div class="timer" id="t1">0:00</div>
<div class="ball" id="b1"></div>
</div>

<div class="mode" id="recovery">
<div class="timer" id="t2">0:00</div>
<div class="ball" id="b2"></div>
</div>

<div class="mode" id="sos">
<div class="timer" id="t3">0:00</div>
<div class="ball" id="b3"></div>
</div>

<div class="bottomBar">

<button class="train" onclick="start('training')">Training</button>
<button class="rec" onclick="start('recovery')">Recovery</button>
<button class="sos" onclick="start('sos')">SOS</button>

</div>

<script>

let data = JSON.parse(localStorage.getItem("hrv")||"[]");

function save(){

const v = +document.getElementById("input").value;
if(!v) return;

const today = new Date().toISOString().slice(0,10);

const i = data.findIndex(d=>d.day===today);

if(i>-1) data[i].value=v;
else data.push({day:today,value:v});

localStorage.setItem("hrv",JSON.stringify(data));

render();
}

function avg(){
const last = data.slice(-7);
if(!last.length) return 0;
return Math.round(last.reduce((a,b)=>a+b.value,0)/last.length);
}

function render(){

const last = data.at(-1)?.value ?? null;

document.getElementById("hrv").innerText = last ?? "--"
document.getElementById("avg").innerText = avg();

let state="Stabil"

if(last && last < avg()*0.9) state="Belastet"
else if(last && last < avg()*1.05) state="Vorsichtig"

document.getElementById("state").innerText =
state==="Stabil"?"✓":"⚠"

document.getElementById("title").innerText = state;
document.getElementById("text").innerText =
state==="Belastet"
?"Reize reduzieren"
:"Normal arbeiten"

const chart = document.getElementById("chart");
chart.innerHTML=""

data.slice(-7).forEach(d=>{
const bar = document.createElement("div");
bar.className="bar"
bar.style.height = (d.value*1.5)+"px"
chart.appendChild(bar);
});
}

function start(mode){

document.getElementById(mode).classList.add("active");

let sec = 180;

const timer = document.getElementById(
mode==="training"?"t1":mode==="recovery"?"t2":"t3"
);

const ball = document.getElementById(
mode==="training"?"b1":mode==="recovery"?"b2":"b3"
);

let scale = 1;

setInterval(()=>{
sec--;
timer.innerText =
Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");

scale = scale===1?1.3:1;
ball.style.transform="scale("+scale+")"

if(sec<=0) location.reload();

},1000);
}

render();

</script>

</body>
</html>
