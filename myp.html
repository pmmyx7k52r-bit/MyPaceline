<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>VagusBuk 6.2.1</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
overflow-x:hidden;
background:#020b14;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:white;
}

body{
background:
radial-gradient(circle at top,#0c3157 0%,#031221 45%,#020b14 100%);
}

.app{
width:100%;
max-width:560px;
margin:0 auto;
padding:24px 16px 120px;
}

.hero{
margin-top:10px;
margin-bottom:24px;
}

.logoWave{
text-align:center;
font-size:34px;
opacity:.45;
margin-bottom:6px;
}

.logo{
font-size:58px;
font-weight:900;
letter-spacing:-3px;
line-height:.9;
}

.subtitle{
margin-top:12px;
font-size:20px;
line-height:1.4;
color:#9fb0c3;
}

.card{
background:
linear-gradient(
180deg,
rgba(9,23,38,.94),
rgba(4,14,26,.96)
);

border:
1px solid rgba(255,255,255,.06);

border-radius:30px;

padding:22px;

margin-bottom:18px;

box-shadow:
0 10px 40px rgba(0,0,0,.3);

overflow:hidden;
}

.sectionTitle{
font-size:14px;
letter-spacing:2px;
text-transform:uppercase;
color:#8fa4b7;
margin-bottom:18px;
}

/* =========================================================
HRV
========================================================= */

.hrvTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:18px;
}

.hrvBig{
font-size:82px;
font-weight:900;
line-height:.9;
}

.hrvAverage{
text-align:right;
color:#91a4b7;
}

.hrvAverage span{
display:block;
font-size:40px;
font-weight:900;
margin-top:6px;
color:white;
}

.hrvInfo{
margin-top:14px;
font-size:24px;
line-height:1.4;
}

.inputRow{
margin-top:24px;
display:flex;
gap:12px;
}

.hrvInput{
flex:1;
height:60px;
border-radius:20px;
border:2px solid rgba(48,108,176,.7);
background:#041524;
padding:0 20px;
font-size:32px;
color:white;
outline:none;
}

.hrvInput::placeholder{
color:#6d8297;
}

.saveBtn{
height:60px;
padding:0 24px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:800;
color:white;

background:
linear-gradient(
135deg,
#39cf67,
#238b43
);
}

/* =========================================================
CHART
========================================================= */

.chart{
margin-top:28px;
display:flex;
align-items:flex-end;
gap:10px;
height:180px;
}

.barWrap{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-end;
height:100%;
}

.barValue{
font-size:14px;
margin-bottom:8px;
color:#dbe5ef;
}

.bar{
width:100%;
border-radius:18px 18px 8px 8px;

background:
linear-gradient(
180deg,
#52e174,
#249144
);
}

.barDay{
margin-top:8px;
font-size:12px;
color:#7d92a7;
}

/* =========================================================
HEUTE
========================================================= */

.todayBadge{
display:inline-flex;
align-items:center;
justify-content:center;
padding:0 14px;
height:34px;
border-radius:999px;
font-size:13px;
font-weight:700;
margin-bottom:16px;
background:rgba(255,255,255,.08);
}

.todayState{
font-size:42px;
font-weight:900;
line-height:1;
letter-spacing:-2px;
}

.todayText{
margin-top:14px;
font-size:22px;
line-height:1.4;
color:#dce6ef;
}

.infoBox{
margin-top:18px;
padding:18px;
border-radius:22px;
background:rgba(255,255,255,.04);
}

.infoTitle{
font-size:13px;
letter-spacing:1px;
text-transform:uppercase;
color:#9fb2c5;
margin-bottom:10px;
}

.infoContent{
font-size:17px;
line-height:1.7;
color:#edf4fa;
}

.warningBox{
margin-top:16px;
padding:18px;
border-radius:22px;

background:
rgba(180,60,60,.08);

border:
1px solid rgba(255,120,120,.12);
}

.warningTitle{
font-size:13px;
letter-spacing:1px;
text-transform:uppercase;
color:#ffbcbc;
margin-bottom:10px;
}

.warningContent{
font-size:17px;
line-height:1.7;
color:#ffdede;
}

.trainingBox{
margin-top:20px;
padding:20px;
border-radius:24px;

background:
linear-gradient(
135deg,
rgba(40,108,176,.18),
rgba(24,67,110,.12)
);

border:
1px solid rgba(85,145,220,.14);
}

.trainingLabel{
font-size:13px;
letter-spacing:1px;
text-transform:uppercase;
color:#9eb1c3;
}

.trainingDuration{
margin-top:8px;
font-size:30px;
font-weight:900;
}

.startBtn{
width:100%;
height:60px;
margin-top:18px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:800;
color:white;

background:
linear-gradient(
135deg,
#39cf67,
#238b43
);
}

/* =========================================================
OVERLAY
========================================================= */

.overlay{
position:fixed;
inset:0;
z-index:999;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
padding:24px;

background:
radial-gradient(
circle at center,
#0c3157,
#020b14
);
}

.backBtn{
position:absolute;
top:54px;
left:20px;

height:48px;
padding:0 18px;

border:none;
border-radius:16px;

background:
rgba(255,255,255,.08);

color:white;

font-size:16px;
font-weight:700;
}

.overlayTitle{
font-size:34px;
font-weight:900;
margin-bottom:16px;
}

.breathText{
font-size:28px;
margin-bottom:34px;
color:#dce6ef;
}

.ball{
width:90px;
height:90px;
border-radius:50%;

background:
radial-gradient(
circle at 30% 30%,
#84f9ff,
#2fa0ff
);

box-shadow:
0 0 60px rgba(86,196,255,.6);

transition:
transform 4s linear;
}

.timer{
margin-top:42px;
font-size:52px;
font-weight:900;
}

/* =========================================================
RESPONSIVE
========================================================= */

@media(max-width:560px){

.logo{
font-size:54px;
}

.subtitle{
font-size:18px;
}

.hrvBig{
font-size:72px;
}

.todayState{
font-size:34px;
}

.todayText{
font-size:20px;
}

.inputRow{
flex-direction:column;
}

.saveBtn{
width:100%;
}
}

</style>
</head>

<body>

<div class="app">

<div class="hero">

<div class="logoWave">
〰〰
</div>

<div class="logo">
VagusBuk
</div>

<div class="subtitle">
Adaptive HRV- & Nervensystem-Regulation
</div>

</div>

<!-- =========================================================
HRV
========================================================= -->

<div class="card">

<div class="sectionTitle">
HRV heute
</div>

<div class="hrvTop">

<div>

<div class="hrvBig" id="hrvBig">
--
</div>

<div class="hrvInfo" id="hrvInfo">
Noch keine Daten.
</div>

</div>

<div class="hrvAverage">
Ø 7 Tage
<span id="avgValue">
--
</span>
</div>

</div>

<div class="inputRow">

<input
type="number"
inputmode="numeric"
placeholder="z.B. 41"
id="hrvInput"
class="hrvInput"
>

<button
class="saveBtn"
onclick="saveHRV()"
>
Speichern
</button>

</div>

<div class="chart" id="chart"></div>

</div>

<!-- =========================================================
HEUTE
========================================================= -->

<div class="card">

<div class="sectionTitle">
Heute
</div>

<div
class="todayBadge"
id="todayBadge"
>
Analyse
</div>

<div
class="todayState"
id="todayState"
>
Noch keine Daten
</div>

<div
class="todayText"
id="todayText"
>
Bitte HRV eintragen.
</div>

<div class="infoBox">

<div class="infoTitle">
Heute sinnvoll
</div>

<div
class="infoContent"
id="planContent"
>
–
</div>

</div>

<div class="warningBox">

<div class="warningTitle">
Heute vermeiden
</div>

<div
class="warningContent"
id="avoidContent"
>
–
</div>

</div>

<div class="trainingBox">

<div class="trainingLabel">
Empfohlenes Training
</div>

<div
class="trainingDuration"
id="trainingDuration"
>
–
</div>

<button
class="startBtn"
id="startBtn"
onclick="startRecommendedTraining()"
>
Training starten
</button>

</div>

</div>

</div>

<!-- =========================================================
OVERLAY
========================================================= -->

<div
class="overlay"
id="overlay"
>

<button
class="backBtn"
onclick="stopTraining()"
>
Zurück
</button>

<div class="overlayTitle">
Vagus-Training
</div>

<div
class="breathText"
id="breathText"
>
Einatmen
</div>

<div
class="ball"
id="ball"
></div>

<div
class="timer"
id="timer"
>
0:00
</div>

</div>

<script>

/* =========================================================
DATEN LADEN
========================================================= */

let hrvData = [];

function loadExistingHRVData(){

const possibleKeys = [

"vagusbuk_hrv",
"hrvData",
"hrv_values",
"vagus_hrv",
"vagusbukData",
"vagusbukHRV",
"vagusbuk_hrv_values"

];

for(const key of possibleKeys){

try{

const raw =
localStorage.getItem(key);

if(!raw){
continue;
}

const parsed =
JSON.parse(raw);

if(
Array.isArray(parsed)
&&
parsed.length > 0
){

if(
typeof parsed[0] === "object"
&&
parsed[0].value !== undefined
){

hrvData = parsed;
break;
}

if(
typeof parsed[0] === "number"
){

hrvData =
parsed.map(v=>({
value:v,
date:Date.now()
}));

break;
}
}

}catch(e){}
}

if(hrvData.length){

localStorage.setItem(
"vagusbuk_hrv",
JSON.stringify(hrvData)
);
}
}

loadExistingHRVData();

/* =========================================================
GLOBAL
========================================================= */

let recommendedTraining = 180;

let trainingInterval;
let breathingInterval;

/* =========================================================
SAVE
========================================================= */

function saveHRV(){

const input =
document.getElementById("hrvInput");

const value =
parseInt(input.value);

if(
isNaN(value)
||
value <= 0
){
return;
}

hrvData.push({
value:value,
date:Date.now()
});

if(hrvData.length > 7){
hrvData.shift();
}

localStorage.setItem(
"vagusbuk_hrv",
JSON.stringify(hrvData)
);

input.value = ""

renderAll();
}

/* =========================================================
RENDER
========================================================= */

function renderAll(){

updateHRV();

updateToday();

renderChart();
}

/* =========================================================
HRV
========================================================= */

function updateHRV(){

const big =
document.getElementById("hrvBig");

const info =
document.getElementById("hrvInfo");

const avg =
document.getElementById("avgValue");

if(hrvData.length === 0){

big.innerText = "--"

info.innerText =
"Noch keine Daten."

avg.innerText = "--"

return;
}

const latest =
hrvData[
hrvData.length - 1
].value;

big.innerText = latest;

const average =
Math.round(
hrvData.reduce(
(a,b)=>a+b.value,
0
) / hrvData.length
);

avg.innerText = average;

if(latest < 25){

info.innerText =
"Heute vorsichtiger bleiben."

}else if(latest < 40){

info.innerText =
"Sanfter Aufbau sinnvoll."

}else{

info.innerText =
"Gute vagale Stabilität."
}
}

/* =========================================================
TODAY
========================================================= */

function updateToday(){

const latest =
hrvData.length
?
hrvData[
hrvData.length - 1
].value
:
null;

const badge =
document.getElementById("todayBadge");

const state =
document.getElementById("todayState");

const text =
document.getElementById("todayText");

const plan =
document.getElementById("planContent");

const avoid =
document.getElementById("avoidContent");

const duration =
document.getElementById("trainingDuration");

const btn =
document.getElementById("startBtn");

if(latest === null){

badge.innerText =
"Keine Daten"

state.innerText =
"Noch keine Daten"

text.innerText =
"Bitte HRV eintragen."

plan.innerHTML =
"• Basisdaten sammeln"

avoid.innerHTML =
"• keine Einschätzung möglich"

duration.innerText =
"2 Minuten ruhige Atmung"

recommendedTraining = 120;

return;
}

if(latest < 25){

badge.innerText =
"Empfindlich"

badge.style.background =
"rgba(180,60,60,.24)"

state.innerText =
"⚠ Nervensystem überlastet"

text.innerText =
"Heute Stabilisierung statt Aufbau."

plan.innerHTML = `
• langsame Atmung<br>
• Reize reduzieren<br>
• Summen möglich<br>
• Brustbein-Klopfen
`;

avoid.innerHTML = `
• intensive Belastung<br>
• emotionale Überreizung<br>
• lange Sessions
`;

duration.innerText =
"1–2 Minuten Regulation"

btn.innerText =
"Beruhigung starten"

recommendedTraining = 90;

return;
}

if(latest < 40){

badge.innerText =
"Vorsichtig"

badge.style.background =
"rgba(173,129,27,.24)"

state.innerText =
"⚠ mittlere Belastbarkeit"

text.innerText =
"Sanfter Aufbau sinnvoll."

plan.innerHTML = `
• ruhige Atmung<br>
• langsamer Rhythmus<br>
• kurze Regulation<br>
• optional Summen
`;

avoid.innerHTML = `
• Überforderung<br>
• schnelle Atemmuster<br>
• zu lange Sessions
`;

duration.innerText =
"3 Minuten vagales Training"

btn.innerText =
"Sanft starten"

recommendedTraining = 180;

return;
}

badge.innerText =
"Stabil"

badge.style.background =
"rgba(47,157,81,.24)"

state.innerText =
"✓ gute vagale Stabilität"

text.innerText =
"Heute eignet sich Aufbau-Training."

plan.innerHTML = `
• längere Regulation<br>
• vagale Aktivierung<br>
• langsame tiefe Atmung<br>
• Summen möglich
`;

avoid.innerHTML = `
• hektische Überlastung<br>
• zu spätes Training
`;

duration.innerText =
"5 Minuten Aufbau-Training"

btn.innerText =
"Training starten"

recommendedTraining = 300;
}

/* =========================================================
CHART
========================================================= */

function renderChart(){

const chart =
document.getElementById("chart");

chart.innerHTML = ""

hrvData.forEach((item,index)=>{

const wrap =
document.createElement("div");

wrap.className =
"barWrap"

const value =
document.createElement("div");

value.className =
"barValue"

value.innerText =
item.value;

const bar =
document.createElement("div");

bar.className =
"bar"

bar.style.height =
Math.max(
28,
item.value * 2
) + "px"

const day =
document.createElement("div");

day.className =
"barDay"

day.innerText =
index + 1;

wrap.appendChild(value);

wrap.appendChild(bar);

wrap.appendChild(day);

chart.appendChild(wrap);
});
}

/* =========================================================
TRAINING
========================================================= */

function startRecommendedTraining(){

startTraining(
recommendedTraining
);
}

function startTraining(seconds){

const overlay =
document.getElementById("overlay");

overlay.style.display =
"flex"

let remaining =
seconds;

updateTimer(remaining);

const ball =
document.getElementById("ball");

const text =
document.getElementById("breathText");

let inhale = true;

function breathe(){

if(inhale){

text.innerText =
"Einatmen"

ball.style.transform =
"scale(1.8)"

}else{

text.innerText =
"Ausatmen"

ball.style.transform =
"scale(.7)"
}

inhale = !inhale;
}

breathe();

breathingInterval =
setInterval(
breathe,
4000
);

trainingInterval =
setInterval(()=>{

remaining--;

updateTimer(remaining);

if(remaining <= 0){

stopTraining();
}

},1000);
}

function updateTimer(sec){

const min =
Math.floor(sec / 60);

const s =
sec % 60;

document.getElementById(
"timer"
).innerText =
`${min}:${String(s).padStart(2,"0")}`;
}

function stopTraining(){

clearInterval(
trainingInterval
);

clearInterval(
breathingInterval
);

document.getElementById(
"overlay"
).style.display =
"none"
}

/* =========================================================
INIT
========================================================= */

renderAll();

</script>

</body>
</html>
