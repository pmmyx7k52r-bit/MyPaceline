<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk 3.6</title>

<style>
body {
margin:0;
font-family:-apple-system,sans-serif;
background:#0b0f14;
color:#e8eef2;
text-align:center;
}

.container { padding:20px; }

button {
width:90%;
max-width:420px;
margin:10px;
padding:16px;
font-size:16px;
border-radius:12px;
border:none;
color:white;
}

.green { background:#2b4a3a; }
.yellow { background:#5a4a2b; }
.gray { background:#333; }
.blue { background:#2b3f5a; }

.card {
background:#15202b;
padding:16px;
margin-top:16px;
border-radius:12px;
}

.timer {
font-size:40px;
margin-top:15px;
}

.phase {
font-size:20px;
margin-top:10px;
}

.hidden { display:none; }
</style>
</head>

<body>

<h1>VagusBuk 3.6</h1>

<div class="container">

<button class="green" onclick="startBreath()">
Beruhigen (Atmung)
</button>

<button class="yellow" onclick="startRelease()">
Spannung lösen (Körper)
</button>

<button class="gray" onclick="startSafe()">
Stabilisieren (Ruhe)
</button>

<button class="blue" onclick="startFocus()">
Fokus zurückholen
</button>

<div id="timer" class="timer hidden"></div>
<div id="phase" class="phase hidden"></div>

</div>

<script>

let timer = null;
let timeLeft = 0;

// ----------------------------
// VOICE
// ----------------------------
function speak(text) {
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "de-DE"
speechSynthesis.speak(msg);
}

// ----------------------------
// RESET
// ----------------------------
function resetUI() {
clearInterval(timer);
document.getElementById("timer").classList.remove("hidden");
document.getElementById("phase").classList.remove("hidden");
}

// ----------------------------
// 1. BERUHIGEN (ATMUNG)
// ----------------------------
function startBreath() {

resetUI();
timeLeft = 60;

speak("Vier ein. Sechs aus.");

timer = setInterval(() => {

timeLeft--;
document.getElementById("timer").innerText = timeLeft;

let cycle = timeLeft % 10;

if (cycle < 4) {
document.getElementById("phase").innerText = "Einatmen"
} else {
document.getElementById("phase").innerText = "Ausatmen"
}

if (timeLeft <= 0) finish();

}, 1000);
}

// ----------------------------
// 2. SPANNUNG LÖSEN
// ----------------------------
function startRelease() {

resetUI();
timeLeft = 20;

speak("Schultern hochziehen... halten... und loslassen.");

timer = setInterval(() => {

timeLeft--;
document.getElementById("timer").innerText = timeLeft;

document.getElementById("phase").innerText = "Spannung lösen"

if (timeLeft <= 0) finish();

}, 1000);
}

// ----------------------------
// 3. STABILISIEREN
// ----------------------------
function startSafe() {

resetUI();
timeLeft = 30;

speak("Lege eine Hand auf deine Brust.");

timer = setInterval(() => {

timeLeft--;
document.getElementById("timer").innerText = timeLeft;

document.getElementById("phase").innerText =
"Nichts tun. Nur spüren."

if (timeLeft <= 0) finish();

}, 1000);
}

// ----------------------------
// 4. FOKUS
// ----------------------------
function startFocus() {

resetUI();
timeLeft = 30;

speak("Schau langsam nach links und rechts.");

timer = setInterval(() => {

timeLeft--;
document.getElementById("timer").innerText = timeLeft;

document.getElementById("phase").innerText =
"Augen bewegen"

if (timeLeft <= 0) finish();

}, 1000);
}

// ----------------------------
// FINISH
// ----------------------------
function finish() {

clearInterval(timer);

document.getElementById("phase").innerText = "Fertig"

speak("Fertig.");
}

</script>

</body>
</html>
