<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>VagusBuk 7.3.1.1</title>

<style>

/* =========================================================
RESET
========================================================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
overflow-x:hidden;
background:#020b14;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:white;
}

body{
background:
radial-gradient(circle at top,
#10355b 0%,
#051321 45%,
#020b14 100%);
}

/* =========================================================
APP
========================================================= */
.app{
width:100%;
max-width:560px;
margin:0 auto;
padding:20px 16px 120px;
}

/* =========================================================
HEADER
========================================================= */
.hero{
margin-bottom:24px;
}

.logoWave{
text-align:center;
opacity:.4;
font-size:28px;
margin-bottom:6px;
}

.logo{
font-size:54px;
font-weight:900;
letter-spacing:-3px;
line-height:.9;
}

.subtitle{
margin-top:12px;
font-size:19px;
line-height:1.5;
color:#9eb2c5;
}

/* =========================================================
CARD
========================================================= */
.card{
background:
linear-gradient(
180deg,
rgba(9,21,37,.96),
rgba(4,13,23,.97)
);

border:1px solid rgba(255,255,255,.06);

border-radius:28px;
padding:22px;
margin-bottom:18px;

box-shadow:
0 10px 40px rgba(0,0,0,.28);
}

.sectionTitle{
font-size:13px;
letter-spacing:2px;
text-transform:uppercase;
color:#8ea4b8;
margin-bottom:18px;
}

/* =========================================================
HRV
========================================================= */
.hrvTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:18px;
}

.hrvValue{
font-size:82px;
font-weight:900;
line-height:.9;
}

.hrvInfo{
margin-top:14px;
font-size:22px;
line-height:1.4;
color:#dce5ef;
}

.hrvAverage{
text-align:right;
color:#8ea4b8;
}

.hrvAverage span{
display:block;
font-size:38px;
font-weight:900;
margin-top:6px;
color:white;
}

.inputRow{
display:flex;
gap:12px;
margin-top:22px;
}

.hrvInput{
flex:1;
height:58px;
border:none;
outline:none;
border-radius:18px;

background:#071828;

padding:0 18px;

font-size:30px;
font-weight:700;

color:white;

border:2px solid rgba(73,127,189,.45);
}

.hrvInput::placeholder{
color:#72859b;
}

.saveBtn{
height:58px;
padding:0 22px;

border:none;
border-radius:18px;

font-size:18px;
font-weight:800;

color:white;

background:
linear-gradient(
135deg,
#3cd56b,
#228941
);

cursor:pointer;
}

/* =========================================================
CHART
========================================================= */
.chart{
height:180px;
margin-top:26px;

display:flex;
align-items:flex-end;
gap:10px;
}

.barWrap{
flex:1;

display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-end;

height:100%;
}

.barValue{
font-size:13px;
margin-bottom:8px;
color:#e1e8ef;
}

.bar{
width:100%;

border-radius:16px 16px 8px 8px;

background:
linear-gradient(
180deg,
#5ae57d,
#278f45
);
}

.barLabel{
margin-top:8px;
font-size:11px;
color:#7f93a6;
}

/* =========================================================
STATUS
========================================================= */
.statusBadge{
display:inline-flex;
align-items:center;
justify-content:center;

height:34px;
padding:0 14px;

border-radius:999px;

font-size:13px;
font-weight:700;

background:rgba(255,255,255,.08);

margin-bottom:16px;
}

.statusTitle{
font-size:38px;
font-weight:900;
line-height:1.1;
letter-spacing:-2px;
}

.statusText{
margin-top:14px;
font-size:21px;
line-height:1.5;
color:#dce5ef;
}

.infoBox{
margin-top:18px;
padding:18px;

border-radius:22px;

background:rgba(255,255,255,.04);
}

.infoLabel{
font-size:12px;
letter-spacing:1px;
text-transform:uppercase;
color:#97adc1;
margin-bottom:10px;
}

.infoText{
font-size:17px;
line-height:1.7;
color:#eef4fa;
}

/* =========================================================
BUTTONS
========================================================= */
.actionButtons{
display:flex;
flex-direction:column;
gap:14px;
margin-top:24px;
}

.primaryBtn,
.recoveryBtn,
.sosBtn{
width:100%;
height:60px;

border:none;
border-radius:20px;

font-size:20px;
font-weight:800;

color:white;

cursor:pointer;
}

.primaryBtn{
background:
linear-gradient(
135deg,
#39d067,
#228941
);
}

.recoveryBtn{
background:
linear-gradient(
135deg,
#4d83d7,
#2f5290
);
}

.sosBtn{
background:
linear-gradient(
135deg,
#b44a4a,
#7c2424
);
}

/* =========================================================
MODES
========================================================= */
.modeScreen{
position:fixed;
inset:0;

display:none;
flex-direction:column;

align-items:center;
justify-content:center;

padding:28px;
z-index:999;
}

.modeScreen.active{
display:flex;
}

.modeBack{
position:absolute;
top:54px;
left:20px;

height:48px;
padding:0 18px;

border:none;
border-radius:16px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;
font-weight:700;

cursor:pointer;
}

.modeTitle{
font-size:34px;
font-weight:900;
margin-bottom:12px;
}

.modePhase{
font-size:30px;
font-weight:800;
margin-bottom:12px;
}

.modeHint{
font-size:18px;
line-height:1.5;
text-align:center;
color:#c7d6e3;

min-height:54px;
max-width:320px;
}

.timer{
margin-top:34px;
font-size:54px;
font-weight:900;
}

.ballWrap{
height:260px;

display:flex;
align-items:center;
justify-content:center;
}

.phaseBar{
margin-top:12px;

width:220px;
height:8px;

border-radius:999px;
overflow:hidden;

background:rgba(255,255,255,.08);
}

.phaseProgress{
height:100%;
width:0%;

background:
linear-gradient(
90deg,
#5adfff,
#4de073
);
}

/* =========================================================
TRAINING
========================================================= */
.trainingMode{
background:
radial-gradient(circle at center,
#0d355b,
#020b14);
}

.ball{
width:90px;
height:90px;
border-radius:50%;

background:
radial-gradient(circle at 30% 30%,
#a4fbff,
#2ea4ff);

box-shadow:
0 0 70px rgba(86,196,255,.5);

transform:scale(.7);

transition:
transform 6s cubic-bezier(.22,.61,.36,1),
background 2s ease;
}

/* =========================================================
RECOVERY
========================================================= */
.recoveryMode{
background:
radial-gradient(circle at center,
#08111b,
#01060a);
}

.recoveryBall{
width:86px;
height:86px;
border-radius:50%;

background:
radial-gradient(circle at 30% 30%,
#9deeff,
#5a93ff);

box-shadow:
0 0 50px rgba(108,164,255,.4);

transform:scale(.8);

transition:
transform 7s cubic-bezier(.22,.61,.36,1),
background 2s ease;
}

/* =========================================================
SOS
========================================================= */
.sosMode{
background:
radial-gradient(circle at center,
#0a0f14 0%,
#04070a 60%,
#010203 100%);
}

.sosBall{
width:72px;
height:72px;
border-radius:50%;

background:
radial-gradient(circle at 30% 30%,
#d7fbff,
#65cfff);

box-shadow:
0 0 24px rgba(86,196,255,.18);

transform:scale(.72);

transition:
transform 8s cubic-bezier(.22,.61,.36,1),
background 3s ease;
}

@media(max-width:560px){

.logo{
font-size:50px;
}

.subtitle{
font-size:18px;
}

.hrvValue{
font-size:72px;
}

.statusTitle{
font-size:32px;
}

.statusText{
font-size:19px;
}

.inputRow{
flex-direction:column;
}

.saveBtn{
width:100%;
}

}

</style>
</head>

<body>

<div class="app">

<div class="hero">
<div class="logoWave">〰〰</div>
<div class="logo">VagusBuk</div>
<div class="subtitle">
Parasympathisches HRV- &
Nervensystem-Training
</div>
</div>

<div class="card">

<div class="sectionTitle">
HRV heute
</div>

<div class="hrvTop">

<div>
<div class="hrvValue" id="hrvValue">--</div>

<div class="hrvInfo" id="hrvInfo">
Noch keine Daten vorhanden.
</div>
</div>

<div class="hrvAverage">
Ø 7 Tage
<span id="avgValue">--</span>
</div>

</div>

<div class="inputRow">

<input
type="number"
inputmode="numeric"
placeholder="z.B. 41"
class="hrvInput"
id="hrvInput">

<button
class="saveBtn"
onclick="App.saveHRV()">
Speichern
</button>

</div>

<div class="chart" id="chart"></div>

</div>

<script>

/* =========================================================
STATE
========================================================= */
const State = {
mode:"idle"
};

/* =========================================================
STORAGE
========================================================= */
const Storage = {

key:"vagusbuk_hrv",

todayKey(){

return new Date()
.toISOString()
.slice(0,10);

},

load(){

const keys = [
"vagusbuk_hrv",
"hrvData",
"vagusbukData",
"vagus_hrv"
];

for(const key of keys){

try{

const raw =
localStorage.getItem(key);

if(!raw) continue;

const parsed =
JSON.parse(raw);

if(!Array.isArray(parsed))
continue;

return parsed.map(entry => {

if(typeof entry === "number"){

const now = Date.now();

return {
value: entry,
date: now,
day: new Date(now)
.toISOString()
.slice(0,10)
};

}

if(!entry.date){

entry.date = Date.now();

}

if(!entry.day){

entry.day =
new Date(entry.date)
.toISOString()
.slice(0,10);

}

return entry;

});

}catch(e){}

}

return [];

},

save(data){

localStorage.setItem(
this.key,
JSON.stringify(data)
);

}

};

/* =========================================================
APP
========================================================= */
const App = {

hrvData: Storage.load(),

saveHRV(){

const input =
document.getElementById("hrvInput");

const value =
parseInt(input.value);

if(isNaN(value) || value <= 0){

input.style.border =
"2px solid #d35c5c"

setTimeout(()=>{
input.style.border =
"2px solid rgba(73,127,189,.45)"
},800);

return;

}

const today =
Storage.todayKey();

const existing =
this.hrvData.findIndex(
d => d.day === today
);

if(existing !== -1){

this.hrvData[existing].value =
value;

this.hrvData[existing].date =
Date.now();

}else{

this.hrvData.push({

value:value,
day:today,
date:Date.now()

});

}

this.hrvData.sort(
(a,b)=>a.date-b.date
);

if(this.hrvData.length > 30){

this.hrvData =
this.hrvData.slice(-30);

}

Storage.save(this.hrvData);

input.value = ""

this.render();

},

render(){

UI.renderHRV(this.hrvData);

UI.renderChart(this.hrvData);

}

};

/* =========================================================
UI
========================================================= */
const UI = {

getAverage(data){

const last7 =
data.slice(-7);

if(!last7.length)
return null;

return Math.round(
last7.reduce(
(a,b)=>a+b.value,
0
) / last7.length
);

},

renderHRV(data){

const latest =
data.length
? data[data.length-1].value
: null;

const avg =
this.getAverage(data);

document.getElementById(
"hrvValue"
).innerText = latest ?? "--"

document.getElementById(
"avgValue"
).innerText = avg ?? "--"

},

renderChart(data){

const chart =
document.getElementById(
"chart"
);

chart.innerHTML = ""

const weekdays = [
"So","Mo","Di",
"Mi","Do","Fr","Sa"
];

data.slice(-7).forEach(item=>{

const wrap =
document.createElement("div");

wrap.className =
"barWrap"

const value =
document.createElement("div");

value.className =
"barValue"

value.innerText =
item.value;

const bar =
document.createElement("div");

bar.className =
"bar"

bar.style.height =
Math.max(
28,
item.value * 1.8
) + "px"

const label =
document.createElement("div");

label.className =
"barLabel"

label.innerText =
weekdays[
new Date(item.date)
.getDay()
];

wrap.appendChild(value);
wrap.appendChild(bar);
wrap.appendChild(label);

chart.appendChild(wrap);

});

}

};

/* =========================================================
INIT
========================================================= */
App.render();

</script>

</body>
</html>
