<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk CORE 2.3</title>

<style>
body {
margin: 0;
font-family: -apple-system, sans-serif;
background: #0b0f14;
color: #e8eef2;
text-align: center;
}

.container { padding: 20px; }

button {
width: 90%;
max-width: 420px;
margin: 10px;
padding: 18px;
font-size: 18px;
border-radius: 12px;
border: none;
color: white;
}

.ventral { background:#1f3d2b; }
.sympathikus { background:#4a3f1d; }
.dorsal { background:#1a1a1a; }

.hidden { display:none; }

.big { font-size: 28px; margin: 15px 0; }
.sub { opacity: 0.7; font-size: 14px; }
.danger { color:#ff5c5c; }
</style>
</head>

<body>

<h1>VagusBuk CORE 2.3</h1>

<div class="container" id="home">

<div class="big">Zustand wählen</div>

<button class="ventral" onclick="start('ventral')">Stabil</button>
<button class="sympathikus" onclick="start('sympathikus')">Angespannt</button>
<button class="dorsal" onclick="start('dorsal')">Erschöpft</button>

<p id="warning" class="danger"></p>

</div>

<div class="container hidden" id="session">

<div id="title" class="big"></div>
<div id="instruction" class="sub"></div>

<button onclick="stop()">Stop</button>

</div>

<div class="container hidden" id="feedback">

<div class="big">Hilft es?</div>

<button onclick="save('better')">Besser</button>
<button onclick="save('same')">Gleich</button>
<button onclick="save('worse')">Schlechter</button>

</div>

<script>

let state = ""
let sessionActive = false;

// ----------------------------
// STABILITÄTSCHECK
// ----------------------------
function stabilityCheck() {

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];

let last5 = log.slice(-5);

let worse = last5.filter(e => e.result === "worse").length;

let dorsalCount = last5.filter(e => e.state === "dorsal").length;

if (worse >= 3 || dorsalCount >= 3) {
document.getElementById("warning").innerText =
"⚠️ Vorsicht: System instabil – nur Minimalmodus empfohlen"

return false;
}

document.getElementById("warning").innerText = ""
return true;
}

// ----------------------------
// START
// ----------------------------
function start(s) {

state = s;

if (!stabilityCheck() && state !== "dorsal") {
alert("Zu instabil für aktive Übungen. Wechsel zu Minimalmodus.");
state = "dorsal"
}

sessionActive = true;

document.getElementById("home").classList.add("hidden");
document.getElementById("session").classList.remove("hidden");

apply(state);
}

// ----------------------------
// MODE
// ----------------------------
function apply(s) {

let title = ""
let instruction = ""

if (s === "ventral") {
title = "Stabilisierung"
instruction = "ruhig bleiben"

} else if (s === "sympathikus") {
title = "Runterregulation"
instruction = "langsamer werden"

} else {
title = "Minimalmodus"
instruction = "keine Übung. nur Sicherheit."
}

document.getElementById("title").innerText = title;
document.getElementById("instruction").innerText = instruction;
}

// ----------------------------
// STOP (STABIL FIX)
// ----------------------------
function stop() {

sessionActive = false;

document.getElementById("session").classList.add("hidden");
document.getElementById("feedback").classList.remove("hidden");
}

// ----------------------------
// SAVE + LERNLOGIK
// ----------------------------
function save(result) {

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];

log.push({
date: new Date().toLocaleString(),
state: state,
result: result
});

localStorage.setItem("vagusLog", JSON.stringify(log));

document.getElementById("feedback").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

stabilityCheck();
}

</script>

</body>
</html>
