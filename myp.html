<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk 1.2</title>

<style>
body {
margin: 0;
font-family: -apple-system, sans-serif;
background: #0b0f14;
color: #e8eef2;
text-align: center;
}
.container { padding: 20px; }
button {
width: 90%; max-width: 400px;
margin: 10px; padding: 18px;
font-size: 18px; border-radius: 12px;
border: none; background: #1c2733; color: white;
}
.hidden { display: none; }
.timer { font-size: 48px; margin: 20px; }
.warning { color: #ff6b6b; }
</style>
</head>

<body>

<h1>VagusBuk 1.2</h1>

<div class="container" id="home">

<h3>Zustand wählen</h3>

<select id="trigger">
<option value="none">Auslöser wählen</option>
<option value="screen">Bildschirm</option>
<option value="stress">Stress</option>
<option value="emotion">Emotion</option>
<option value="unknown">Unklar</option>
</select>

<button onclick="quickStart()">Letzte gute Übung</button>

<button onclick="startSession('stable')">Stabil</button>
<button onclick="startSession('tense')">Angespannt</button>
<button onclick="startSession('overstimulated')">Überreizt</button>
<button onclick="startSession('crash')">Crash</button>

<p id="overuse" class="warning"></p>

<button onclick="showLog()">Verlauf</button>

</div>

<div class="container hidden" id="session">
<h3 id="exerciseTitle"></h3>
<p id="instruction"></p>
<div class="timer" id="timer"></div>
<button onclick="finishSession()">Fertig</button>
</div>

<div class="container hidden" id="feedback">
<h3>Wie war es?</h3>
<button onclick="saveFeedback('better')">Besser</button>
<button onclick="saveFeedback('same')">Gleich</button>
<button onclick="saveFeedback('worse')">Schlechter</button>
</div>

<div class="container hidden" id="logView">
<div id="log"></div>
<button onclick="goHome()">Zurück</button>
</div>

<script>
let currentState = ""
let currentExercise = ""
let duration = 60;
let interval;

const exercises = {
stable: ["Resonanzatmung","Summen"],
tense: ["4-6 Atmung","Nacken lösen"],
overstimulated: ["Augen zu + Atmung","Dunkel + Ruhe"],
crash: ["Minimalmodus"]
};

function startSession(state) {
currentState = state;

if (isLocked()) {
state = "crash"
}

currentExercise = selectExercise(state);
duration = getDuration(state);

speak(currentExercise);

document.getElementById("home").classList.add("hidden");
document.getElementById("session").classList.remove("hidden");

document.getElementById("exerciseTitle").innerText = currentExercise;
document.getElementById("instruction").innerText = "Folge der Stimme"

startTimer();
}

function isLocked() {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let last = log.slice(-2);

return last.length === 2 && last.every(e => e.result === "worse");
}

function selectExercise(state) {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];

let bad = log.filter(e => e.result === "worse").map(e => e.exercise);

let options = exercises[state].filter(e => !bad.includes(e));

if (options.length === 0) options = exercises[state];

return options[Math.floor(Math.random() * options.length)];
}

function getDuration(state) {
if (state === "crash") return 90;
if (state === "overstimulated") return 60;
if (state === "tense") return 90;
return 120;
}

function speak(text) {
let msg = new SpeechSynthesisUtterance(text);
msg.rate = 0.9;
speechSynthesis.speak(msg);
}

function startTimer() {
let time = duration;
document.getElementById("timer").innerText = time;

interval = setInterval(() => {
time--;
document.getElementById("timer").innerText = time;
if (time <= 0) clearInterval(interval);
}, 1000);
}

function finishSession() {
clearInterval(interval);
document.getElementById("session").classList.add("hidden");
document.getElementById("feedback").classList.remove("hidden");
}

function saveFeedback(result) {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];

log.push({
date: new Date().toLocaleString(),
state: currentState,
exercise: currentExercise,
result: result,
trigger: document.getElementById("trigger").value
});

localStorage.setItem("vagusLog", JSON.stringify(log));

checkOveruse(log);

goHome();
}

function checkOveruse(log) {
let recent = log.slice(-5);
if (recent.length >= 4) {
document.getElementById("overuse").innerText =
"⚠️ Viele Sessions → evtl. Überforderung"
}
}

function quickStart() {
let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let last = log.reverse().find(e => e.result === "better");
if (!last) return startSession("stable");

startSession(last.state);
}

function showLog() {
document.getElementById("home").classList.add("hidden");
document.getElementById("logView").classList.remove("hidden");

let log = JSON.parse(localStorage.getItem("vagusLog")) || [];
let container = document.getElementById("log");

container.innerHTML = ""

log.slice().reverse().forEach(e => {
container.innerHTML += `
<p>
${e.date}<br>
${e.state} – ${e.exercise} → ${e.result}<br>
Trigger: ${e.trigger}
</p><hr>`;
});
}

function goHome() {
document.getElementById("feedback").classList.add("hidden");
document.getElementById("logView").classList.add("hidden");
document.getElementById("session").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}
</script>

</body>
</html>
