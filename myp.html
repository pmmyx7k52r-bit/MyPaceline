<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VagusBuk A5.4</title>

<style>

:root{
--bg:#071018;
--card:#101b27;
--card2:#162433;

--text:#eef3f7;
--muted:#8fa2b5;

--green:#38c85b;
--yellow:#d9b03e;
--red:#d86464;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:
radial-gradient(circle at top,#11243a 0%,#071018 45%);
color:var(--text);
}

.container{
max-width:620px;
margin:auto;
padding:24px 18px 120px;
}

/* HEADER */

.header{
text-align:center;
margin-top:34px;
margin-bottom:24px;
}

.wave{
color:#607286;
font-size:36px;
}

.logo{
font-size:54px;
font-weight:800;
letter-spacing:-3px;
margin-top:4px;
}

.sub{
margin-top:8px;
color:var(--muted);
font-size:18px;
}

/* MINI HRV */

.hrvMini{
background:rgba(12,22,34,.92);
border:1px solid rgba(255,255,255,.05);

border-radius:24px;

padding:18px 20px;

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:18px;
}

.hrvLeft{
display:flex;
flex-direction:column;
}

.hrvLabel{
color:var(--muted);
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
}

.hrvValue{
margin-top:4px;
font-size:34px;
font-weight:800;
}

.hrvText{
margin-top:4px;
color:#dce5ed;
font-size:16px;
}

.hrvBtn{
border:none;
background:#1b2a3a;
color:white;

border-radius:16px;

padding:12px 18px;

font-size:15px;
}

/* HRV EDIT */

.hrvEdit{
display:none;

margin-top:14px;

gap:10px;
}

.hrvEdit.open{
display:flex;
}

.hrvInput{
flex:1;

height:56px;

background:#09131d;

border:1px solid rgba(90,150,230,.25);

border-radius:18px;

color:white;

padding:0 18px;

font-size:24px;

outline:none;
}

.saveBtn{
border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#3cc95d,
#24843b
);

color:white;

font-size:17px;
font-weight:700;

padding:0 20px;
}

/* MAIN CARD */

.mainCard{
background:rgba(12,22,34,.92);

border:1px solid rgba(255,255,255,.05);

border-radius:30px;

padding:20px;
}

.sectionLabel{
color:var(--muted);

text-transform:uppercase;

letter-spacing:1px;

font-size:13px;

margin-bottom:16px;
}

/* STATES */

.state{
border:none;

width:100%;

text-align:left;

border-radius:24px;

padding:22px;

margin-bottom:14px;

color:white;

transition:.2s;
}

.state:active{
transform:scale(.99);
}

.green{
background:
linear-gradient(
135deg,
#1d6a38,
#224d31
);
}

.yellow{
background:
linear-gradient(
135deg,
#6a5619,
#554415
);
}

.red{
background:
linear-gradient(
135deg,
#6a2d2d,
#522626
);
}

.stateRow{
display:flex;
align-items:center;
justify-content:space-between;
}

.stateLeft{
display:flex;
align-items:center;
gap:16px;
}

.emoji{
font-size:34px;
}

.stateTitle{
font-size:28px;
font-weight:800;
}

.stateDesc{
margin-top:3px;
color:rgba(255,255,255,.82);
font-size:16px;
}

.arrow{
font-size:32px;
opacity:.5;
}

/* TRAINING PANEL */

.trainingPanel{
display:none;

margin-top:6px;

background:#0d1722;

border-radius:24px;

padding:22px;
}

.trainingPanel.open{
display:block;
}

.trainingTitle{
font-size:30px;
font-weight:800;
}

.trainingText{
margin-top:12px;

color:#d8e3ea;

line-height:1.55;

font-size:17px;
}

.trainingList{
margin-top:16px;
}

.trainingList div{
margin-bottom:10px;
color:#edf3f8;
}

.startBtn{
width:100%;

margin-top:22px;

border:none;

border-radius:20px;

padding:18px;

font-size:20px;
font-weight:700;

color:white;

background:
linear-gradient(
135deg,
#3dc85d,
#24843b
);
}

.backBtn{
width:100%;

margin-top:12px;

border:none;

border-radius:18px;

padding:16px;

background:#1b2a3a;

color:white;

font-size:16px;
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;

background:#071018;

display:none;

flex-direction:column;

justify-content:center;
align-items:center;

text-align:center;

padding:30px;

z-index:999;
}

.circle{
width:180px;
height:180px;

border-radius:50%;

background:
radial-gradient(
circle,
#45d766 0%,
#216f35 70%
);

box-shadow:
0 0 70px rgba(69,215,102,.22);

transition:2s ease-in-out;
}

.expand{
transform:scale(1.18);
}

.phase{
margin-top:30px;

font-size:38px;
font-weight:800;
}

.timer{
margin-top:8px;

font-size:78px;
font-weight:800;
}

.info{
margin-top:20px;

color:var(--muted);

max-width:520px;

line-height:1.5;

font-size:20px;
}

.stopBtn{
margin-top:34px;

border:none;

border-radius:18px;

background:#223140;

color:white;

padding:16px 28px;

font-size:17px;
}

@media(max-width:700px){

.logo{
font-size:46px;
}

.stateTitle{
font-size:24px;
}

.trainingTitle{
font-size:26px;
}

.phase{
font-size:32px;
}

.timer{
font-size:68px;
}
}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div class="wave">
〰〰
</div>

<div class="logo">
VagusBuk
</div>

<div class="sub">
Weniger Überlastung. Mehr Stabilität.
</div>

</div>

<!-- HRV -->

<div class="hrvMini">

<div class="hrvLeft">

<div class="hrvLabel">
HRV heute
</div>

<div
class="hrvValue"
id="todayHRV"
>
--
</div>

<div
class="hrvText"
id="hrvText"
>
Direkt morgens messen.
</div>

</div>

<button
class="hrvBtn"
onclick="toggleHRVEdit()"
>
ändern
</button>

</div>

<div
class="hrvEdit"
id="hrvEdit"
>

<input
type="number"
class="hrvInput"
id="hrvInput"
placeholder="z.B. 41"
>

<button
class="saveBtn"
onclick="saveHRV()"
>
Speichern
</button>

</div>

<!-- MAIN -->

<div class="mainCard">

<div class="sectionLabel">
Wie ist es gerade?
</div>

<!-- STABLE -->

<button
class="state green"
onclick="openTraining('stable')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
🙂
</div>

<div>

<div class="stateTitle">
Stabil
</div>

<div class="stateDesc">
Ruhig und belastbar.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<!-- YELLOW -->

<button
class="state yellow"
onclick="openTraining('yellow')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
😕
</div>

<div>

<div class="stateTitle">
Kippt leicht
</div>

<div class="stateDesc">
Erste Überlastung.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<!-- RED -->

<button
class="state red"
onclick="openTraining('red')"
>

<div class="stateRow">

<div class="stateLeft">

<div class="emoji">
😣
</div>

<div>

<div class="stateTitle">
Kippt
</div>

<div class="stateDesc">
Überreizt oder erschöpft.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<!-- TRAINING -->

<div
class="trainingPanel"
id="trainingPanel"
>

<div
class="trainingTitle"
id="trainingTitle"
>
Training
</div>

<div
class="trainingText"
id="trainingText"
>
</div>

<div
class="trainingList"
id="trainingList"
>
</div>

<button
class="startBtn"
id="startBtn"
>
Training starten
</button>

<button
class="backBtn"
onclick="closeTraining()"
>
Schließen
</button>

</div>

</div>

</div>

<!-- OVERLAY -->

<div
class="overlay"
id="overlay"
>

<div
class="circle"
id="circle"
></div>

<div
class="phase"
id="phase"
>
Vorbereitung
</div>

<div
class="timer"
id="timer"
>
60
</div>

<div
class="info"
id="info"
>
Ruhig werden.
</div>

<button
class="stopBtn"
onclick="stopTraining()"
>
Abbrechen
</button>

</div>

<script>

/* STORAGE */

let hrvData =
JSON.parse(
localStorage.getItem("vb_hrv")
) || [];

/* AUDIO */

let audioReady = false;

function unlockAudio(){

if(audioReady) return;

audioReady = true;

speechSynthesis.speak(
new SpeechSynthesisUtterance(" ")
);
}

function speak(text){

if(!audioReady) return;

speechSynthesis.cancel();

let msg =
new SpeechSynthesisUtterance(text);

msg.lang = "de-DE"
msg.rate = .92;

speechSynthesis.speak(msg);
}

/* HRV */

function toggleHRVEdit(){

document
.getElementById("hrvEdit")
.classList.toggle("open");
}

function saveHRV(){

let val =
parseInt(
document.getElementById("hrvInput").value
);

if(!val) return;

hrvData.push({
value:val,
time:Date.now()
});

hrvData = hrvData.slice(-14);

localStorage.setItem(
"vb_hrv",
JSON.stringify(hrvData)
);

updateHRV();

document.getElementById(
"hrvInput"
).value = ""

toggleHRVEdit();
}

function updateHRV(){

if(hrvData.length === 0) return;

let today =
hrvData[hrvData.length - 1].value;

let avg = Math.round(

hrvData.reduce(
(a,b)=>a+b.value,
0
) / hrvData.length

);

document.getElementById(
"todayHRV"
).innerText = today;

let txt =
document.getElementById("hrvText");

if(today > avg){

txt.innerText =
"Heute eher belastbar."

}else if(today < avg){

txt.innerText =
"Heute vorsichtiger bleiben."

}else{

txt.innerText =
"Heute normales Niveau."
}
}

/* TRAINING PANEL */

function openTraining(type){

unlockAudio();

let panel =
document.getElementById(
"trainingPanel"
);

panel.classList.add("open");

let title =
document.getElementById(
"trainingTitle"
);

let text =
document.getElementById(
"trainingText"
);

let list =
document.getElementById(
"trainingList"
);

let btn =
document.getElementById(
"startBtn"
);

if(type === "stable"){

title.innerText =
"5 Min HRV Training"

text.innerText =
"Langsame Atmung mit längerer Ausatmung trainiert vagale Stabilität."

list.innerHTML = `
<div>• 4 Sekunden einatmen</div>
<div>• 6 Sekunden ausatmen</div>
<div>• später Summen beim Ausatmen</div>
`;

btn.onclick =
()=>startTraining("stable");
}

if(type === "yellow"){

title.innerText =
"Kurz stabilisieren"

text.innerText =
"Überlastung früh beruhigen bevor das Nervensystem stärker kippt."

list.innerHTML = `
<div>• Schultern sinken lassen</div>
<div>• langsames Ausatmen</div>
<div>• Blick ruhig halten</div>
`;

btn.onclick =
()=>startTraining("yellow");
}

if(type === "red"){

title.innerText =
"Akut beruhigen"

text.innerText =
"Körperreize helfen oft besser als starke Atemtechniken."

list.innerHTML = `
<div>• Brustbein klopfen</div>
<div>• langsames Ausatmen</div>
<div>• Summen</div>
`;

btn.onclick =
()=>startTraining("red");
}
}

function closeTraining(){

document
.getElementById("trainingPanel")
.classList.remove("open");
}

/* OVERLAY */

let interval = null;

function startTraining(type){

openOverlay();

if(type === "stable"){
startStable();
}

if(type === "yellow"){
startYellow();
}

if(type === "red"){
startRed();
}
}

function openOverlay(){

document
.getElementById("overlay")
.style.display = "flex"
}

function closeOverlay(){

document
.getElementById("overlay")
.style.display = "none"
}

function setPhase(t){

document
.getElementById("phase")
.innerText = t;
}

function setInfo(t){

document
.getElementById("info")
.innerText = t;
}

function setTimer(t){

document
.getElementById("timer")
.innerText = t;
}

function pulseIn(){

document
.getElementById("circle")
.classList.add("expand");
}

function pulseOut(){

document
.getElementById("circle")
.classList.remove("expand");
}

function stopTraining(){

clearInterval(interval);

speechSynthesis.cancel();

closeOverlay();
}

/* STABLE */

function startStable(){

let t = 300;
let cycle = 0;

setInfo(
"Ruhige Atmung trainiert den Vagus langfristig."
);

speak(
"Wir beginnen ruhig."
);

interval = setInterval(()=>{

t--;
cycle++;

setTimer(
formatTime(t)
);

if(cycle % 10 < 4){

setPhase("Einatmen");

pulseIn();

if(cycle % 10 === 1){

speak("Ein");
}

}else{

setPhase("Ausatmen");

pulseOut();

if(cycle % 10 === 4){

speak("Aus");
}
}

if(t < 120){

setPhase(
"Summen beim Ausatmen"
);

if(cycle % 10 === 4){

speak("Voooo");
}
}

if(t <= 0){

finishTraining(
"Training abgeschlossen."
);
}

},1000);
}

/* YELLOW */

function startYellow(){

let t = 60;
let cycle = 0;

setInfo(
"Früh beruhigen bevor Überlastung stärker wird."
);

speak(
"Schultern locker lassen."
);

interval = setInterval(()=>{

t--;
cycle++;

setTimer(t);

if(cycle % 10 < 4){

setPhase("Einatmen");

pulseIn();

}else{

setPhase("Lang ausatmen");

pulseOut();
}

if(t <= 0){

finishTraining(
"Etwas ruhiger."
);
}

},1000);
}

/* RED */

function startRed(){

let t = 45;

setInfo(
"Körperreize helfen oft schneller als starke Atemübungen."
);

setPhase(
"Brustbein klopfen"
);

speak(
"Klopfe jetzt sanft auf dein Brustbein."
);

interval = setInterval(()=>{

t--;

setTimer(t);

if(t === 25){

setPhase(
"Lang ausatmen"
);

speak(
"Langsam ausatmen."
);
}

if(t === 12){

setPhase(
"Summen"
);

speak("Voooo");
}

if(t <= 0){

finishTraining(
"Akute Überlastung etwas reduziert."
);
}

},1000);
}

/* FINISH */

function finishTraining(text){

clearInterval(interval);

setPhase("Fertig");

setInfo(text);

speak("Fertig.");

setTimeout(()=>{

closeOverlay();

},2200);
}

/* HELPER */

function formatTime(sec){

let m =
Math.floor(sec / 60);

let s =
sec % 60;

return `${m}:${s
.toString()
.padStart(2,"0")}`;
}

/* INIT */

updateHRV();

</script>

</body>
</html>
