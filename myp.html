<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagusBuk 3.4</title>

<style>
body {
margin:0;
font-family:-apple-system,sans-serif;
background:#0b0f14;
color:#e8eef2;
text-align:center;
}

.container { padding:20px; }

button {
width:90%;
max-width:420px;
margin:10px;
padding:16px;
font-size:16px;
border-radius:12px;
border:none;
color:white;
}

.primary { background:#2b4a3a; }
.secondary { background:#2d3b4a; }

.card {
background:#15202b;
padding:16px;
margin-top:16px;
border-radius:12px;
text-align:left;
}

.small { font-size:13px; opacity:0.7; }

.timer {
font-size:40px;
margin-top:15px;
}

.phase {
font-size:20px;
margin-top:10px;
}

.hidden { display:none; }
</style>
</head>

<body>

<h1>VagusBuk 3.4</h1>

<div class="container">

<button class="primary" onclick="startSession()">
Recovery starten (60s)
</button>

<button class="secondary" onclick="quickRelief()">
Soforthilfe (15s)
</button>

<div id="timer" class="timer hidden">60</div>
<div id="phase" class="phase hidden"></div>

<div id="status" class="card hidden"></div>
<div id="explain" class="card small hidden"></div>

</div>

<script>

let interruptions = 0;
let lastShortSession = false;

let timerInterval = null;
let breathInterval = null;

// ----------------------------
// VOICE
// ----------------------------
function speak(text) {
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "de-DE"
msg.rate = 0.9;
speechSynthesis.speak(msg);
}

// ----------------------------
// MAIN SESSION
// ----------------------------
function startSession() {

clearAll();

let t = 60;
let phase = "in"

showUI();

document.getElementById("timer").innerText = t;
document.getElementById("phase").innerText = "Start"

speak("Einfach folgen. Vier ein, sechs aus.");

breathInterval = setInterval(() => {

if (phase === "in") {

document.getElementById("phase").innerText = "Einatmen (4s)"
speak("Ein");

setTimeout(() => {
document.getElementById("phase").innerText = "Ausatmen (6s)"
speak("Aus");
}, 4000);

phase = "out"

} else {
phase = "in"
}

}, 10000);

timerInterval = setInterval(() => {

t--;
document.getElementById("timer").innerText = t;

if (t <= 0) finish(true);

}, 1000);
}

// ----------------------------
// QUICK RELIEF
// ----------------------------
function quickRelief() {

clearAll();
showUI();

document.getElementById("timer").innerText = "15"
document.getElementById("phase").innerText = "Schultern hochziehen..."

speak("Zieh die Schultern hoch... halten... und fallen lassen.");

setTimeout(() => {
document.getElementById("phase").innerText = "Loslassen"
speak("Loslassen");
}, 5000);

setTimeout(() => finish(true), 15000);
}

// ----------------------------
// FINISH
// ----------------------------
function finish(completed) {

clearAll();

document.getElementById("phase").innerText = "Fertig – kurz nachspüren"

speak("Fertig.");

if (!completed) {
interruptions++;
lastShortSession = true;
} else {
interruptions = Math.max(0, interruptions - 1);
lastShortSession = false;
}

explainDecision();
}

// ----------------------------
// EXPLAIN
// ----------------------------
function explainDecision() {

let box = document.getElementById("explain");
box.classList.remove("hidden");

let text = ""

if (interruptions >= 3) {

text = `
Warum diese Übung?<br><br>
• mehrere Abbrüche erkannt<br>
→ geringere Belastbarkeit<br>
→ einfache Regulation sinnvoll
`;

} else if (lastShortSession) {

text = `
Warum diese Übung?<br><br>
• letzte Session früh beendet<br>
→ reduzierte Kapazität<br>
→ sanfter Einstieg empfohlen
`;

} else {

text = `
Warum diese Übung?<br><br>
• stabile Nutzung<br>
→ normale Atemübung passend
`;
}

box.innerHTML = text;
}

// ----------------------------
// UI
// ----------------------------
function showUI() {

document.getElementById("timer").classList.remove("hidden");
document.getElementById("phase").classList.remove("hidden");
document.getElementById("status").classList.remove("hidden");
}

function clearAll() {

clearInterval(timerInterval);
clearInterval(breathInterval);

timerInterval = null;
breathInterval = null;
}

</script>

</body>
</html>
