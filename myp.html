<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPaceline 2.5.5</title>

<style>
body { font-family:-apple-system; background:#f2f2f7; padding:20px; text-align:center;}
.card { background:white; border-radius:12px; padding:16px; margin-bottom:15px;}

button {
width:100%;
padding:14px;
margin-top:8px;
border:none;
border-radius:10px;
color:white;
font-size:16px;
}

.green{background:#34c759;}
.orange{background:#ff9500;}
.red{background:#ff3b30;}
.blue{background:#007aff;}
.grey{background:#ccc;color:#333;}

#status{
font-size:28px;
font-weight:bold;
padding:10px;
border-radius:10px;
}

.ok{background:#d4f8d4;color:#1a7f1a;}
.warn{background:#fff4cc;color:#b38600;}
.danger{background:#ffd6d6;color:#a10000;}

#timer{display:none;font-size:26px;margin-top:10px;}

#focusRow{
display:flex;
gap:8px;
align-items:center;
}

#focusRow button{
flex:1;
margin-top:0;
}

#baselineDisplay{
width:70px;
text-align:center;
font-weight:bold;
}

/* Popup */
#baselinePopup{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:999;
}

.popupBox{
background:white;
padding:20px;
border-radius:12px;
width:80%;
max-width:300px;
}

#baselineOptions{
display:flex;
flex-direction:column;
}

#baselineOptions button{
width:100%;
margin-top:8px;
}

.selected{
background:#007aff !important;
color:white !important;
}

/* Toast */
#toast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#333;
color:white;
padding:12px 20px;
border-radius:10px;
opacity:0;
transition:opacity 0.3s;
z-index:1000;
}
</style>
</head>

<body>

<h1>MyPaceline</h1>

<div id="start" class="card">
<h3>Wie hast du geschlafen?</h3>
<button id="good" class="green">Gut</button>
<button id="mid" class="orange">Geht so</button>
<button id="bad" class="red">Schlecht</button>
</div>

<div id="app" style="display:none;">

<div class="card">
<div id="status" class="ok">Alles ok</div>
<div id="energy">Energie: 100%</div>
<div id="timer">00:00</div>
<div id="warn"></div>
</div>

<div class="card">
<button id="pause" class="green">Pause</button>
</div>

<div class="card">

<div id="focusRow">
<button id="focus" class="blue">Kopf an</button>
<div id="baselineDisplay">3 min</div>
<button id="baselineBtn" class="grey">⚙️</button>
</div>

<button id="move" class="blue">Locker bewegen</button>
<button id="body" class="orange">Körper anstrengend</button>
<button id="too" class="red">Zu viel</button>

</div>

<div class="card">
<div id="log"></div>
</div>

<button id="undo" class="grey">Rückgängig</button>

</div>

<!-- Popup -->
<div id="baselinePopup">
<div class="popupBox">
<h3>Baseline ändern</h3>
<p>Wähle deine Minuten-Grenze:</p>
<div id="baselineOptions"></div>
<button id="closeBaseline" class="grey">Abbrechen</button>
</div>
</div>

<!-- Toast -->
<div id="toast">Neue Baseline gespeichert</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let energy=100, log=[];
let timer=null, start=0;

let baseline = localStorage.getItem("baseline")
? parseInt(localStorage.getItem("baseline"))
: 3;

const $ = id => document.getElementById(id);

function showApp(){
$("start").style.display="none"
$("app").style.display="block"
}

function updateStatus(){
let s=$("status");

if(energy>70){
s.className="ok"
s.innerText="Alles ok"
}else if(energy>40){
s.className="warn"
s.innerText="Achtung"
}else{
s.className="danger"
s.innerText="Stopp"
}
}

function updateBaselineDisplay(){
$("baselineDisplay").innerText = baseline + " min"
}

function showToast(msg){
let t = $("toast");
t.innerText = msg;
t.style.opacity = 1;

setTimeout(()=>{
t.style.opacity = 0;
},1500);
}

function now(){
let d=new Date();
return d.getHours()+":"+("0"+d.getMinutes()).slice(-2);
}

function render(){
$("log").innerHTML = log.map(e=>e.time+" - "+e.text).join("<br>");
$("energy").innerText="Energie: "+energy+"%"
updateStatus();
}

// Start
$("good").onclick=()=>{energy=100;showApp();render();}
$("mid").onclick=()=>{energy=80;showApp();render();}
$("bad").onclick=()=>{energy=60;showApp();render();}

// Actions
$("move").onclick=()=>add(2,"Locker bewegt");
$("body").onclick=()=>add(6,"Körper anstrengend");
$("too").onclick=()=>add(20,"Zu viel");
$("pause").onclick=()=>add(0,"Pause");

$("undo").onclick=()=>{
if(!log.length) return;
log.shift();
render();
};

function add(v,t){
energy-=v; if(energy<0) energy=0;
log.unshift({time:now(),text:t});
render();
}

// Fokus
$("focus").onclick=()=>{

if(timer){
clearInterval(timer);
timer=null;

let min=(Date.now()-start)/60000;

$("timer").style.display="none"
$("focus").innerText="Kopf an"

let cost = min>baseline?5:2;
add(cost,"Kopf an "+Math.round(min)+" Min");

}else{

start=Date.now();
$("timer").style.display="block"
$("focus").innerText="Stopp"

timer=setInterval(()=>{
let sec=(Date.now()-start)/1000;
let m=Math.floor(sec/60);
let s=Math.floor(sec%60);

$("timer").innerText=("0"+m).slice(-2)+":"+("0"+s).slice(-2);

let cur=sec/60;

if(cur>baseline*0.85 && cur<baseline) $("warn").innerText="⚠ gleich"
else if(cur>=baseline) $("warn").innerText="⚠ Grenze"
else $("warn").innerText=""

},1000);
}
};

// Baseline Popup
$("baselineBtn").onclick=()=>{

$("baselinePopup").style.display="flex"

let box=$("baselineOptions");
box.innerHTML=""

const options = [
{v:2, label:"sehr vorsichtig"},
{v:3, label:"Standard"},
{v:4, label:"etwas mehr"},
{v:5, label:"hoch"},
{v:6, label:"riskant"}
];

options.forEach(o=>{
let b=document.createElement("button");

let text = o.v+" min ("+o.label+")"
if(o.v===baseline) text += " ✓"

b.innerText = text;

if(o.v===baseline) b.classList.add("selected");

b.onclick=()=>{
baseline = o.v;
localStorage.setItem("baseline", baseline);
updateBaselineDisplay();
$("baselinePopup").style.display="none"
showToast("Neue Baseline gespeichert");
};

box.appendChild(b);
});
};

$("closeBaseline").onclick=()=>{
$("baselinePopup").style.display="none"
};

// Outside click
let popup = $("baselinePopup");
let box = document.querySelector(".popupBox");

popup.onclick=(e)=>{
if(e.target===popup) popup.style.display="none"
};

box.onclick=(e)=>e.stopPropagation();

// Init
updateBaselineDisplay();

});
</script>

</body>
</html>
