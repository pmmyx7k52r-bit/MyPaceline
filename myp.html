<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VagusBuk 6.1.2</title>

<style>

:root{
--bg:#071018;
--card:#101b27;
--text:#eef3f7;
--muted:#8fa1b2;
--border:rgba(255,255,255,.06);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;

width:100%;
overflow-x:hidden;

background:var(--bg);

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

color:var(--text);
}

body{
background:
radial-gradient(
circle at top,
#0d2942 0%,
#071018 45%
);
}

.container{

width:100%;
max-width:640px;

margin:auto;

padding:
max(18px, env(safe-area-inset-top))
14px
max(120px, env(safe-area-inset-bottom));
}

/* HEADER */

.header{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:12px;

margin-top:10px;

margin-bottom:18px;
}

.logo{

font-size:clamp(34px,10vw,52px);

font-weight:800;

letter-spacing:-2px;

line-height:1;
}

.sub{

margin-top:5px;

color:var(--muted);

font-size:14px;

line-height:1.45;
}

.hrvBox{

min-width:110px;

background:
rgba(12,22,34,.92);

border:
1px solid var(--border);

border-radius:20px;

padding:12px 14px;

text-align:right;
}

.hrvLabel{

color:var(--muted);

font-size:11px;

text-transform:uppercase;

letter-spacing:1px;
}

.hrvValue{

margin-top:4px;

font-size:42px;

font-weight:800;

line-height:1;
}

.hrvTrend{

margin-top:6px;

font-size:13px;

color:#dce5ee;
}

/* CARD */

.card{

background:
rgba(12,22,34,.92);

border:
1px solid var(--border);

border-radius:24px;

padding:18px;

margin-bottom:16px;
}

.sectionTitle{

color:var(--muted);

font-size:12px;

text-transform:uppercase;

letter-spacing:1px;

margin-bottom:14px;
}

/* TODAY */

.todayBox{

border-radius:20px;

padding:18px;

background:
linear-gradient(
135deg,
#1b3146,
#132131
);
}

.todayState{

font-size:28px;

font-weight:800;

line-height:1.2;
}

.todayText{

margin-top:10px;

line-height:1.55;

color:#dce5ee;

font-size:17px;
}

/* INPUT */

.entryRow{

display:flex;

gap:10px;

flex-wrap:wrap;
}

.hrvInput{

flex:1;

min-width:0;

height:56px;

border:none;

border-radius:16px;

background:#081521;

color:white;

padding:0 16px;

font-size:24px;

outline:none;

-webkit-appearance:none;
appearance:none;
}

.hrvInput::placeholder{
color:#718396;
}

.saveBtn{

height:56px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#35c65f,
#22863e
);

color:white;

padding:0 18px;

font-size:16px;

font-weight:700;
}

/* GRAPH */

.graph{

display:flex;

align-items:flex-end;

gap:8px;

height:120px;

margin-top:14px;
}

.bar{

flex:1;

min-height:10px;

border-radius:12px 12px 6px 6px;

background:
linear-gradient(
180deg,
#4ad96f,
#236f36
);

position:relative;
}

.barValue{

position:absolute;

top:-24px;

width:100%;

text-align:center;

font-size:12px;

color:#dce5ee;
}

/* STATUS */

.statusList{
display:flex;
flex-direction:column;
gap:10px;
}

.statusBtn{

width:100%;

border:none;

border-radius:20px;

padding:16px;

color:white;

text-align:left;
}

.green{
background:
linear-gradient(
135deg,
#246c39,
#1c4d2a
);
}

.yellow{
background:
linear-gradient(
135deg,
#7c5d13,
#5e470f
);
}

.red{
background:
linear-gradient(
135deg,
#803939,
#5d2929
);
}

.statusTop{

display:flex;

justify-content:space-between;

align-items:center;
}

.statusLeft{

display:flex;

align-items:center;

gap:14px;
}

.emoji{
font-size:28px;
}

.statusTitle{

font-size:clamp(22px,7vw,30px);

font-weight:800;
}

.statusDesc{

margin-top:4px;

font-size:16px;

color:rgba(255,255,255,.84);
}

.arrow{
font-size:24px;
opacity:.55;
}

/* PANEL */

.panel{

display:none;

margin-top:12px;

background:#0d1824;

border-radius:20px;

padding:18px;
}

.panel.open{
display:block;
}

.panelTitle{

font-size:30px;

font-weight:800;
}

.panelText{

margin-top:10px;

line-height:1.55;

color:#dce4ec;

font-size:17px;
}

.trainingList{

margin-top:18px;
}

.trainingList div{

margin-bottom:10px;

line-height:1.5;
}

.warning{

margin-top:16px;

background:#2a1919;

border-radius:16px;

padding:14px;

color:#ffd6d6;

line-height:1.5;

display:none;
}

.panelBtns{

display:flex;

gap:10px;

margin-top:20px;
}

.startBtn,
.backBtn{

flex:1;

height:56px;

border:none;

border-radius:16px;

color:white;

font-size:17px;

font-weight:700;
}

.startBtn{

background:
linear-gradient(
135deg,
#35c65f,
#22863e
);
}

.backBtn{
background:#1c2c3f;
}

/* TRAINING */

.overlay{

position:fixed;

inset:0;

background:#071018;

display:none;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:
max(24px, env(safe-area-inset-top))
20px
max(36px, env(safe-area-inset-bottom));

z-index:999;
}

.circle{

width:60px;
height:60px;

border-radius:50%;

background:
radial-gradient(
circle,
#57e07b 0%,
#236f36 75%
);

transition:
width 4s linear,
height 4s linear;

box-shadow:
0 0 80px rgba(71,216,106,.25);
}

.phase{

margin-top:28px;

font-size:clamp(28px,8vw,40px);

font-weight:800;
}

.timer{

margin-top:10px;

font-size:clamp(64px,18vw,92px);

font-weight:800;

line-height:1;
}

.info{

margin-top:18px;

color:var(--muted);

font-size:18px;

line-height:1.6;

max-width:480px;
}

.stopBtn{

margin-top:30px;

width:100%;

max-width:280px;

height:56px;

border:none;

border-radius:16px;

background:#1c2c3f;

color:white;

font-size:17px;

font-weight:700;
}

/* FEEDBACK */

.feedback{

display:none;

position:fixed;

inset:0;

background:#071018;

z-index:1000;

justify-content:center;

align-items:center;

padding:24px;
}

.feedbackCard{

width:100%;

max-width:420px;

background:#101b27;

border-radius:26px;

padding:24px;

border:
1px solid var(--border);

text-align:center;
}

.feedbackTitle{

font-size:30px;

font-weight:800;
}

.feedbackBtns{

display:flex;

flex-direction:column;

gap:12px;

margin-top:24px;
}

.feedbackBtn{

border:none;

border-radius:18px;

padding:18px;

color:white;

font-size:18px;

font-weight:700;
}

.good{
background:#236f36;
}

.same{
background:#7c5d13;
}

.bad{
background:#803939;
}

</style>
</head>

<script>

let hrvData =
JSON.parse(
localStorage.getItem("vb_hrv")
) || [];

let interval = null;

/* SAVE */

function saveHRV(){

let input =
document.getElementById("hrvInput");

let val =
parseInt(input.value);

if(isNaN(val)){

input.focus();
return;
}

hrvData.push({
value:val,
time:Date.now()
});

hrvData = hrvData.slice(-30);

localStorage.setItem(
"vb_hrv",
JSON.stringify(hrvData)
);

input.value = ""

updateHRV();
}

/* UPDATE */

function updateHRV(){

if(hrvData.length === 0) return;

let today =
hrvData[hrvData.length-1].value;

document.getElementById(
"todayHRV"
).innerText = today;

updateTrend(today);
updateToday(today);
updateGraph();
}

function updateTrend(today){

if(hrvData.length < 4) return;

let old =
hrvData[hrvData.length-4].value;

if(today > old){

document.getElementById(
"trend"
).innerText = "↗ steigt"

}else if(today < old){

document.getElementById(
"trend"
).innerText = "↘ sinkt"

}else{

document.getElementById(
"trend"
).innerText = "→ stabil"
}
}

function updateToday(hrv){

let state =
document.getElementById(
"todayState"
);

let text =
document.getElementById(
"todayText"
);

if(hrv < 25){

state.innerText =
"⚠ empfindliches Nervensystem"

text.innerText =
"Heute eher kurze Regulation."

}else if(hrv < 40){

state.innerText =
"⚠ mittlere Belastbarkeit"

text.innerText =
"Sanfter Aufbau sinnvoll."

}else{

state.innerText =
"✓ gute vagale Stabilität"

text.innerText =
"Heute eignet sich längeres Training."
}
}

function updateGraph(){

let graph =
document.getElementById("graph");

graph.innerHTML = ""

let recent =
hrvData.slice(-7);

recent.forEach(item=>{

let bar =
document.createElement("div");

bar.className = "bar"

bar.style.height =
`${item.value * 2}px`;

let value =
document.createElement("div");

value.className =
"barValue"

value.innerText =
item.value;

bar.appendChild(value);

graph.appendChild(bar);

});
}

/* PANEL */

function openPanel(type){

let panel =
document.getElementById("panel");

panel.classList.add("open");

let title =
document.getElementById("panelTitle");

let text =
document.getElementById("panelText");

let list =
document.getElementById("trainingList");

let warning =
document.getElementById("warning");

let startBtn =
document.getElementById("startBtn");

warning.style.display = "none"

let hrv =
hrvData.length
? hrvData[hrvData.length-1].value
: 30;

let duration = 180;

if(hrv < 25){
duration = 90;
}else if(hrv > 45){
duration = 300;
}

if(type === "green"){

title.innerText =
"HRV-Aufbau"

text.innerText =
`Empfohlene Dauer heute: ${duration/60} Minuten`;

list.innerHTML = `
<div>• Ball wächst beim Einatmen</div>
<div>• Ball schrumpft beim Ausatmen</div>
<div>• längere Ausatmung</div>
<div>• optional Summen</div>
`;

if(hrv < 25){

warning.style.display =
"block"

warning.innerText =
"Heute vorsichtig trainieren."
}

startBtn.onclick =
()=>startTraining(duration);
}

if(type === "yellow"){

title.innerText =
"Frühe Stabilisierung"

text.innerText =
"Leichte Überlastung früh beruhigen."

list.innerHTML = `
<div>• langsamer Rhythmus</div>
<div>• Fokus auf Bewegung</div>
<div>• keine Anstrengung</div>
`;

startBtn.onclick =
()=>startTraining(60);
}

if(type === "red"){

title.innerText =
"Akute Beruhigung"

text.innerText =
"Körper zuerst beruhigen."

list.innerHTML = `
<div>• Brustbein klopfen</div>
<div>• langsam ausatmen</div>
<div>• später Summen</div>
`;

startBtn.onclick =
()=>startTraining(45);
}
}

document
.getElementById("
