M1.9

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace 1.9</title>

<meta http-equiv="Cache-Control" content="no-store">

<style>
body {
font-family: -apple-system, sans-serif;
background:#f2f2f7;
padding:20px;
text-align:center;
transition: background 0.3s;
}

.card {
background:white;
border-radius:12px;
padding:16px;
margin-bottom:15px;
}

button {
width:100%;
padding:14px;
margin-top:8px;
font-size:15px;
border:none;
border-radius:10px;
color:white;
}

/* Farben */
.primary { background:#007aff; }
.pauseBtn { background:#5ac8fa; }
.move { background:#34c759; }
.task { background:#ff9500; }
.danger { background:#ff3b30; }
.undo { background:#ccc; color:#333; }

/* Status */
#status.ok { color:#2ecc71; }
#status.mid { color:#f39c12; }
#status.bad {
color:#e74c3c;
animation: blink 1s infinite;
}
#status.pause { color:#3498db; }

body.pause { background:#eaf4ff; }

@keyframes blink {
0% {opacity:1;}
50% {opacity:0.4;}
100% {opacity:1;}
}

#timer {
font-size:26px;
margin-top:10px;
}

#warningBox {
color:red;
font-weight:bold;
height:20px;
}
</style>
</head>

<body>

<h1>Pace 1.9</h1>

<div id="start" class="card">
<p>Wie hast du geschlafen?</p>
<button onclick="startDay(100)">Gut</button>
<button onclick="startDay(80)">Geht so</button>
<button onclick="startDay(60)">Schlecht</button>
</div>

<div id="app" style="display:none;">

<div class="card">
<h2 id="status">Alles ok</h2>
<p id="energy">Energie: 100%</p>
<div id="timer" style="display:none;">00:00</div>
<div id="warningBox"></div>
</div>

<!-- PAUSE -->
<div class="card">
<button id="pauseBtn" class="pauseBtn" onclick="togglePause()">
Pause starten (hinlegen, Augen zu)
</button>
</div>

<!-- FOKUS -->
<div class="card">
<button id="focusBtn" class="primary" onclick="toggleFocus()">
Konzentriert arbeiten starten (Handy, PC, Lesen)
</button>
</div>

<!-- AKTIONEN -->
<div class="card">
<button class="move" onclick="add(2,'Kurz bewegt')">
Kurz bewegt (aufstehen, paar Schritte)
</button>

<button class="move" onclick="add(5,'Länger bewegt')">
Länger bewegt (Duschen, Küche, Wege)
</button>

<button class="task" onclick="add(7,'Etwas erledigt')">
Etwas erledigt (Telefon, Termine)
</button>

<button class="danger" onclick="add(20,'Zu viel')">
Das war zu viel (Stress, Überforderung)
</button>
</div>

<div class="card">
<h3>Heute</h3>
<div id="log"></div>
</div>

<button class="undo" onclick="undo()">Rückgängig</button>

</div>

<script>

var energy = 100;
var log = [];

var isPause = false;
var pauseStart = null;

var timer = null;
var focusStart = null;

function now(){
var d = new Date();
return d.getHours() + ":" + ("0"+d.getMinutes()).slice(-2);
}

function startDay(val){
energy = val;
log = [];

document.getElementById("start").style.display = "none"
document.getElementById("app").style.display = "block"

update();
}

function add(val, text){
if(isPause) return;

energy -= val;
if(energy < 0) energy = 0;

log.unshift({time: now(), text: text, value: val});
render();
update();
}

function togglePause(){

if(!isPause){
isPause = true;
pauseStart = Date.now();

document.body.classList.add("pause");

document.getElementById("status").innerText = "Pause läuft"
document.getElementById("status").className = "pause"

document.getElementById("pauseBtn").innerText = "Pause beenden"

} else {

isPause = false;

var min = Math.round((Date.now() - pauseStart)/60000);

log.unshift({time: now(), text: "Pause "+min+" Min", value:0});

document.body.classList.remove("pause");

document.getElementById("pauseBtn").innerText =
"Pause starten (hinlegen, Augen zu)"

render();
update();
}
}

function toggleFocus(){
if(isPause) return;

if(timer){
clearInterval(timer);
timer = null;

var min = (Date.now() - focusStart)/60000;

document.getElementById("timer").style.display = "none"
document.getElementById("focusBtn").innerText =
"Konzentriert arbeiten starten (Handy, PC, Lesen)"

var cost = 3;
if(min > 3) cost = 6;
if(min > 6) cost = 10;
if(min > 10) cost = 12;
if(min > 15) cost = 15;

add(cost, "Fokus "+Math.round(min)+" Min");

} else {

focusStart = Date.now();

document.getElementById("focusBtn").innerText = "Stoppen"
document.getElementById("timer").style.display = "block"

timer = setInterval(function(){

var sec = (Date.now() - focusStart)/1000;
var m = Math.floor(sec/60);
var s = Math.floor(sec%60);

document.getElementById("timer").innerText =
("0"+m).slice(-2)+":"+("0"+s).slice(-2);

if(m === 2 && s > 30){
document.getElementById("warningBox").innerText =
"⚠ gleich über 3 Minuten!"
}

},1000);
}
}

function undo(){
if(log.length === 0) return;

var last = log.shift();
energy += last.value;
if(energy > 100) energy = 100;

render();
update();
}

function update(){

if(isPause) return;

var status = document.getElementById("status");

document.getElementById("energy").innerText =
"Energie: " + energy + "%"

if(energy >= 70){
status.innerText = "Alles ok"
status.className = "ok"
document.body.style.background = "#eafaf1"
}
else if(energy >= 40){
status.innerText = "Langsam machen"
status.className = "mid"
document.body.style.background = "#fff8e1"
}
else{
status.innerText = "Stopp"
status.className = "bad"
document.body.style.background = "#fdecea"
}
}

function render(){
var out = ""

for(var i=0;i<log.length;i++){
var e = log[i];
out += e.time + " – " + e.text;
if(e.value) out += " (-"+e.value+")"
out += "<br>"
}

document.getElementById("log").innerHTML = out;
}

</script>

</body>
</html>
