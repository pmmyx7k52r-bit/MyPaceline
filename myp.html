<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VagusBuk A6.0</title>

<style>

:root{
--bg:#071018;
--card:#101b27;
--card2:#132235;

--text:#eef3f7;
--muted:#8a9caf;

--green:#2c9b4c;
--yellow:#8a6a14;
--red:#8d3d3d;

--border:rgba(255,255,255,.06);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;

width:100%;
overflow-x:hidden;

background:var(--bg);

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

color:var(--text);
}

body{
background:
radial-gradient(
circle at top,
#0d2840 0%,
#071018 42%
);
}

.container{

width:100%;
max-width:620px;

margin:auto;

padding:
max(18px, env(safe-area-inset-top))
14px
max(120px, env(safe-area-inset-bottom));
}

/* HEADER */

.header{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:12px;

margin-top:12px;

margin-bottom:20px;
}

.logoWrap{
min-width:0;
}

.logo{

font-size:clamp(34px,10vw,52px);

font-weight:800;

letter-spacing:-2px;

line-height:1;
}

.sub{

margin-top:6px;

color:var(--muted);

font-size:15px;

line-height:1.4;
}

/* HRV COMPACT */

.hrvBox{

min-width:108px;

background:
rgba(14,24,38,.82);

border:
1px solid var(--border);

border-radius:22px;

padding:12px 14px;

text-align:right;
}

.hrvLabel{

color:var(--muted);

font-size:11px;

letter-spacing:1px;

text-transform:uppercase;
}

.hrvValue{

margin-top:4px;

font-size:42px;

font-weight:800;

line-height:1;
}

.hrvTrend{

margin-top:6px;

color:#dce5ee;

font-size:13px;
}

/* CARD */

.card{

background:
rgba(12,22,34,.9);

border:
1px solid var(--border);

border-radius:24px;

padding:18px;

margin-bottom:16px;
}

/* HRV ENTRY */

.entryRow{

display:flex;

gap:10px;

align-items:center;

flex-wrap:wrap;
}

.hrvInput{

flex:1;

min-width:0;

height:54px;

border:none;

border-radius:16px;

background:#081521;

color:white;

padding:0 16px;

font-size:24px;

outline:none;
}

.saveBtn{

height:54px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#35c65f,
#22863e
);

color:white;

padding:0 18px;

font-size:16px;

font-weight:700;
}

/* STATUS */

.sectionTitle{

color:var(--muted);

font-size:12px;

text-transform:uppercase;

letter-spacing:1px;

margin-bottom:14px;
}

.statusList{
display:flex;
flex-direction:column;
gap:10px;
}

.statusBtn{

width:100%;

border:none;

border-radius:20px;

padding:16px;

color:white;

text-align:left;

overflow:hidden;
}

.green{
background:
linear-gradient(
135deg,
#246c39,
#1c4d2a
);
}

.yellow{
background:
linear-gradient(
135deg,
#7b5d12,
#5d470e
);
}

.red{
background:
linear-gradient(
135deg,
#803939,
#5d2929
);
}

.statusTop{

display:flex;

justify-content:space-between;

align-items:center;

gap:12px;
}

.statusLeft{

display:flex;

align-items:center;

gap:14px;

min-width:0;
}

.emoji{
font-size:28px;
}

.statusTitle{

font-size:clamp(22px,7vw,30px);

font-weight:800;

line-height:1;
}

.statusDesc{

margin-top:4px;

font-size:16px;

color:rgba(255,255,255,.82);
}

.arrow{
font-size:24px;
opacity:.55;
}

/* TRAINING PANEL */

.panel{

display:none;

margin-top:12px;

background:#0d1824;

border-radius:20px;

padding:18px;
}

.panel.open{
display:block;
}

.panelTitle{

font-size:30px;

font-weight:800;
}

.panelText{

margin-top:10px;

line-height:1.55;

color:#dce4ec;

font-size:17px;
}

.trainingList{

margin-top:18px;
}

.trainingList div{

margin-bottom:10px;

color:#edf2f7;

line-height:1.5;
}

.warning{

margin-top:16px;

background:#2a1919;

border-radius:16px;

padding:14px;

color:#ffd6d6;

line-height:1.5;

display:none;
}

.panelBtns{

display:flex;

gap:10px;

margin-top:20px;
}

.startBtn,
.backBtn{

flex:1;

height:56px;

border:none;

border-radius:16px;

color:white;

font-size:17px;

font-weight:700;
}

.startBtn{

background:
linear-gradient(
135deg,
#35c65f,
#22863e
);
}

.backBtn{
background:#1c2c3f;
}

/* TRAINING OVERLAY */

.overlay{

position:fixed;

inset:0;

background:#071018;

display:none;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:
max(24px, env(safe-area-inset-top))
20px
max(36px, env(safe-area-inset-bottom));

z-index:999;
}

.circle{

width:min(180px,52vw);
height:min(180px,52vw);

border-radius:50%;

background:
radial-gradient(
circle,
#48d86b 0%,
#236f36 72%
);

transition:2s ease-in-out;

box-shadow:
0 0 80px rgba(71,216,106,.25);
}

.expand{
transform:scale(1.16);
}

.phase{

margin-top:28px;

font-size:clamp(28px,8vw,40px);

font-weight:800;
}

.timer{

margin-top:10px;

font-size:clamp(64px,18vw,92px);

font-weight:800;

line-height:1;
}

.info{

margin-top:18px;

color:var(--muted);

font-size:18px;

line-height:1.6;

max-width:480px;
}

.stopBtn{

margin-top:30px;

width:100%;

max-width:280px;

height:56px;

border:none;

border-radius:16px;

background:#1c2c3f;

color:white;

font-size:17px;

font-weight:700;
}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div class="logoWrap">

<div class="logo">
VagusBuk
</div>

<div class="sub">
HRV-Training & Nervensystem-Regulation
</div>

</div>

<div class="hrvBox">

<div class="hrvLabel">
HRV
</div>

<div
class="hrvValue"
id="todayHRV"
>
--
</div>

<div
class="hrvTrend"
id="trend"
>
kein Trend
</div>

</div>

</div>

<!-- HRV -->

<div class="card">

<div class="sectionTitle">
HRV morgens eintragen
</div>

<div class="entryRow">

<input
type="number"
class="hrvInput"
id="hrvInput"
placeholder="z.B. 41"
>

<button
class="saveBtn"
onclick="saveHRV()"
>
Speichern
</button>

</div>

</div>

<!-- STATUS -->

<div class="card">

<div class="sectionTitle">
Wie ist es gerade?
</div>

<div class="statusList">

<button
class="statusBtn green"
onclick="openPanel('green')"
>

<div class="statusTop">

<div class="statusLeft">

<div class="emoji">
🙂
</div>

<div>

<div class="statusTitle">
Stabil
</div>

<div class="statusDesc">
Ruhig und belastbar.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="statusBtn yellow"
onclick="openPanel('yellow')"
>

<div class="statusTop">

<div class="statusLeft">

<div class="emoji">
😕
</div>

<div>

<div class="statusTitle">
Kippt leicht
</div>

<div class="statusDesc">
Erste Überlastung.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

<button
class="statusBtn red"
onclick="openPanel('red')"
>

<div class="statusTop">

<div class="statusLeft">

<div class="emoji">
😣
</div>

<div>

<div class="statusTitle">
Kippt
</div>

<div class="statusDesc">
Überreizt oder erschöpft.
</div>

</div>

</div>

<div class="arrow">
›
</div>

</div>

</button>

</div>

<!-- PANEL -->

<div
class="panel"
id="panel"
>

<div
class="panelTitle"
id="panelTitle"
>
</div>

<div
class="panelText"
id="panelText"
>
</div>

<div
class="trainingList"
id="trainingList"
>
</div>

<div
class="warning"
id="warning"
>
</div>

<div class="panelBtns">

<button
class="startBtn"
id="startBtn"
>
Training starten
</button>

<button
class="backBtn"
onclick="closePanel()"
>
Zurück
</button>

</div>

</div>

</div>

</div>

<!-- OVERLAY -->

<div
class="overlay"
id="overlay"
>

<div
class="circle"
id="circle"
></div>

<div
class="phase"
id="phase"
>
Vorbereitung
</div>

<div
class="timer"
id="timer"
>
0:00
</div>

<div
class="info"
id="info"
>
Ruhig werden.
</div>

<button
class="stopBtn"
onclick="stopTraining()"
>
Abbrechen
</button>

</div>

<script>

let hrvData =
JSON.parse(
localStorage.getItem("vb_hrv")
) || [];

let interval = null;

/* HRV */

function saveHRV(){

let val =
parseInt(
document.getElementById("hrvInput").value
);

if(!val) return;

hrvData.push({
value:val,
time:Date.now()
});

hrvData = hrvData.slice(-30);

localStorage.setItem(
"vb_hrv",
JSON.stringify(hrvData)
);

document.getElementById(
"hrvInput"
).value = ""

updateHRV();
}

function updateHRV(){

if(hrvData.length === 0) return;

let today =
hrvData[hrvData.length-1].value;

document.getElementById(
"todayHRV"
).innerText = today;

if(hrvData.length >= 4){

let last =
hrvData[hrvData.length-1].value;

let old =
hrvData[hrvData.length-4].value;

if(last > old){

document.getElementById(
"trend"
).innerText = "↗ steigt"

}else if(last < old){

document.getElementById(
"trend"
).innerText = "↘ sinkt"

}else{

document.getElementById(
"trend"
).innerText = "→ stabil"
}
}
}

/* PANEL */

function openPanel(type){

let panel =
document.getElementById("panel");

panel.classList.add("open");

let title =
document.getElementById("panelTitle");

let text =
document.getElementById("panelText");

let list =
document.getElementById("trainingList");

let warning =
document.getElementById("warning");

let startBtn =
document.getElementById("startBtn");

warning.style.display = "none"

let hrv =
hrvData.length
? hrvData[hrvData.length-1].value
: 40;

if(type === "green"){

title.innerText =
"HRV-Aufbau"

text.innerText =
"Ziel ist langfristig mehr vagale Stabilität und bessere Erholung."

list.innerHTML = `
<div>• 4 Sekunden einatmen</div>
<div>• 6 Sekunden ausatmen</div>
<div>• später Summen</div>
<div>• 3–5 Minuten Training</div>
`;

if(hrv < 30){

warning.style.display =
"block"

warning.innerText =
"HRV heute niedrig. Ruhig und ohne Leistungsdruck trainieren."
}

startBtn.onclick =
()=>startTraining("green");
}

if(type === "yellow"){

title.innerText =
"Frühe Stabilisierung"

text.innerText =
"Leichte Überlastung früh beruhigen."

list.innerHTML = `
<div>• langsam ausatmen</div>
<div>• Schultern lockern</div>
<div>• Blick beruhigen</div>
<div>• 60 Sekunden</div>
`;

startBtn.onclick =
()=>startTraining("yellow");
}

if(type === "red"){

title.innerText =
"Akute Beruhigung"

text.innerText =
"Körperreize statt intensiver Atemfokussierung."

list.innerHTML = `
<div>• Brustbein klopfen</div>
<div>• langsam ausatmen</div>
<div>• Summen</div>
<div>• 45 Sekunden</div>
`;

startBtn.onclick =
()=>startTraining("red");
}
}

function closePanel(){

document
.getElementById("panel")
.classList.remove("open");
}

/* TRAINING */

function startTraining(type){

document
.getElementById("overlay")
.style.display = "flex"

if(type === "green"){
runTraining(180);
}

if(type === "yellow"){
runTraining(60);
}

if(type === "red"){
runTraining(45);
}
}

function runTraining(seconds){

let t = seconds;
let cycle = 0;

interval = setInterval(()=>{

t--;
cycle++;

updateTimer(t);

if(cycle % 10 < 4){

setPhase("Einatmen");
expand(true);

}else{

setPhase("Ausatmen");
expand(false);
}

if(t < 60){

setInfo(
"Summen beim Ausatmen."
);
}

if(t <= 0){

finishTraining();
}

},1000);
}

function stopTraining(){

clearInterval(interval);

speechSynthesis.cancel();

document
.getElementById("overlay")
.style.display = "none"
}

function finishTraining(){

clearInterval(interval);

setPhase("Fertig");

setInfo(
"Training abgeschlossen."
);

setTimeout(()=>{

document
.getElementById("overlay")
.style.display = "none"

},1800);
}

/* HELPERS */

function updateTimer(sec){

let m =
Math.floor(sec / 60);

let s =
sec % 60;

document
.getElementById("timer")
.innerText =
`${m}:${s
.toString()
.padStart(2,"0")}`;
}

function setPhase(t){

document
.getElementById("phase")
.innerText = t;
}

function setInfo(t){

document
.getElementById("info")
.innerText = t;
}

function expand(state){

let c =
document.getElementById("circle");

if(state){

c.classList.add("expand");

}else{

c.classList.remove("expand");
}
}

updateHRV();

</script>

</body>
</html>
